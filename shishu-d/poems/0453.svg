<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1490" viewBox="0 0 1000 1490"><rect width="1000" height="1490" fill="#fffafd"/><rect x="28" y="28" width="944" height="1434" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0453</text><text x="90" y="155" font-size="34">生きてるから</text><text x="90" y="220" font-size="28">どう考えるのか</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">考えても仕方ないなら</text><text x="90" y="340" font-size="28">泣き続けよう</text><text x="90" y="380" font-size="28">逃げじゃない</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">訴えるんだ</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">世間の人に</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">私たちの心のよりどころを</text><text x="90" y="660" font-size="28">訴えるんだ</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">もう泣くしかないよ</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">そうして世間が変わるなら</text><text x="90" y="860" font-size="28">一石二鳥じゃないか</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">私たちは、晴れやかになって</text><text x="90" y="980" font-size="28">世間も晴れやかになる</text><text x="90" y="1020" font-size="28">それでも、世間が変わらないなら</text><text x="90" y="1060" font-size="28">取り止めがない</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">だって、必死なんだから</text><text x="90" y="1180" font-size="28">私たちは、生まれてから</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">必死にしがみ付いているんだから</text><text x="90" y="1300" font-size="28">世間を知ってる人</text><text x="90" y="1340" font-size="28">世間を知らない人</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">二つは違うんだよ</text><text x="90" y="1435" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>