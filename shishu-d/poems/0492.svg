<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1690" viewBox="0 0 1000 1690"><rect width="1000" height="1690" fill="#fffafd"/><rect x="28" y="28" width="944" height="1634" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0492</text><text x="90" y="155" font-size="34">張り詰めた空気</text><text x="90" y="220" font-size="28">冬風に吹かれて</text><text x="90" y="260" font-size="28">部屋の中は、</text><text x="90" y="300" font-size="28">外温と同じく</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">大い</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">張り詰められた</text><text x="90" y="500" font-size="28">空気の中に</text><text x="90" y="540" font-size="28">私がいるのは</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">どうしていいのかと</text><text x="90" y="660" font-size="28">糸口を探すけど</text><text x="90" y="700" font-size="28">その和泉が見つからない</text><text x="90" y="740" font-size="28">発端の経緯</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">どうしてか</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">私には、</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">二人を見ても</text><text x="90" y="1020" font-size="28">ただ、見向きもしない</text><text x="90" y="1060" font-size="28">張り詰められた空気</text><text x="90" y="1100" font-size="28">それは、外壁よりも</text><text x="90" y="1140" font-size="28">冷たさが</text><text x="90" y="1180" font-size="28">身体に伝わって</text><text x="90" y="1220" font-size="28">どうにかしたい</text><text x="90" y="1260" font-size="28">そんな空気になる</text><text x="90" y="1300" font-size="28">悲しいな</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">苦しいな</text><text x="90" y="1420" font-size="28">仲直りをして</text><text x="90" y="1460" font-size="28">笑顔を見せてほしい</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">そんな願いもしつつ</text><text x="90" y="1580" font-size="28">ただ、まぁまらぁ</text><text x="90" y="1620" font-size="28">そういうだけ</text><text x="90" y="1635" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>