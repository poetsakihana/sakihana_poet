<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1970" viewBox="0 0 1000 1970"><rect width="1000" height="1970" fill="#fffafd"/><rect x="28" y="28" width="944" height="1914" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0574</text><text x="90" y="155" font-size="34">さよならじゃないよね</text><text x="90" y="220" font-size="28">私は老犬になった</text><text x="90" y="260" font-size="28">介助犬として</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">今まで永く共に歩いてきた</text><text x="90" y="380" font-size="28">でも、私は考大</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">あなたと一緒に歩いてきた</text><text x="90" y="500" font-size="28">この道を歩くのも</text><text x="90" y="540" font-size="28">これで最後</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">この気持ちを</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">あなたに伝えたかった</text><text x="90" y="740" font-size="28">何て心が江しいのでしょう</text><text x="90" y="780" font-size="28">何て心が痛いのでしょう</text><text x="90" y="820" font-size="28">あなたと一緒にいた</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">その数年間</text><text x="90" y="940" font-size="28">色々な事があって</text><text x="90" y="980" font-size="28">色々な困難の中で</text><text x="90" y="1020" font-size="28">私と一緒に</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">歩いてきた</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">あなたと離れたくない</text><text x="90" y="1220" font-size="28">さよならって言いたくない</text><text x="90" y="1260" font-size="28">だって、あなたと</text><text x="90" y="1300" font-size="28">一緒に歩いてきた</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">パートナーだったのに</text><text x="90" y="1420" font-size="28">さよならなんて</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">涙が出ても言いたくない</text><text x="90" y="1540" font-size="28">これで最後なの?</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">これが本当に</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">私の役目の最後なの?</text><text x="90" y="1740" font-size="28">年をとる残酷さが</text><text x="90" y="1780" font-size="28"></text><text x="90" y="1820" font-size="28">私にはとても</text><text x="90" y="1860" font-size="28"></text><text x="90" y="1900" font-size="28">痛く感じます</text><text x="90" y="1915" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>