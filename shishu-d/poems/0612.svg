<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330"><rect width="1000" height="1330" fill="#fffafd"/><rect x="28" y="28" width="944" height="1274" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0612</text><text x="90" y="155" font-size="34">感傷的</text><text x="90" y="220" font-size="28">傷つけるのは</text><text x="90" y="260" font-size="28">相手を慕う心じゃない</text><text x="90" y="300" font-size="28">痛みを感じるのは</text><text x="90" y="340" font-size="28">慕う心</text><text x="90" y="380" font-size="28">感傷的にならないと</text><text x="90" y="420" font-size="28">同じ立場が</text><text x="90" y="460" font-size="28">わからない</text><text x="90" y="500" font-size="28">涙もろいのは</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">いいこと</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">でも、戸惑わせるから</text><text x="90" y="700" font-size="28">涙は流す</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">涙はなるべく流さない</text><text x="90" y="820" font-size="28">流したい時に</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">人の目にふられたなら</text><text x="90" y="940" font-size="28">それは、仕方ない</text><text x="90" y="980" font-size="28">我慢することなんて</text><text x="90" y="1020" font-size="28">悲しい時は</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">しなくても構わない</text><text x="90" y="1140" font-size="28">相手も感傷的に</text><text x="90" y="1180" font-size="28">思わないことが</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">大切なこと</text><text x="90" y="1275" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>