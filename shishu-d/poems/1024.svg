<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130"><rect width="1000" height="1130" fill="#fffafd"/><rect x="28" y="28" width="944" height="1074" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 1024</text><text x="90" y="155" font-size="34">剛と内引</text><text x="90" y="220" font-size="28">働き虹は数本の手足を使い</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">食糧を持ち帰る</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">小さな小さな巣の中へ</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">米つぶや貝の死骸を持ち</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">今日も働き較は働いている</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">それを見ている時は</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">「おいしそうだ」と働き虹の列に</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">横入りして較を続々と界時の口元へヘムシャムシャと食べ</text><text x="90" y="820" font-size="28">それでも働き較はせっせと食糧に没頭する</text><text x="90" y="860" font-size="28">残酷な事に全ての虹を食べてしまった距は</text><text x="90" y="900" font-size="28">どこかへ帰って行きました</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">これが生き物の世界です</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">残酷な世界が何年も続いてきたのです。</text><text x="90" y="1075" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>