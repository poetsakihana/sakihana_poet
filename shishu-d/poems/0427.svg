<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090"><rect width="1000" height="1090" fill="#fffafd"/><rect x="28" y="28" width="944" height="1034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0427</text><text x="90" y="155" font-size="34">心のゆとり</text><text x="90" y="220" font-size="28">心のゆとりがあれば</text><text x="90" y="260" font-size="28">何だってできる</text><text x="90" y="300" font-size="28">心に空虚ではなくて</text><text x="90" y="340" font-size="28">むなしくない</text><text x="90" y="380" font-size="28">心のゆとりがあれば</text><text x="90" y="420" font-size="28">辛いことがあっても</text><text x="90" y="460" font-size="28">危機を感じても</text><text x="90" y="500" font-size="28">ゆとりをしっかり</text><text x="90" y="540" font-size="28">補える事ができれば</text><text x="90" y="580" font-size="28">どんな悲しいことでも</text><text x="90" y="620" font-size="28">生きていけるのに</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">難しい、この世の中</text><text x="90" y="740" font-size="28">なかなかゆとりを</text><text x="90" y="780" font-size="28">つくることができない</text><text x="90" y="820" font-size="28">明るい考えであるのに</text><text x="90" y="860" font-size="28">ゆとりのできない</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">もどかしさ</text><text x="90" y="980" font-size="28">笑顔を持ち続けようと</text><text x="90" y="1020" font-size="28">思っている私です</text><text x="90" y="1035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>