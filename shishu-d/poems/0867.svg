<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1850" viewBox="0 0 1000 1850"><rect width="1000" height="1850" fill="#fffafd"/><rect x="28" y="28" width="944" height="1794" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0867</text><text x="90" y="155" font-size="34">ルフランの人生</text><text x="90" y="220" font-size="28">めぐるめぐる</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">人生の流れ</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">ルフランの鐘が鳴る</text><text x="90" y="420" font-size="28">ルフランの鐘が高く鳴り</text><text x="90" y="460" font-size="28">ルフランは私たちを</text><text x="90" y="500" font-size="28">人生の取り巻く渦潮のように</text><text x="90" y="540" font-size="28">行ってはきて</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">きてはいって</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">カーンコーンと</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">ルフランの鐘が私の心の中に</text><text x="90" y="820" font-size="28">焦らせるように</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">鳴り響く</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">上く</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">人生との狭間に起きる</text><text x="90" y="1100" font-size="28">物語は根強いものか</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">ね弱いものか</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">あなたの生き方しだい</text><text x="90" y="1300" font-size="28">あなたが前進してるのなら</text><text x="90" y="1340" font-size="28">ルフランの鐘は</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">鳴り止む</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">あなたが戸惑ってるなら</text><text x="90" y="1540" font-size="28">ルフランの鐘は</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">鳴り響きます</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">鳴り響くのは</text><text x="90" y="1740" font-size="28"></text><text x="90" y="1780" font-size="28">あなたの悩みや苦がそうです</text><text x="90" y="1795" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>