<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250"><rect width="1000" height="1250" fill="#fffafd"/><rect x="28" y="28" width="944" height="1194" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0558</text><text x="90" y="155" font-size="34">君の木</text><text x="90" y="220" font-size="28">あなたの心は咲いていますか?</text><text x="90" y="260" font-size="28">あなたの心は生えていますか?</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">もしも、咲き誇ってるなら</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">私は、君の木に水をふくみたい</text><text x="90" y="460" font-size="28">水を与えたいどうして、このような世界に</text><text x="90" y="500" font-size="28">あなたがその国に</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">一所懸命になりながらも心の宿り木が</text><text x="90" y="620" font-size="28">折れてしまっているのかどうして、</text><text x="90" y="660" font-size="28">このような世界にあなたが</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">しょげてまでもその国を選んだのか</text><text x="90" y="780" font-size="28">あなたは、頑張りすぎたんだあなたは、</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">自分を投げてまでも</text><text x="90" y="900" font-size="28">身体に汗を流しながらも木をからしても</text><text x="90" y="940" font-size="28">頑張りすぎたんだだから、励ますように</text><text x="90" y="980" font-size="28">水を与えたい水を与えて</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">再び、花が咲くなら木に花が咲くなら</text><text x="90" y="1100" font-size="28">私が華の加雨露で</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">浄化の水を流してあげたい</text><text x="90" y="1195" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>