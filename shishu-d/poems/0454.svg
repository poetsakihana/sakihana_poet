<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2050" viewBox="0 0 1000 2050"><rect width="1000" height="2050" fill="#fffafd"/><rect x="28" y="28" width="944" height="1994" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0454</text><text x="90" y="155" font-size="34">Delicate heart(デリケートハート)</text><text x="90" y="220" font-size="28">心が刻まれているように</text><text x="90" y="260" font-size="28">繊細な心になっている</text><text x="90" y="300" font-size="28">気をつけ合う心が</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">まとわって</text><text x="90" y="420" font-size="28">下敷きになった</text><text x="90" y="460" font-size="28">私たちは</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">細かに上弟細な事にも</text><text x="90" y="580" font-size="28">私たちは、気づく</text><text x="90" y="620" font-size="28">世界が変わりゆく</text><text x="90" y="660" font-size="28">流れに逆らえずに</text><text x="90" y="700" font-size="28">流されていく</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">濁流に飲み込まれそうに</text><text x="90" y="820" font-size="28">胃ってくる</text><text x="90" y="860" font-size="28">頑張ってんだもん</text><text x="90" y="900" font-size="28">細やかな所に</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">目が入り</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">どうすればって</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">思っちゃうから</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">だからって</text><text x="90" y="1260" font-size="28">嘆いてなんてない</text><text x="90" y="1300" font-size="28">悲しいけど、涙なんて出ない</text><text x="90" y="1340" font-size="28">慣れた環境の中に</text><text x="90" y="1380" font-size="28">飲み込まれて</text><text x="90" y="1420" font-size="28">いるんだから</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">だから、頑張ってる</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">デリケートな心でも</text><text x="90" y="1620" font-size="28">傷がつかないように</text><text x="90" y="1660" font-size="28">私たち自身で、磨いて</text><text x="90" y="1700" font-size="28">塗装してるから</text><text x="90" y="1740" font-size="28">修理をしてるから</text><text x="90" y="1780" font-size="28">だから、濁流だろうが</text><text x="90" y="1820" font-size="28">何だろうが</text><text x="90" y="1860" font-size="28">立派な枝になって</text><text x="90" y="1900" font-size="28">立派に成長を</text><text x="90" y="1940" font-size="28"></text><text x="90" y="1980" font-size="28">していくんだ</text><text x="90" y="1995" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>