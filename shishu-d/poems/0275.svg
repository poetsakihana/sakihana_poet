<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0275</text><text x="90" y="155" font-size="34">橋の上</text><text x="90" y="220" font-size="28">橋は、道を疫ぐ大切な石胡で造られた染け直</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">橋の向こうは、田舎の段々夫の優しさに染る除。</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">橋の向こうは、田舎の御基栽培のできる一っ本路。</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">橋の向こうは、緑地公園に緊がる路。</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">橋の向こうは、ビルの笑え立つ都会に続く路。</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">橋の真下には、魚が泳ぐ川が流れて、</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">先には、海に繋がっている。</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">不思議にも、橋は、子の子、それまた子に受け継いで、</text><text x="90" y="820" font-size="28">同じ情景を写しゆく。</text><text x="90" y="860" font-size="28">素敵な事に、私もその橋を見る。</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>