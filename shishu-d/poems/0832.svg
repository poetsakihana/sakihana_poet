<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170"><rect width="1000" height="1170" fill="#fffafd"/><rect x="28" y="28" width="944" height="1114" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0832</text><text x="90" y="155" font-size="34">虚仮(こけ)も一心</text><text x="90" y="220" font-size="28">悪い事をする人でも</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">心の中では善になる</text><text x="90" y="340" font-size="28">悪しき人は心では</text><text x="90" y="380" font-size="28">兆しく感じてしまう</text><text x="90" y="420" font-size="28">人間だから</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">みんなみんな</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">同じ優しさの中に包まれて</text><text x="90" y="620" font-size="28">だれでも、見捨てたり</text><text x="90" y="660" font-size="28">親はしなかったでしょう</text><text x="90" y="700" font-size="28">だって、今、生きてる事</text><text x="90" y="740" font-size="28">それが証拠</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">生きてるから幸せを感じる</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">生きてるから悪しき人でいられた</text><text x="90" y="940" font-size="28">親が大切にしたからこそ</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">あなたは生かされて</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">心のどこかで</text><text x="90" y="1115" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>