<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090"><rect width="1000" height="1090" fill="#fffafd"/><rect x="28" y="28" width="944" height="1034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 1002</text><text x="90" y="155" font-size="34">損と得</text><text x="90" y="220" font-size="28">損をしても得をしても</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">気持ちは変わらないって事はない</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">損は、本当に損、得は本当に得</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">でも心ではその損得感情がわからない</text><text x="90" y="500" font-size="28">何故なら、何故、宝くじで当たらなかったで</text><text x="90" y="540" font-size="28">損と思うのか</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">何故、当たったら得と思うのか</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">当たらない方があなたのためでもあった</text><text x="90" y="740" font-size="28">かもしれないのに</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">当たりはずれって</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">この世には決してあるものじゃないのかも</text><text x="90" y="940" font-size="28">損して得をとれとも呼ぶ</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">どっちみち特は得で損も得です</text><text x="90" y="1035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>