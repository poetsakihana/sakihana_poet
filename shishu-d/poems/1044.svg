<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 1044</text><text x="90" y="155" font-size="34">出店(でみせ)</text><text x="90" y="220" font-size="28">お察りの出店は</text><text x="90" y="260" font-size="28">何だかワクワクする</text><text x="90" y="300" font-size="28">活気にあふれて</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">大繁盛のお店がたくさん</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">花火に出店のりんご館やからあげ</text><text x="90" y="500" font-size="28">心は弾んで夢気分</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">お祭りはいつでも楽しいね</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>