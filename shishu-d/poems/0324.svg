<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1610" viewBox="0 0 1000 1610"><rect width="1000" height="1610" fill="#fffafd"/><rect x="28" y="28" width="944" height="1554" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0324</text><text x="90" y="155" font-size="34">自転車に乗れて</text><text x="90" y="220" font-size="28">私は、自転車に乗る事が</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">中学の時までできなかった。</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">でも、アドバイスをくれた</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">古くからの友人がいた。</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">その友人は、乗り方のコツを教えてくれた。</text><text x="90" y="580" font-size="28">ニニ十歳を迎えて、その友人と再会した。</text><text x="90" y="620" font-size="28">スッカリと大人びていた。</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">何だか皆、雲の上にいるみたいで、</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">手の届かない所にいるみたいで、</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">私が追いつける所に</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">友人は、先を行った。</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">自転車の乗り方を教えてくれた友人に、</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">ありがとうの言葉を言いたい。</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">だって、その友人のお陰で、</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">その後に乗れたのだから。</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">うまく乗れたから感謝を伝えたい。</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">だって、遠くまで自転車に乗っていけたから。</text><text x="90" y="1460" font-size="28">家族と一緒に自転車を</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">スイスイとこぐことができたから。</text><text x="90" y="1555" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>