<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090"><rect width="1000" height="1090" fill="#fffafd"/><rect x="28" y="28" width="944" height="1034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0262</text><text x="90" y="155" font-size="34">希望の架け橋</text><text x="90" y="220" font-size="28">私は、どうしたのか</text><text x="90" y="260" font-size="28">いつまでも追い求めた</text><text x="90" y="300" font-size="28">希望の架け橋</text><text x="90" y="340" font-size="28">どこまでも</text><text x="90" y="380" font-size="28">どこまでも</text><text x="90" y="420" font-size="28">追い求め</text><text x="90" y="460" font-size="28">その架け橋を見つけられなくて</text><text x="90" y="500" font-size="28">見失ってしまった</text><text x="90" y="540" font-size="28">希望が見えない私に</text><text x="90" y="580" font-size="28">手を差し伸べたのは</text><text x="90" y="620" font-size="28">近くにいたあなただった</text><text x="90" y="660" font-size="28">あなたの言葉で救われた</text><text x="90" y="700" font-size="28">ぽろぽろと</text><text x="90" y="740" font-size="28">ぽろぽろと</text><text x="90" y="780" font-size="28">涙が止まらなくて</text><text x="90" y="820" font-size="28">あなたが支えてくれなかったら</text><text x="90" y="860" font-size="28">私は、迷い続けてた</text><text x="90" y="900" font-size="28">救いの架け橋を</text><text x="90" y="940" font-size="28">あなたは、架けてくれた</text><text x="90" y="980" font-size="28">どれほど嬉しかっただろうか</text><text x="90" y="1020" font-size="28">たまらずに、涙があふれた</text><text x="90" y="1035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>