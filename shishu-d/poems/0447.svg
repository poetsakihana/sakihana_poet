<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1690" viewBox="0 0 1000 1690"><rect width="1000" height="1690" fill="#fffafd"/><rect x="28" y="28" width="944" height="1634" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0447</text><text x="90" y="155" font-size="34">希望の兆し</text><text x="90" y="220" font-size="28">「希望を持ったことはある?」</text><text x="90" y="260" font-size="28">「をりゃあるさ」</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">「いつごろ」</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">「今さ」</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">「何の希望」</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">「平和であればいい、その希望」</text><text x="90" y="620" font-size="28">「大きい希望だね」</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">「大きくなくっちゃ」</text><text x="90" y="740" font-size="28">希望の光は</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">いつまでも</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">私たちを支えて</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">見続けている</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">最大でも最小でも</text><text x="90" y="1100" font-size="28">希望は、私たちを</text><text x="90" y="1140" font-size="28">見放さない</text><text x="90" y="1180" font-size="28">希望という光が</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">光から望んでいるから</text><text x="90" y="1300" font-size="28">だから、平和であれ</text><text x="90" y="1340" font-size="28">だから、悩みを消して</text><text x="90" y="1380" font-size="28">だから、苦労を消して</text><text x="90" y="1420" font-size="28">いつまでもピカビカと</text><text x="90" y="1460" font-size="28">克けるように</text><text x="90" y="1500" font-size="28">希望という名の光に</text><text x="90" y="1540" font-size="28">包まれれるように</text><text x="90" y="1580" font-size="28">待ちわびている</text><text x="90" y="1620" font-size="28">兆しが現れるように</text><text x="90" y="1635" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>