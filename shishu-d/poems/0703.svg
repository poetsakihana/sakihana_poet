<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1650" viewBox="0 0 1000 1650"><rect width="1000" height="1650" fill="#fffafd"/><rect x="28" y="28" width="944" height="1594" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0703</text><text x="90" y="155" font-size="34">家族の大切さ</text><text x="90" y="220" font-size="28">いかに家族を大切に思うか</text><text x="90" y="260" font-size="28">いかに家族を愛してるか</text><text x="90" y="300" font-size="28">家族であってのありがたみ</text><text x="90" y="340" font-size="28">つくづく</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">私の心はその暖かみに</text><text x="90" y="460" font-size="28">瘍しを感じます</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">それが嫌な事でも</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">全てが学び</text><text x="90" y="660" font-size="28">全てが勉強の一つ</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">ただ、家族を信じて</text><text x="90" y="780" font-size="28">ただ、家族に包まれて</text><text x="90" y="820" font-size="28">ほのかな温もりを感じる</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">家族っていいね</text><text x="90" y="940" font-size="28">いつしか</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">そう言える日が来ると</text><text x="90" y="1060" font-size="28">いいのになぁ</text><text x="90" y="1100" font-size="28">幸せな家族ですね</text><text x="90" y="1140" font-size="28">良い家族ですね</text><text x="90" y="1180" font-size="28">そう言ってもらえるくらい</text><text x="90" y="1220" font-size="28">幸せで暖かみのある</text><text x="90" y="1260" font-size="28">そうゆう家族に</text><text x="90" y="1300" font-size="28">いつしかなりたい</text><text x="90" y="1340" font-size="28">作るとしたなら</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">そうゆう家族が一番</text><text x="90" y="1460" font-size="28">いやっ一番なんて</text><text x="90" y="1500" font-size="28">この世にない</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">Only ONE</text><text x="90" y="1595" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>