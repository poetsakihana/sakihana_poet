<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090"><rect width="1000" height="1090" fill="#fffafd"/><rect x="28" y="28" width="944" height="1034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0707</text><text x="90" y="155" font-size="34">一家団英</text><text x="90" y="220" font-size="28">和やかな暮らしに</text><text x="90" y="260" font-size="28">包まれて</text><text x="90" y="300" font-size="28">家族が一つになれる</text><text x="90" y="340" font-size="28">憩いの場所</text><text x="90" y="380" font-size="28">ほっかほかな生活</text><text x="90" y="420" font-size="28">欠かせない</text><text x="90" y="460" font-size="28">和みの家族</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">一家団母になって</text><text x="90" y="580" font-size="28">幸せで膨らみますように</text><text x="90" y="620" font-size="28">そうであれば</text><text x="90" y="660" font-size="28">どれだけ笑顔か</text><text x="90" y="700" font-size="28">暖かい暮らし</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">日常生活が</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">暖かければ</text><text x="90" y="900" font-size="28">どれだけ幸せか</text><text x="90" y="940" font-size="28">少しでも多くの時間</text><text x="90" y="980" font-size="28">いられたなら</text><text x="90" y="1020" font-size="28">嬉しいだろうか</text><text x="90" y="1035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>