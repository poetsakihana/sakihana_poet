<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0536</text><text x="90" y="155" font-size="34">月下美人</text><text x="90" y="220" font-size="28">月下美人という華やかな花が</text><text x="90" y="260" font-size="28">大きく咲いている</text><text x="90" y="300" font-size="28">華やかな白い花が</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">電から三百六十度に</text><text x="90" y="420" font-size="28">咲き誇っている</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">月下美人の花が</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">きらびやかなに</text><text x="90" y="620" font-size="28">咲いて咲いて</text><text x="90" y="660" font-size="28">誇らしげに美しい花が</text><text x="90" y="700" font-size="28">咲いている</text><text x="90" y="740" font-size="28">真夜中の花が</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">夜の花とは思えない程の</text><text x="90" y="860" font-size="28">美しい花</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>