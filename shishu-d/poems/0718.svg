<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450"><rect width="1000" height="1450" fill="#fffafd"/><rect x="28" y="28" width="944" height="1394" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0718</text><text x="90" y="155" font-size="34">常々、幸せ</text><text x="90" y="220" font-size="28">私は常々思う</text><text x="90" y="260" font-size="28">この名古屋の</text><text x="90" y="300" font-size="28">今の家族と</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">一緒にいて</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">とても幸せ</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">それは、支えん合いがあるから</text><text x="90" y="580" font-size="28">助けられてる</text><text x="90" y="620" font-size="28">周りからの支え合い</text><text x="90" y="660" font-size="28">家族同士の支え合い</text><text x="90" y="700" font-size="28">絆が芽生えて</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">心が笑顔で満たされて</text><text x="90" y="820" font-size="28">表面が幸せで満たされる</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">辛いこともいっぱいある</text><text x="90" y="940" font-size="28">けど、幸せ者だな</text><text x="90" y="980" font-size="28">幸せな家族の下で生まれたな</text><text x="90" y="1020" font-size="28">ああ、感動する</text><text x="90" y="1060" font-size="28">涙があふれる</text><text x="90" y="1100" font-size="28">気づきを互いに</text><text x="90" y="1140" font-size="28">笑いあい涙合いの</text><text x="90" y="1180" font-size="28">毎日が</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">私にとって</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">かけがえのない家族</text><text x="90" y="1380" font-size="28">宝者(たからもの)です</text><text x="90" y="1395" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>