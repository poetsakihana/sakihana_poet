<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210"><rect width="1000" height="1210" fill="#fffafd"/><rect x="28" y="28" width="944" height="1154" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0889</text><text x="90" y="155" font-size="34">千代田橋</text><text x="90" y="220" font-size="28">未来が輝かしくなれ</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">やはり田んぼを愛してた</text><text x="90" y="340" font-size="28">日本人</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">千代の永遠は</text><text x="90" y="460" font-size="28">私たちの食旧に</text><text x="90" y="500" font-size="28">未来という花が咲くだろう</text><text x="90" y="540" font-size="28">東京にも名残ある地名</text><text x="90" y="580" font-size="28">田畑を愛する</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">私たちが由来として</text><text x="90" y="700" font-size="28">残されていた事が</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">私にはわかる気がした</text><text x="90" y="820" font-size="28">大地の恵みの豊作</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">地球から与えられた環境で</text><text x="90" y="940" font-size="28">私たちは活かされている</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">私たちは見捨てられてはいない</text><text x="90" y="1060" font-size="28">何て素晴らしい街なんだろう</text><text x="90" y="1100" font-size="28">何て素晴らしい地球なんだろう</text><text x="90" y="1140" font-size="28">神様仏様ありがとう</text><text x="90" y="1155" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>