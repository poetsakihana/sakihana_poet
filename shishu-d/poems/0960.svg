<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330"><rect width="1000" height="1330" fill="#fffafd"/><rect x="28" y="28" width="944" height="1274" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0960</text><text x="90" y="155" font-size="34">なすり合い</text><text x="90" y="220" font-size="28">なすり合いは</text><text x="90" y="260" font-size="28">相手を悲しませる</text><text x="90" y="300" font-size="28">自分をも悲しむことに</text><text x="90" y="340" font-size="28">かばうことを見失い</text><text x="90" y="380" font-size="28">相手のせいだ</text><text x="90" y="420" font-size="28">相手が悪いなんて</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">なすり合うと</text><text x="90" y="540" font-size="28">綺麗になんてなれない</text><text x="90" y="580" font-size="28">汚点になっちゃう</text><text x="90" y="620" font-size="28">相手の情を受け止め</text><text x="90" y="660" font-size="28">情を流す</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">利点は必ず見つかります</text><text x="90" y="780" font-size="28">すぐ近くにあるものです</text><text x="90" y="820" font-size="28">文句はいくらでも言える</text><text x="90" y="860" font-size="28">なすり合いは、誰でもできる</text><text x="90" y="900" font-size="28">傷を削るなんて</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">人にはできるけど</text><text x="90" y="1020" font-size="28">それはしてはダメ</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">なすり合い</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">あなたのためじゃない</text><text x="90" y="1220" font-size="28">なすり合い</text><text x="90" y="1260" font-size="28">相手のためでもない</text><text x="90" y="1275" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>