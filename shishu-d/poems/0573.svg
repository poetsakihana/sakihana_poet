<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1570" viewBox="0 0 1000 1570"><rect width="1000" height="1570" fill="#fffafd"/><rect x="28" y="28" width="944" height="1514" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0573</text><text x="90" y="155" font-size="34">ハエ</text><text x="90" y="220" font-size="28">電気傘の周りを飛び回る</text><text x="90" y="260" font-size="28">ハエが生き生きと飛び回る</text><text x="90" y="300" font-size="28">ハエも必死に</text><text x="90" y="340" font-size="28">飛び回って生きている</text><text x="90" y="380" font-size="28">暖かいところ求めて</text><text x="90" y="420" font-size="28">ハエにだって</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">ちゃんと生きている</text><text x="90" y="540" font-size="28">生き物の一匹に</text><text x="90" y="580" font-size="28">あたる貝なんだから</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">人のように</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">穏やかに過ごしたいだろうに</text><text x="90" y="780" font-size="28">安心して過ごしたいだろうに</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">患づいた昧</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">決して、刺す為に</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">生きて来た訳じゃない</text><text x="90" y="1060" font-size="28">針は敢えて武器にすぎない</text><text x="90" y="1100" font-size="28">その針を無理に刺そう</text><text x="90" y="1140" font-size="28">そう思ってはいない</text><text x="90" y="1180" font-size="28">誰だって生きたいから</text><text x="90" y="1220" font-size="28">生きる為には危険を察知した</text><text x="90" y="1260" font-size="28">その時以外は</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">毒針を刺したりなんて</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">しようとも思わない</text><text x="90" y="1460" font-size="28">そこをわかって</text><text x="90" y="1500" font-size="28">知ってください</text><text x="90" y="1515" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>