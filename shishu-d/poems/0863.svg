<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1610" viewBox="0 0 1000 1610"><rect width="1000" height="1610" fill="#fffafd"/><rect x="28" y="28" width="944" height="1554" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0863</text><text x="90" y="155" font-size="34">甘える事</text><text x="90" y="220" font-size="28">まるで甘い鶴を吸ってるようだ</text><text x="90" y="260" font-size="28">私は、そうはなりたくはない</text><text x="90" y="300" font-size="28">たくさん吸う傾向にある</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">人はみんな、誰かに</text><text x="90" y="420" font-size="28">甘えてしまうのかな</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">そうゆう洪しい動物</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">一人じゃ生きていけない</text><text x="90" y="620" font-size="28">孤立じゃ…</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">でも後ろめたはやめよう</text><text x="90" y="740" font-size="28">私たちのためにならない</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">内を吸えば</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">吸うほど</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">甘えがましてしまう</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">ぶつかり合ったりする</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">だから、妥協しよう</text><text x="90" y="1180" font-size="28">甘えから卒業して</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">大人一人として</text><text x="90" y="1300" font-size="28">立派に生きて行こう</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">それって親孝行にも</text><text x="90" y="1420" font-size="28">つながるんじゃないのかな</text><text x="90" y="1460" font-size="28">それって</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">絆にもつながるんじゃないのかな</text><text x="90" y="1555" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>