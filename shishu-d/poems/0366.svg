<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1290" viewBox="0 0 1000 1290"><rect width="1000" height="1290" fill="#fffafd"/><rect x="28" y="28" width="944" height="1234" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0366</text><text x="90" y="155" font-size="34">恨む</text><text x="90" y="220" font-size="28">他の人を恨んでも何も出ては来ません</text><text x="90" y="260" font-size="28">自分を恨んでも何も出ては来ません</text><text x="90" y="300" font-size="28">悔やみや悲しみが残るだけ</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">だから後悔の念は残さない</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">そうしてほしい</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">恨んで何か特をした</text><text x="90" y="580" font-size="28">恨んでスッキリとできた</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">恨まない事が正しいのに</text><text x="90" y="700" font-size="28">恨み辛みが出てくる</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">それって良い事なの?</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">そうして思い悩んだ答えは</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">やっぱり自分の間違いの見解</text><text x="90" y="980" font-size="28">後悔したよね?</text><text x="90" y="1020" font-size="28">恨むの…疲れたよね?</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">だから、そうしてほしくはない</text><text x="90" y="1140" font-size="28">幸せでいてほしいから</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">明るくなってほしいから</text><text x="90" y="1235" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>