<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330"><rect width="1000" height="1330" fill="#fffafd"/><rect x="28" y="28" width="944" height="1274" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0955</text><text x="90" y="155" font-size="34">人と生物との共存</text><text x="90" y="220" font-size="28">人と生物は</text><text x="90" y="260" font-size="28">共存し合う仲間</text><text x="90" y="300" font-size="28">みんな、生きているもの</text><text x="90" y="340" font-size="28">人も動物も</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">みんな、生き抜くために</text><text x="90" y="460" font-size="28">この星に生まれた</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">共に生きて</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">共に歩んで</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">共に殺めてしまい</text><text x="90" y="740" font-size="28">共に愛を誓う</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">私たちゃも小さな小さな微生物</text><text x="90" y="860" font-size="28">そうだった</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">ミクロの世界の生き物が</text><text x="90" y="980" font-size="28">大先輩なんです</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">その大先輩が生きなければ</text><text x="90" y="1100" font-size="28">私たちは悲しくても</text><text x="90" y="1140" font-size="28">生きていない</text><text x="90" y="1180" font-size="28">生き物との共存</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">大先輩に感謝と愛を込めて</text><text x="90" y="1275" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>