<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450"><rect width="1000" height="1450" fill="#fffafd"/><rect x="28" y="28" width="944" height="1394" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0501</text><text x="90" y="155" font-size="34">風邪</text><text x="90" y="220" font-size="28">風邪をひいた</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">そのようなこと</text><text x="90" y="340" font-size="28">私には、気がつかずに</text><text x="90" y="380" font-size="28">弱いところを</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">菌が突ついたんだ</text><text x="90" y="500" font-size="28">風邪は、辛い</text><text x="90" y="540" font-size="28">頭がビーとするし</text><text x="90" y="580" font-size="28">咳が出て</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">他の人に</text><text x="90" y="700" font-size="28">迷惑をかけてしまうから</text><text x="90" y="740" font-size="28">風牙をひいて</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">何にもいいことない</text><text x="90" y="860" font-size="28">心も風邪をひくときがある</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">それは、心が病んで</text><text x="90" y="980" font-size="28">落ち込んでしまった</text><text x="90" y="1020" font-size="28">その時が</text><text x="90" y="1060" font-size="28">心の風邪</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">心の風邪をひくと</text><text x="90" y="1180" font-size="28">いたんだ心が</text><text x="90" y="1220" font-size="28">叫んで泣き出す</text><text x="90" y="1260" font-size="28">嫌なんだろう</text><text x="90" y="1300" font-size="28">私も風邪は</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">好きではない</text><text x="90" y="1395" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>