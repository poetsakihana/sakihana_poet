<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410"><rect width="1000" height="1410" fill="#fffafd"/><rect x="28" y="28" width="944" height="1354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0376</text><text x="90" y="155" font-size="34">お母さんの愛</text><text x="90" y="220" font-size="28">お母さんは、いつでも</text><text x="90" y="260" font-size="28">知恵を絞って上姜い発想をする</text><text x="90" y="300" font-size="28">お母さんは、いつでも</text><text x="90" y="340" font-size="28">みんなを容めてくれる</text><text x="90" y="380" font-size="28">お母さんの優しさに</text><text x="90" y="420" font-size="28">支えて生きて来れている</text><text x="90" y="460" font-size="28">一人ではできない事を</text><text x="90" y="500" font-size="28">重荷になって背負っている</text><text x="90" y="540" font-size="28">お母さん。</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">私も担ぐというけれど。</text><text x="90" y="660" font-size="28">「いいよ」と言われる</text><text x="90" y="700" font-size="28">お母さんの抱える気持ちは</text><text x="90" y="740" font-size="28">私は、辛く感じてしまう</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">だって心配だから</text><text x="90" y="860" font-size="28">みんなのことが…</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">そういう度に私は返事ができない</text><text x="90" y="980" font-size="28">自立する事が</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">親への本当のプレゼント</text><text x="90" y="1100" font-size="28">私だってと意地をはる</text><text x="90" y="1140" font-size="28">でも、事実と直面すると</text><text x="90" y="1180" font-size="28">自立できないもどかしさ</text><text x="90" y="1220" font-size="28">お母さんを幸せにできるなら</text><text x="90" y="1260" font-size="28">心配や不安を解きたい</text><text x="90" y="1300" font-size="28">そう強く思う事だけしか</text><text x="90" y="1340" font-size="28">できなかった…。</text><text x="90" y="1355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>