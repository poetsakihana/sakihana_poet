<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0973</text><text x="90" y="155" font-size="34">命を求め</text><text x="90" y="220" font-size="28">命をください</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">欠けた命は私にはあります</text><text x="90" y="340" font-size="28">心です</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">命と聞くとびっくりします</text><text x="90" y="460" font-size="28">心と聞くとびっくりします</text><text x="90" y="500" font-size="28">私には、欠けて持った心が</text><text x="90" y="540" font-size="28">他の人と違ってあります</text><text x="90" y="580" font-size="28">精神で自害してしまう心</text><text x="90" y="620" font-size="28">幻聴で傷をつける心</text><text x="90" y="660" font-size="28">欠けてしまった心です</text><text x="90" y="700" font-size="28">でも、和人後ろめたくないです</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>