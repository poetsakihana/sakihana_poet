<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170"><rect width="1000" height="1170" fill="#fffafd"/><rect x="28" y="28" width="944" height="1114" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0327</text><text x="90" y="155" font-size="34">綻(ほころ)びた…花。</text><text x="90" y="220" font-size="28">ランタナの花が住宅地に綻びた。</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">まるで紫陽花の花のように</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">ーつーつ小さく花が幾つかに</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">咲き誇っていた。</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">ランタナの花を見ると不思議にも</text><text x="90" y="580" font-size="28">和む想いになる。</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">一生懸命に咲く小さな花だからなのか。</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">華典に咲く&lt;小さな花だからなのか。</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">桃色と黄色のこつの色の花がランタナ。</text><text x="90" y="860" font-size="28">小さく小さく私達を見届けるのがランタナ。</text><text x="90" y="900" font-size="28">生命の尊きを教えてくれたのがランタナ。</text><text x="90" y="940" font-size="28">ランタナの花は、</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">夏から冬にかけて咲き誇る花。</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">元気と勇気をくれた花。</text><text x="90" y="1115" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>