<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130"><rect width="1000" height="1130" fill="#fffafd"/><rect x="28" y="28" width="944" height="1074" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0782</text><text x="90" y="155" font-size="34">日本の真ん中</text><text x="90" y="220" font-size="28">社会で生きていく</text><text x="90" y="260" font-size="28">その中で</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">日本という小さな国</text><text x="90" y="380" font-size="28">そのお国で</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">私がここに立っている</text><text x="90" y="500" font-size="28">この世界の真中で</text><text x="90" y="540" font-size="28">お空を眺めている</text><text x="90" y="580" font-size="28">そう思うと</text><text x="90" y="620" font-size="28">素敵じゃないかと</text><text x="90" y="660" font-size="28">ふと思う</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">一人という砂の一粒</text><text x="90" y="780" font-size="28">その一粒がお空を</text><text x="90" y="820" font-size="28">眺めながら</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">あれやこれやと想い</text><text x="90" y="940" font-size="28">悩んで生きている</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">所診、人間は人間の生き方に</text><text x="90" y="1060" font-size="28">一生懸命なんだ</text><text x="90" y="1075" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>