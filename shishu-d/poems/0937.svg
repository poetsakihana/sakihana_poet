<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410"><rect width="1000" height="1410" fill="#fffafd"/><rect x="28" y="28" width="944" height="1354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0937</text><text x="90" y="155" font-size="34">砂山</text><text x="90" y="220" font-size="28">砂一つが貴重だといえば</text><text x="90" y="260" font-size="28">砂一つのがちりだという</text><text x="90" y="300" font-size="28">はたまた</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">砂一つが財産だとという人もいる</text><text x="90" y="420" font-size="28">自然にできた砂丘は</text><text x="90" y="460" font-size="28">地球が起こした現実</text><text x="90" y="500" font-size="28">カラカラの暑さに</text><text x="90" y="540" font-size="28">水気のない砂山</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">人はそれを大切に思い</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">人はそれを自身と例える</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">もう聞けないかと思うと</text><text x="90" y="820" font-size="28">心苦しい心切ない</text><text x="90" y="860" font-size="28">下町のみんなが</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">町中で話題になる</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">「鐘はどうしたの」</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">「さみしい。鐘の音のない町」</text><text x="90" y="1140" font-size="28">大切な存在だからこそ</text><text x="90" y="1180" font-size="28">あの鐘はあったんだ</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">もう聞けない悲しさがある</text><text x="90" y="1300" font-size="28">町にとってかかせないかや</text><text x="90" y="1340" font-size="28">あの鐘はあったんだ</text><text x="90" y="1355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>