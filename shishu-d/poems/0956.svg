<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1690" viewBox="0 0 1000 1690"><rect width="1000" height="1690" fill="#fffafd"/><rect x="28" y="28" width="944" height="1634" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0956</text><text x="90" y="155" font-size="34">人の価値観</text><text x="90" y="220" font-size="28">私は価値のある人かな</text><text x="90" y="260" font-size="28">みんな、価値あります</text><text x="90" y="300" font-size="28">価値のない人は</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">この世界にいません</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">この世界にいることが</text><text x="90" y="500" font-size="28">価値ある存在</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">よくけなす人がいます</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">しかし、みんなは、一緒</text><text x="90" y="700" font-size="28">差別なく価値ある存在</text><text x="90" y="740" font-size="28">そして、仲間</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">たとをえ、犯罪者であっても</text><text x="90" y="860" font-size="28">たとをえ、被害者であっても</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">みんな、幼き頃は</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">スタート地点から</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">よーいどんで駆け抜けた</text><text x="90" y="1140" font-size="28">筐れた人、</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">この世にいません</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">人が勝手に作り出した言葉</text><text x="90" y="1340" font-size="28">それに過ぎません</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">価値観を考えるものじゃない</text><text x="90" y="1460" font-size="28">生き抜くことに</text><text x="90" y="1500" font-size="28">価値のあること</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">それだけを向ければ</text><text x="90" y="1620" font-size="28">どれだけ、光いて見えるかな</text><text x="90" y="1635" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>