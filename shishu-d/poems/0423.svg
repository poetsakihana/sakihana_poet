<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210"><rect width="1000" height="1210" fill="#fffafd"/><rect x="28" y="28" width="944" height="1154" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0423</text><text x="90" y="155" font-size="34">雪だるま</text><text x="90" y="220" font-size="28">いつしかの雪だるまは</text><text x="90" y="260" font-size="28">どうしているのだろう</text><text x="90" y="300" font-size="28">「端けてなくなったよ。</text><text x="90" y="340" font-size="28">もう会をないんだよ」</text><text x="90" y="380" font-size="28">それは、違うよ</text><text x="90" y="420" font-size="28">来年に向けて</text><text x="90" y="460" font-size="28">さよならして</text><text x="90" y="500" font-size="28">また会えるから</text><text x="90" y="540" font-size="28">溶けてさよならしたんだよ</text><text x="90" y="580" font-size="28">だって、雪が溶けても</text><text x="90" y="620" font-size="28">海のお母さんに帰るんだよね</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">雲さんにまた帰るんだよね</text><text x="90" y="740" font-size="28">それで、雪となって</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">私の手で</text><text x="90" y="860" font-size="28">元気な雪だるまを</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">作ることができるんだよ</text><text x="90" y="980" font-size="28">だから、雪だるまは、</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">なくならないんだよ</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">いつまでも</text><text x="90" y="1155" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>