<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170"><rect width="1000" height="1170" fill="#fffafd"/><rect x="28" y="28" width="944" height="1114" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0297</text><text x="90" y="155" font-size="34">海の航路</text><text x="90" y="220" font-size="28">私達は、地球の海の一満。</text><text x="90" y="260" font-size="28">ー満の一堆。</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">その一堆が上空に遣い上がり、</text><text x="90" y="380" font-size="28">運気や妨げる障害を乗り越える。</text><text x="90" y="420" font-size="28">その後で、降り注ぐ雨や雪。</text><text x="90" y="460" font-size="28">或いは、雷のように荒れる。</text><text x="90" y="500" font-size="28">まるで、感情の表しのように。</text><text x="90" y="540" font-size="28">そう巡り巡って、海に帰る。</text><text x="90" y="580" font-size="28">そういった航路を辿り行く。</text><text x="90" y="620" font-size="28">その一満の一鶴をどう活かすかが</text><text x="90" y="660" font-size="28">、ポイント。</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">快晴のように、笑顔を降り注ぎ。</text><text x="90" y="780" font-size="28">曇りのように、霞み続ける。</text><text x="90" y="820" font-size="28">雨のように、涙を流す。</text><text x="90" y="860" font-size="28">雷のように、摩擦を起こす。</text><text x="90" y="900" font-size="28">何れにせよ、私達は、海に帰る。</text><text x="90" y="940" font-size="28">心を通わせて…。</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">何十回何百回と繰り返す。</text><text x="90" y="1060" font-size="28">航路に従いに従う。</text><text x="90" y="1100" font-size="28">今日もこころゆく。</text><text x="90" y="1115" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>