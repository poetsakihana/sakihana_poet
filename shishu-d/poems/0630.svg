<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1610" viewBox="0 0 1000 1610"><rect width="1000" height="1610" fill="#fffafd"/><rect x="28" y="28" width="944" height="1554" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0630</text><text x="90" y="155" font-size="34">約束の指</text><text x="90" y="220" font-size="28">指功りするのって</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">ちょっとドキドキするなぁ</text><text x="90" y="340" font-size="28">何でどうしてなの</text><text x="90" y="380" font-size="28">嬉しさが心で弾むから</text><text x="90" y="420" font-size="28">心で弾む?</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">うん、ウキウキするの</text><text x="90" y="540" font-size="28">心がやさやしくなるのかな?</text><text x="90" y="580" font-size="28">心がやさきさしく</text><text x="90" y="620" font-size="28">約束した事をやぶらない</text><text x="90" y="660" font-size="28">やぶらないから</text><text x="90" y="700" font-size="28">友達と一緒になれた</text><text x="90" y="740" font-size="28">そんな気がして</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">気がするんじゃないのかな</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">いやいや、お互いに</text><text x="90" y="940" font-size="28">嬉しいんだよ</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">心が踊り出すほど</text><text x="90" y="1060" font-size="28">嬉しい気持ちで約束を</text><text x="90" y="1100" font-size="28">そうして、私のように</text><text x="90" y="1140" font-size="28">大人になって</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">絆っていう深い関係に</text><text x="90" y="1260" font-size="28">そうなる</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">深い深い絆</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">指切りは</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">そのスタートライン</text><text x="90" y="1540" font-size="28">始まりなんじゃないかな</text><text x="90" y="1555" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>