<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210"><rect width="1000" height="1210" fill="#fffafd"/><rect x="28" y="28" width="944" height="1154" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0020</text><text x="90" y="155" font-size="34">ぽろぽろと</text><text x="90" y="220" font-size="28">頭の中が真っ白になった</text><text x="90" y="260" font-size="28">ただ、ただ</text><text x="90" y="300" font-size="28">家族のありがたみを知らない自分を</text><text x="90" y="340" font-size="28">怒りで満ちていた</text><text x="90" y="380" font-size="28">自分の身勝手さに</text><text x="90" y="420" font-size="28">腹立たしかった</text><text x="90" y="460" font-size="28">そんな私に</text><text x="90" y="500" font-size="28">「大丈夫？」「心配だから」</text><text x="90" y="540" font-size="28">と声を掛けてくれることに</text><text x="90" y="580" font-size="28">なぜだろうか</text><text x="90" y="620" font-size="28">なぜだろうか</text><text x="90" y="660" font-size="28">感情がこみ上げてきて</text><text x="90" y="700" font-size="28">涙がぽろぽろと</text><text x="90" y="740" font-size="28">ぽろぽろとこぼれ落ちて</text><text x="90" y="780" font-size="28">自分の馬鹿な行動に</text><text x="90" y="820" font-size="28">愚かさを感じて</text><text x="90" y="860" font-size="28">ぽろぽろ</text><text x="90" y="900" font-size="28">ぽろぽろ</text><text x="90" y="940" font-size="28">涙がこぼれ落ちていく</text><text x="90" y="980" font-size="28">申し訳無さでいっぱいで</text><text x="90" y="1020" font-size="28">ただただ</text><text x="90" y="1060" font-size="28">家族のありがたみを</text><text x="90" y="1100" font-size="28">温かみを</text><text x="90" y="1140" font-size="28">感じることが出来た</text><text x="90" y="1155" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>