<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090"><rect width="1000" height="1090" fill="#fffafd"/><rect x="28" y="28" width="944" height="1034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0887</text><text x="90" y="155" font-size="34">人禁投橋(さきなげばし)</text><text x="90" y="220" font-size="28">猿を投げ捨てた事から</text><text x="90" y="260" font-size="28">それから名付けられた橋</text><text x="90" y="300" font-size="28">人氏投入</text><text x="90" y="340" font-size="28">猿もかわいそうに</text><text x="90" y="380" font-size="28">悪い事をしたために</text><text x="90" y="420" font-size="28">川旗へと投げ捨てられた</text><text x="90" y="460" font-size="28">何て悲しい話でしょう</text><text x="90" y="500" font-size="28">豊田の山奥の猿投</text><text x="90" y="540" font-size="28">天皇さん、どうか</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">猿を虐めないでと</text><text x="90" y="660" font-size="28">当時の人に伝えたい</text><text x="90" y="700" font-size="28">桂も私たち人の仲間です</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">人も投げられたら</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">たまったもんじゃないです</text><text x="90" y="900" font-size="28">生命が危ない</text><text x="90" y="940" font-size="28">生き物は生きてるから</text><text x="90" y="980" font-size="28">殺(あや)めないでと</text><text x="90" y="1020" font-size="28">祈ります</text><text x="90" y="1035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>