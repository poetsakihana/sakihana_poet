<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1530" viewBox="0 0 1000 1530"><rect width="1000" height="1530" fill="#fffafd"/><rect x="28" y="28" width="944" height="1474" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0335</text><text x="90" y="155" font-size="34">手紙</text><text x="90" y="220" font-size="28">大切な人へ</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">私は、一生懸命に生きています</text><text x="90" y="340" font-size="28">だから、安心して下さい</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">私は、挫ける時も</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">涙が出てしまう時もありますが、</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">大切な人の悲しい想いにならないように</text><text x="90" y="620" font-size="28">前向いて、踏こうとも耐え抜きます</text><text x="90" y="660" font-size="28">辛い事だって、人間の私だから</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">時にはあります</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">ですが、責んでもらいたくて</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">安心してもらいたくて</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">未来に向けて前へ進んでいっています</text><text x="90" y="1020" font-size="28">たとえ、離れていたとしても</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">たとえ、居なくなったとしても</text><text x="90" y="1140" font-size="28">私は、大切な人のためなら</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">生きていける自信があるんです</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">支えてくれていたから</text><text x="90" y="1340" font-size="28">微笑んでくれていたから</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">手紙として書き綴っているのです</text><text x="90" y="1460" font-size="28">私の気持ちとして</text><text x="90" y="1475" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>