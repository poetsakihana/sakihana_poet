<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130"><rect width="1000" height="1130" fill="#fffafd"/><rect x="28" y="28" width="944" height="1074" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0290</text><text x="90" y="155" font-size="34">何があろう共</text><text x="90" y="220" font-size="28">何があろう共、あなたを助けたい。</text><text x="90" y="260" font-size="28">悲しかろうが…。</text><text x="90" y="300" font-size="28">貯(けな)されようが…。</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">何があろう共、あなたを信じたい。</text><text x="90" y="420" font-size="28">始(ねた)まれようが…。</text><text x="90" y="460" font-size="28">痛(いた)まれようが…。</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">私には、すべを探したい。</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">世界の子の妄しみを包み、</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">近所の人の笑みを手綱にして継げて、</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">親の幸福や絆を深め、先祖様には、有有り難みを思い。</text><text x="90" y="820" font-size="28">その様に、在り方の人生の旅路で探し、</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">到達点までに、在り方を知る。</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">旅路は、何処まで続くのだろう・</text><text x="90" y="1020" font-size="28">代林できるあなたの胡?方を…。</text><text x="90" y="1060" font-size="28">何処まで行けば…。</text><text x="90" y="1075" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>