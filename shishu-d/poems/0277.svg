<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010"><rect width="1000" height="1010" fill="#fffafd"/><rect x="28" y="28" width="944" height="954" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0277</text><text x="90" y="155" font-size="34">虹</text><text x="90" y="220" font-size="28">虹は雨上がりの晴間に姿を現す。</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">七色に透明感を見せて、</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">紅の真下を私は行って見た事はない。</text><text x="90" y="420" font-size="28">空の彼方に写きされて、</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">どこに始点があって、終点があるのか。</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">私には、分からない。</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">赤は、情熱の色欄は、穏やかな色</text><text x="90" y="700" font-size="28">黄は、明るい色緑は、優しいの色</text><text x="90" y="740" font-size="28">青は、冷静の色藍は、静直の色</text><text x="90" y="780" font-size="28">紫は、上品な色</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">全ての色が纏まっている。</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">私は、虹の上を歩き渡りたい。</text><text x="90" y="955" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>