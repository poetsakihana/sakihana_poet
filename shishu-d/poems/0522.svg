<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1290" viewBox="0 0 1000 1290"><rect width="1000" height="1290" fill="#fffafd"/><rect x="28" y="28" width="944" height="1234" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0522</text><text x="90" y="155" font-size="34">実りの花が</text><text x="90" y="220" font-size="28">実りの花が咲くように</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">あなたの人生に明るい未来が</text><text x="90" y="340" font-size="28">近々、やってくること</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">実りの花が咲くことは</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">あなたに実力が開花すること</text><text x="90" y="540" font-size="28">今が大切なんだよ</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">穫いているあなたは、とても素晴らしい</text><text x="90" y="660" font-size="28">だから、調子がいいあなたの花は</text><text x="90" y="700" font-size="28">一歩一歩と前進し続ける</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">そうして、バラのように</text><text x="90" y="820" font-size="28">花が咲いて、刺々しいイバラも</text><text x="90" y="860" font-size="28">生えてくるかもだけど</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">それは、あなたを助けとなって</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">あなたに危険がないように</text><text x="90" y="1060" font-size="28">守っている役割のトゲ</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">花という花を咲かせようよ</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">そういうみのりの花を咲かせよう</text><text x="90" y="1235" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>