<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1650" viewBox="0 0 1000 1650"><rect width="1000" height="1650" fill="#fffafd"/><rect x="28" y="28" width="944" height="1594" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0965</text><text x="90" y="155" font-size="34">相手を毛嫌いする人</text><text x="90" y="220" font-size="28">相手を毛嫌いするのは</text><text x="90" y="260" font-size="28">あなたにとって</text><text x="90" y="300" font-size="28">嬉しいことですか?</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">あなたも見放されたり</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">避けられたりされたんですか</text><text x="90" y="500" font-size="28">孤立が多くないですか?</text><text x="90" y="540" font-size="28">綺麗好きなのはわかります</text><text x="90" y="580" font-size="28">誰でも汚いのは嫌なのかも知れない</text><text x="90" y="620" font-size="28">でも、好きで汚くしている人</text><text x="90" y="660" font-size="28">いないと思うなぁ</text><text x="90" y="700" font-size="28">心で見てご覧</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">いつでも磨ける心</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">だれでも、綺麗好きだと思うよ</text><text x="90" y="900" font-size="28">じゃないと拠り所がないから</text><text x="90" y="940" font-size="28">心や身体、本来はレンタル</text><text x="90" y="980" font-size="28">借りてるものだから</text><text x="90" y="1020" font-size="28">綺麗にするのが一番</text><text x="90" y="1060" font-size="28">美学としかではなく</text><text x="90" y="1100" font-size="28">女性ではなく</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">人間が美しくなること</text><text x="90" y="1220" font-size="28">レンタルしたCDを</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">返す時は、丁寧にしてるよね</text><text x="90" y="1340" font-size="28">それと同じで汚くしたい</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">そんな人はいないと思う</text><text x="90" y="1460" font-size="28">心でのみてごらん</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">きっと、意外にも綺麗かも知れない</text><text x="90" y="1580" font-size="28">知っている人の中で</text><text x="90" y="1595" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>