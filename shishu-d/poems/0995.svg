<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1970" viewBox="0 0 1000 1970"><rect width="1000" height="1970" fill="#fffafd"/><rect x="28" y="28" width="944" height="1914" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0995</text><text x="90" y="155" font-size="34">マイワシの学校</text><text x="90" y="220" font-size="28">マイワシには</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">学校がある</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">水族館でよーくみてみると</text><text x="90" y="420" font-size="28">先頭をきって</text><text x="90" y="460" font-size="28">まるでマイワシが</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">マイワシに教えているように</text><text x="90" y="580" font-size="28">スイスイと</text><text x="90" y="620" font-size="28">キレイに並んで</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">人を魅了させる</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">マイワシの学校</text><text x="90" y="820" font-size="28">大きな海で</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">何を教えているのかな</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">泳いでる</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">泳いでる</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">泳いでる</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">お魚さんの気持ちになって</text><text x="90" y="1260" font-size="28">泳いでる</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">どこまでも続く大海</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">お魚さんのすみか</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">お部屋もしくはお家</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">その広いお家で泳いでる</text><text x="90" y="1620" font-size="28"></text><text x="90" y="1660" font-size="28">どこまでも行く所がなくても</text><text x="90" y="1700" font-size="28">泳ぎ続けて</text><text x="90" y="1740" font-size="28"></text><text x="90" y="1780" font-size="28">どこまでも</text><text x="90" y="1820" font-size="28"></text><text x="90" y="1860" font-size="28">限りなく人危険との背合わせになっても</text><text x="90" y="1900" font-size="28">お魚さんは泳ぐことだけに必死です</text><text x="90" y="1915" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>