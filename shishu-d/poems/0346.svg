<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410"><rect width="1000" height="1410" fill="#fffafd"/><rect x="28" y="28" width="944" height="1354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0346</text><text x="90" y="155" font-size="34">田舎の畑の空気</text><text x="90" y="220" font-size="28">都会に比べて田舎はいいね</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">だって畑の景色が一面にあって</text><text x="90" y="340" font-size="28">心のこもった野菜たちが</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">人の手によって生産されていき</text><text x="90" y="460" font-size="28">私達の手元にやってくる</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">それは素晴らしい事で</text><text x="90" y="580" font-size="28">それは、素敵な事</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">田舎の空気はいいね</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">だって浴んでいるから</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">人の手によって形作られた町並み</text><text x="90" y="860" font-size="28">だから私はその空気が好き</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">とても答み切っている空気</text><text x="90" y="980" font-size="28">晴れやかな大空</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">飛び回る鳥たち</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">全てが懐かしくて</text><text x="90" y="1180" font-size="28">全てが新鮮で</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">とにかく、私は田畑や</text><text x="90" y="1300" font-size="28">優しい穏やかな人達のいる</text><text x="90" y="1340" font-size="28">田舎が好きです。</text><text x="90" y="1355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>