<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330"><rect width="1000" height="1330" fill="#fffafd"/><rect x="28" y="28" width="944" height="1274" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0435</text><text x="90" y="155" font-size="34">還盤の希望</text><text x="90" y="220" font-size="28">鍵盤には、癒しの音の源が</text><text x="90" y="260" font-size="28">あるんだって</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">鍵盤には、希望の音の源が</text><text x="90" y="380" font-size="28">あるんだって</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">ピアニストが弾く</text><text x="90" y="500" font-size="28">鍵盤は、大事に</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">ビアニストを支えてくれる</text><text x="90" y="620" font-size="28">同一体と言っても</text><text x="90" y="660" font-size="28">間違いはない</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">その源は、私たちに</text><text x="90" y="780" font-size="28">様々なピアニストの思いが</text><text x="90" y="820" font-size="28">溢れ出てくるように</text><text x="90" y="860" font-size="28">伝わってくる</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">鍵盤には、本当に</text><text x="90" y="980" font-size="28">未来の希望の音色が</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">たくさんつまっていること</text><text x="90" y="1100" font-size="28">伝えたいことが</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">まともに</text><text x="90" y="1220" font-size="28">私たちのハートに</text><text x="90" y="1260" font-size="28">伝わってくる</text><text x="90" y="1275" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>