<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370"><rect width="1000" height="1370" fill="#fffafd"/><rect x="28" y="28" width="944" height="1314" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0661</text><text x="90" y="155" font-size="34">雷雨の空に</text><text x="90" y="220" font-size="28">今日の空は</text><text x="90" y="260" font-size="28">怒ってるみたい</text><text x="90" y="300" font-size="28">ゴロゴロっと</text><text x="90" y="340" font-size="28">雲が喰っている</text><text x="90" y="380" font-size="28">空がやけに</text><text x="90" y="420" font-size="28">黒ずんでいる</text><text x="90" y="460" font-size="28">それは、雲さんが</text><text x="90" y="500" font-size="28">怒った証</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">どうして怒ってるか</text><text x="90" y="620" font-size="28">私には、わからない</text><text x="90" y="660" font-size="28">けれども、何かに</text><text x="90" y="700" font-size="28">バリバリゴロゴロと</text><text x="90" y="740" font-size="28">奮い立たせているよう</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">雲さんの機嫌が</text><text x="90" y="860" font-size="28">良くなるまで</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">おうちでじーっと</text><text x="90" y="980" font-size="28">雲さきんを見届けていよう</text><text x="90" y="1020" font-size="28">すると、怒ってた</text><text x="90" y="1060" font-size="28">雲さんが急に</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">大泣きをし始めた</text><text x="90" y="1180" font-size="28">辛かったんだろうね</text><text x="90" y="1220" font-size="28">怒りたくて</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">怒ったんじゃないんだね</text><text x="90" y="1315" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>