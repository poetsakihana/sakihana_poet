<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170"><rect width="1000" height="1170" fill="#fffafd"/><rect x="28" y="28" width="944" height="1114" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0835</text><text x="90" y="155" font-size="34">ここ最近</text><text x="90" y="220" font-size="28">昔だって</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">今だって</text><text x="90" y="340" font-size="28">泣き虫になります</text><text x="90" y="380" font-size="28">泣き貝は層くない</text><text x="90" y="420" font-size="28">世間が弱いと思うだけ</text><text x="90" y="460" font-size="28">泣き虫は強いんだ</text><text x="90" y="500" font-size="28">気づきでわかった時</text><text x="90" y="540" font-size="28">絆が芽生えた時</text><text x="90" y="580" font-size="28">泣いて笑った時</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">私たちは泣き貝なんだ</text><text x="90" y="700" font-size="28">弱くない貝なんだ</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">泣いている虫は</text><text x="90" y="820" font-size="28">心が強い証拠</text><text x="90" y="860" font-size="28">その心は誰もが持つ</text><text x="90" y="900" font-size="28">秘技</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">泣き虫毛虫</text><text x="90" y="1020" font-size="28">泣いたってかまわない</text><text x="90" y="1060" font-size="28">毛虫でも生きてる</text><text x="90" y="1100" font-size="28">だから、全て弱くない</text><text x="90" y="1115" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>