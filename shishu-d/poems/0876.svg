<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1290" viewBox="0 0 1000 1290"><rect width="1000" height="1290" fill="#fffafd"/><rect x="28" y="28" width="944" height="1234" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0876</text><text x="90" y="155" font-size="34">欲の橋</text><text x="90" y="220" font-size="28">あれ欲しいな</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">これ欲しいな</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">私たちは欲望で満たされ</text><text x="90" y="420" font-size="28">振り回されてます</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">欲の橋がつながれて</text><text x="90" y="540" font-size="28">長く長く伸びています</text><text x="90" y="580" font-size="28">でも、満たされるのが人</text><text x="90" y="620" font-size="28">ご褒美とか</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">かかせないよね</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">喜び</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">かかせないよね</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">欲望橋</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">私たちの心の根に</text><text x="90" y="1060" font-size="28">張り付いてる</text><text x="90" y="1100" font-size="28">硬くて切り離せない</text><text x="90" y="1140" font-size="28">大橋</text><text x="90" y="1180" font-size="28">地震にも耐え抜く</text><text x="90" y="1220" font-size="28">心の橋でもあります</text><text x="90" y="1235" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>