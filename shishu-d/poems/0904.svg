<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1530" viewBox="0 0 1000 1530"><rect width="1000" height="1530" fill="#fffafd"/><rect x="28" y="28" width="944" height="1474" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0904</text><text x="90" y="155" font-size="34">未来の発見</text><text x="90" y="220" font-size="28">未来を見つければ</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">誰だって現在進行する</text><text x="90" y="340" font-size="28">未来が見つからなければぱ</text><text x="90" y="380" font-size="28">誰だって現在停止する</text><text x="90" y="420" font-size="28">先行きがわからないから</text><text x="90" y="460" font-size="28">世の中は、面白く怖い</text><text x="90" y="500" font-size="28">現在進行形にならないと</text><text x="90" y="540" font-size="28">私たちは自信は持てない</text><text x="90" y="580" font-size="28">でも、先にいき過ぎても</text><text x="90" y="620" font-size="28">束(つか)の間の罠にはまる</text><text x="90" y="660" font-size="28">少し先ならきっと未来に戸惑わない</text><text x="90" y="700" font-size="28">未来発見!</text><text x="90" y="740" font-size="28">未来はどんな世界かな</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">人にはツバサがある</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">人には羽がない</text><text x="90" y="940" font-size="28">それは確かかもしれない</text><text x="90" y="980" font-size="28">でも、空は飛べるよ</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">人のふるさとが</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">大の方だから</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">きっとツバサがある</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">はえてくるよ</text><text x="90" y="1340" font-size="28">小鳥のように</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">空高く未来へと</text><text x="90" y="1460" font-size="28">飛べるように</text><text x="90" y="1475" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>