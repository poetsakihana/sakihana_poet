<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410"><rect width="1000" height="1410" fill="#fffafd"/><rect x="28" y="28" width="944" height="1354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0779</text><text x="90" y="155" font-size="34">社会の街角</text><text x="90" y="220" font-size="28">社会の中で</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">ひっそりと仔んだ古家</text><text x="90" y="340" font-size="28">民家の街が並んで</text><text x="90" y="380" font-size="28">そこは、私が訪れていた</text><text x="90" y="420" font-size="28">古家から親子が</text><text x="90" y="460" font-size="28">微笑み返しながら</text><text x="90" y="500" font-size="28">歩いていた</text><text x="90" y="540" font-size="28">社会の街角で</text><text x="90" y="580" font-size="28">誇らしそうに</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">笑いあって</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">照れそうにしゃべりあって</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">そこは、まるで暖かな</text><text x="90" y="860" font-size="28">ホッとした古家だった</text><text x="90" y="900" font-size="28">ある日、私に声かけて</text><text x="90" y="940" font-size="28">きてくれた親子連れは</text><text x="90" y="980" font-size="28">私に落とした財布を</text><text x="90" y="1020" font-size="28">笑いながら</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">「大切な忘れ物」</text><text x="90" y="1140" font-size="28">そう言って手渡してくれた</text><text x="90" y="1180" font-size="28">「ありがとう」</text><text x="90" y="1220" font-size="28">そうすぐに返事をした</text><text x="90" y="1260" font-size="28">身近に感じる</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">暖かみ</text><text x="90" y="1355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>