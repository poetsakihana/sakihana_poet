<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210"><rect width="1000" height="1210" fill="#fffafd"/><rect x="28" y="28" width="944" height="1154" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0801</text><text x="90" y="155" font-size="34">信じられない</text><text x="90" y="220" font-size="28">信じようにも</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">どうにも相手を信じられない</text><text x="90" y="340" font-size="28">そんな時、私にはまだまだだ</text><text x="90" y="380" font-size="28">私には、その人の良さがわからない</text><text x="90" y="420" font-size="28">見つからないんだ</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">そうして一歩引く</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">人は得手不得手がある</text><text x="90" y="620" font-size="28">不得手を知って</text><text x="90" y="660" font-size="28">得手を知らないなら</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">その人を見ていない</text><text x="90" y="780" font-size="28">得手のところって</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">人は沢山ある</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">それを理解しないと</text><text x="90" y="980" font-size="28">互いに肩が狭い思いをする</text><text x="90" y="1020" font-size="28">それっていけないこと</text><text x="90" y="1060" font-size="28">いけないから理解すること</text><text x="90" y="1100" font-size="28">すごい…そういふえる間柄</text><text x="90" y="1140" font-size="28">それを築けるといいね</text><text x="90" y="1155" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>