<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0519</text><text x="90" y="155" font-size="34">私が私であるように</text><text x="90" y="220" font-size="28">私が私であるように常に磨き上げ</text><text x="90" y="260" font-size="28">あなたがあなたであるように</text><text x="90" y="300" font-size="28">私が私でなければ対応が難しくて</text><text x="90" y="340" font-size="28">生きていく事が遠のくように</text><text x="90" y="380" font-size="28">私ではなくなることは人生を左右する</text><text x="90" y="420" font-size="28">私が私であれば人生は</text><text x="90" y="460" font-size="28">私を幸せにしてくれる自然と</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">それは、この世界のしくみ</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">人間の考え方がそうなのだから</text><text x="90" y="660" font-size="28">私という意識が私である意識を</text><text x="90" y="700" font-size="28">常に考え続けている</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">だから、常に私であるようにと</text><text x="90" y="820" font-size="28">頑張れ頑張れと励ましたり</text><text x="90" y="860" font-size="28">挫けるな挫けるなと努力したり</text><text x="90" y="900" font-size="28">とにかく忙しい私です</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>