<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1610" viewBox="0 0 1000 1610"><rect width="1000" height="1610" fill="#fffafd"/><rect x="28" y="28" width="944" height="1554" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0292</text><text x="90" y="155" font-size="34">大切な人へ</text><text x="90" y="220" font-size="28">私の大切な人へ。</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">私をも支えをで下さる犬切な人。</text><text x="90" y="340" font-size="28">見守る温かみの心が身に泌みて。</text><text x="90" y="380" font-size="28">前向きに地平線の先を見て。</text><text x="90" y="420" font-size="28">新たなる創造性を旬かせて。</text><text x="90" y="460" font-size="28">未来への希望を掲げる。</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">豊かな才智を使って、</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">私の後姿をそっと励ましの</text><text x="90" y="660" font-size="28">ワンステップを押して下さる。</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">肖かなる大地に向う鳥のように。</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">通かなる大地に咲き誇る花のように。</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">遥かなる大地を微風が吹き行くように。</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">違かなる大地の上を泳ぐ雲のように。</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">日も大切な人は、想いを馳せているのだろう。</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">考えに絢るその真面目さに、ーー本の綱で引き合うだろう。</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">私が大切に想う人は…。</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">それは、一人ではない。</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">この星にいる人そのものだ。</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">怒ったり、泣いたり、笑ったり、楽しんだりと</text><text x="90" y="1500" font-size="28">感情が豊かで、生き行く全ての人、</text><text x="90" y="1540" font-size="28">生きてきた全ての人は…尊敬の意を私は、掲げたい。</text><text x="90" y="1555" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>