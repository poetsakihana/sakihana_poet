<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1690" viewBox="0 0 1000 1690"><rect width="1000" height="1690" fill="#fffafd"/><rect x="28" y="28" width="944" height="1634" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0966</text><text x="90" y="155" font-size="34">人の命を奪う人</text><text x="90" y="220" font-size="28">あなたは、弱さにくれていた</text><text x="90" y="260" font-size="28">誰でもいいから</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">そのことは、あなたの支えだった</text><text x="90" y="380" font-size="28">その支えは脆くも腐っていた</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">人は命を奪い合う生き物じゃない</text><text x="90" y="500" font-size="28">愛を知ることのために生き</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">この地を大切にするために生き</text><text x="90" y="620" font-size="28">互いが傷つけ合うのは</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">一概に嬉しくも楽しくもない</text><text x="90" y="740" font-size="28">寧ろ、悲しむだろう</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">あなたの目的が誰でもなら</text><text x="90" y="860" font-size="28">あなた自身は、どうなのか</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">誰でもよかったの理由で</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">あなたに軸いかかる人がいたなら</text><text x="90" y="1060" font-size="28">それで満足できますか</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">あなたは見捨てたりする人は</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">いても見てくれる人はたくさんいる</text><text x="90" y="1260" font-size="28">罪を侵してまでものことじゃない</text><text x="90" y="1300" font-size="28">通り過ぎるだけで</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">何人の人があなたの目に触れてますか?</text><text x="90" y="1420" font-size="28">嫌な目でもいいんです</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">貯されてもいいんです</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">私も影されたこと沢山あります</text><text x="90" y="1620" font-size="28">見てくれる嬉しさ</text><text x="90" y="1635" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>