<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090"><rect width="1000" height="1090" fill="#fffafd"/><rect x="28" y="28" width="944" height="1034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0789</text><text x="90" y="155" font-size="34">リラクゼーション</text><text x="90" y="220" font-size="28">たまにはゆったりとしては</text><text x="90" y="260" font-size="28">そうですね</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">ゆったりとリラクゼーション</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">のんびりとリラクゼーション</text><text x="90" y="460" font-size="28">人はリラックスが大切</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">じゃないと身体に毒だから</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">リラックスをすると心が癒みきる</text><text x="90" y="660" font-size="28">心が答みきると</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">また仕事や勉強を頑張ろうって</text><text x="90" y="780" font-size="28">そう思えるようになる</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">羽根を伸ばしてはいかがですか?</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">人生の詰め込みは危険です</text><text x="90" y="980" font-size="28">リラックスが人の栄養素</text><text x="90" y="1020" font-size="28">必要である栄養素です</text><text x="90" y="1035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>