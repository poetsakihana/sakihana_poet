<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><rect width="1000" height="1050" fill="#fffafd"/><rect x="28" y="28" width="944" height="994" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0818</text><text x="90" y="155" font-size="34">求知心をゅうちしん)</text><text x="90" y="220" font-size="28">新しい知識を</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">人は求めちゃいます</text><text x="90" y="340" font-size="28">探完心が大勢で</text><text x="90" y="380" font-size="28">新しい知識に</text><text x="90" y="420" font-size="28">心はずみながら</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">ワクワクとなること</text><text x="90" y="540" font-size="28">星を追い求める人</text><text x="90" y="580" font-size="28">愛に深く移入する人</text><text x="90" y="620" font-size="28">異性に興味を示す人</text><text x="90" y="660" font-size="28">全ての人が求知心を</text><text x="90" y="700" font-size="28">康ね備えてます</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">探求する化学者のように</text><text x="90" y="820" font-size="28">元素の化合をどうしたら</text><text x="90" y="860" font-size="28">医療に活かせるのか</text><text x="90" y="900" font-size="28">それこそまさに</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">求知心</text><text x="90" y="995" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>