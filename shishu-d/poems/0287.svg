<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1610" viewBox="0 0 1000 1610"><rect width="1000" height="1610" fill="#fffafd"/><rect x="28" y="28" width="944" height="1554" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0287</text><text x="90" y="155" font-size="34">展しさの意味</text><text x="90" y="220" font-size="28">優しさは、優れた心を</text><text x="90" y="260" font-size="28">相手への愛しみとして与える心の事であり、</text><text x="90" y="300" font-size="28">相手をしつこく優しくして、</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">返ってその意味がついつい、</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">無くしがちになってしまいます。</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">人が喜ぶ笑顔は、人としての誇りです。</text><text x="90" y="580" font-size="28">とても嬉しい気分となってきます。</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">人を愛うとも書き、衣う、開</text><text x="90" y="700" font-size="28">つまり心から愛し、許しあう心を基づく。</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">私たちは、それを基づき、</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">優しさと愛、人と人との調和を共にし、</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">生きてゆかなくてはいけない生物である。</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">私たちは、いつしか近代未来を心望み、</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">喘械化を好み、楽ある生き方を選び、</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">選択肢相違であろう。</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">未来は未来と誤らず、</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">ブを生きる価値がどんなものかを知る権利は、</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">生きゆく最中で、誰でも計る事もできるというが、</text><text x="90" y="1460" font-size="28">委ねる愛を、そして、</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">生かされている何かを感じて生きる権利があるのです。</text><text x="90" y="1555" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>