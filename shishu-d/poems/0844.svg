<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370"><rect width="1000" height="1370" fill="#fffafd"/><rect x="28" y="28" width="944" height="1314" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0844</text><text x="90" y="155" font-size="34">うれし涙</text><text x="90" y="220" font-size="28">嬉しかった事</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">友達ができた時</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">コミュニケーションができた時</text><text x="90" y="420" font-size="28">衣食住に困らない時</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">貧困でも諦めなかった時</text><text x="90" y="540" font-size="28">全てが嬉しかった</text><text x="90" y="580" font-size="28">今も嬉しいです</text><text x="90" y="620" font-size="28">暖かく包まれてます</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">泣いたって恥じない</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">涙流す事は恥ではない</text><text x="90" y="820" font-size="28">誰が決めた事か</text><text x="90" y="860" font-size="28">決まりのないこと</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">泣いたっていいじゃないか</text><text x="90" y="980" font-size="28">懐かしんで泣いても</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">いいじゃないか</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">辛くて泣いても</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">いいじゃないか</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">一向に構わないこと</text><text x="90" y="1315" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>