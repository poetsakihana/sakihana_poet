<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1490" viewBox="0 0 1000 1490"><rect width="1000" height="1490" fill="#fffafd"/><rect x="28" y="28" width="944" height="1434" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0944</text><text x="90" y="155" font-size="34">自分勝手</text><text x="90" y="220" font-size="28">自分勝手に思い描き</text><text x="90" y="260" font-size="28">自分勝手に行動する</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">自分勝手に話して</text><text x="90" y="380" font-size="28">何のために&quot;と</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">あなたに問う</text><text x="90" y="500" font-size="28">何でも自分が一番と</text><text x="90" y="540" font-size="28">あなたは言うけど</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">何でも一番がいいわけじゃない</text><text x="90" y="660" font-size="28">とあなたにいう</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">自分が相手のためにじゃなく</text><text x="90" y="780" font-size="28">相手があなたのために</text><text x="90" y="820" font-size="28">素敵な出来事を起こしてくれてる</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">そのことを忘れないで</text><text x="90" y="940" font-size="28">私がいるから</text><text x="90" y="980" font-size="28">あなたがいる</text><text x="90" y="1020" font-size="28">あなたがいるから</text><text x="90" y="1060" font-size="28">私がいる</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">人は一人じゃ</text><text x="90" y="1180" font-size="28">生きていけない</text><text x="90" y="1220" font-size="28">自分にばかり先頭だつ</text><text x="90" y="1260" font-size="28">それは、人のためじゃない</text><text x="90" y="1300" font-size="28">あなたのためじゃない</text><text x="90" y="1340" font-size="28">みんな、一緒なんだよ</text><text x="90" y="1380" font-size="28">みんな、仲間なんだよ</text><text x="90" y="1420" font-size="28">それを忘れないで</text><text x="90" y="1435" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>