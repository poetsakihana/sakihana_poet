<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1610" viewBox="0 0 1000 1610"><rect width="1000" height="1610" fill="#fffafd"/><rect x="28" y="28" width="944" height="1554" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0648</text><text x="90" y="155" font-size="34">悪い訳ないのに</text><text x="90" y="220" font-size="28">悪い訳がないのに</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">どうして、怒られたの</text><text x="90" y="340" font-size="28">遷ったわけじゃないの</text><text x="90" y="380" font-size="28">あなたに注意をしたの</text><text x="90" y="420" font-size="28">そうしたらいけないよ</text><text x="90" y="460" font-size="28">そうしたらその先が怖いよ</text><text x="90" y="500" font-size="28">将来がとても不安だよって</text><text x="90" y="540" font-size="28">あなたにお知らせしたのよ</text><text x="90" y="580" font-size="28">お知らせ?</text><text x="90" y="620" font-size="28">相手が何でもかんでも</text><text x="90" y="660" font-size="28">悪いってことはない</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">あなたも悪いってことはない</text><text x="90" y="780" font-size="28">お互いに気がつくの</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">そうすると将来を見据えて</text><text x="90" y="900" font-size="28">きっと良くなるから</text><text x="90" y="940" font-size="28">相手が悪いとか</text><text x="90" y="980" font-size="28">自分のせいだって</text><text x="90" y="1020" font-size="28">思った時が負けなの</text><text x="90" y="1060" font-size="28">でも、勝ち負けじゃない</text><text x="90" y="1100" font-size="28">いかに子供だったか</text><text x="90" y="1140" font-size="28">いかに大人だったかが</text><text x="90" y="1180" font-size="28">そこの考えで一目瞭然</text><text x="90" y="1220" font-size="28">悪いとかあんまり</text><text x="90" y="1260" font-size="28">考えないで</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">自分の気がつく事だった</text><text x="90" y="1380" font-size="28">自分が一歩引いて</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">大人の考えじゃないと</text><text x="90" y="1500" font-size="28">って思うと心が</text><text x="90" y="1540" font-size="28">常に保たれるのよ</text><text x="90" y="1555" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>