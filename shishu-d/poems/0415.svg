<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1530" viewBox="0 0 1000 1530"><rect width="1000" height="1530" fill="#fffafd"/><rect x="28" y="28" width="944" height="1474" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0415</text><text x="90" y="155" font-size="34">思いでのアルバム</text><text x="90" y="220" font-size="28">思いでに刻まれた</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">アルバムは、</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">私達の生きてきた証明</text><text x="90" y="420" font-size="28">あの時もあった</text><text x="90" y="460" font-size="28">この時もあったと</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">その当時の自分に</text><text x="90" y="580" font-size="28">振り返る事ができ</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">会えることだってできる</text><text x="90" y="700" font-size="28">思いでの数々は、</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">大切な記念のアルバムに</text><text x="90" y="820" font-size="28">刻まれて、</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">元気だった当時を</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">思い出す</text><text x="90" y="1020" font-size="28">活きていた当時を</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">思い出す</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">懐かしい思い出のアルバム</text><text x="90" y="1220" font-size="28">心にも残っている</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">大切なアルバム</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">てンク</text><text x="90" y="1420" font-size="28">いい1り</text><text x="90" y="1460" font-size="28">いいいい</text><text x="90" y="1475" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>