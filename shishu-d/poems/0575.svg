<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1890" viewBox="0 0 1000 1890"><rect width="1000" height="1890" fill="#fffafd"/><rect x="28" y="28" width="944" height="1834" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0575</text><text x="90" y="155" font-size="34">天空の中の</text><text x="90" y="220" font-size="28">大空に飛んでも</text><text x="90" y="260" font-size="28">僕のつばさは</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">より冷たい</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">でも、寒くても</text><text x="90" y="460" font-size="28">暑くても</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">ぽくは、必死に</text><text x="90" y="580" font-size="28">目的を果たすために</text><text x="90" y="620" font-size="28">なすがままに</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">大空を飛んでいるんだ</text><text x="90" y="740" font-size="28">寒いよ寒いよと</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">凍えても</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">ぽくは、どうする事も</text><text x="90" y="940" font-size="28">諦めることも</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">できないんだ</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">高く飛び上がると</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">どこへ行くんだろうと</text><text x="90" y="1220" font-size="28">悩んでしまう</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">苦労が多い</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">僕達、とりは、</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">どんな時でも</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">しがみながら</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">大空を飛んでいるんだ</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">生きているって実感したいから</text><text x="90" y="1740" font-size="28">寒空を飛んでいるんだ</text><text x="90" y="1780" font-size="28"></text><text x="90" y="1820" font-size="28">人</text><text x="90" y="1835" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>