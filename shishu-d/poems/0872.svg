<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1770" viewBox="0 0 1000 1770"><rect width="1000" height="1770" fill="#fffafd"/><rect x="28" y="28" width="944" height="1714" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0872</text><text x="90" y="155" font-size="34">絆の紳</text><text x="90" y="220" font-size="28">絆は</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">人を助け合うことの締</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">確かなことに認め合っての絆</text><text x="90" y="420" font-size="28">犬猿の促でも涙を流しあって、</text><text x="90" y="460" font-size="28">初めての相手の良さを知るの締</text><text x="90" y="500" font-size="28">憧れて磨き、相手を客めるの絆</text><text x="90" y="540" font-size="28">褒めるのも絆</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">絆は世界共通です</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">人はみんな、一つ</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">人はみんな、一人一人のつながり</text><text x="90" y="820" font-size="28">嫌いな人がいたら</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">その人は、態々、嫌いな人として</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">演じて、気づかせてくれる</text><text x="90" y="1020" font-size="28">好きな人がいたら</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">私自身を受け入れてくれる</text><text x="90" y="1140" font-size="28">善悪ともに</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">みんな、スタート地点は同じ</text><text x="90" y="1260" font-size="28">絆を求めるために生まれ</text><text x="90" y="1300" font-size="28">愛を受けるために生まれた</text><text x="90" y="1340" font-size="28">外す人なんてこの世にいない</text><text x="90" y="1380" font-size="28">みんな、愛されて</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">みんな、人憶れて</text><text x="90" y="1500" font-size="28">いろんな経験をして</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">生きているんだ</text><text x="90" y="1620" font-size="28">幸せなんだよ</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">みんな、幸せ者です</text><text x="90" y="1715" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>