<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1570" viewBox="0 0 1000 1570"><rect width="1000" height="1570" fill="#fffafd"/><rect x="28" y="28" width="944" height="1514" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0669</text><text x="90" y="155" font-size="34">バタつかせ</text><text x="90" y="220" font-size="28">私たちは、</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">いくら地面に</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">バタつかせても</text><text x="90" y="420" font-size="28">羽ばたけるものではない</text><text x="90" y="460" font-size="28">いくら跳んでも</text><text x="90" y="500" font-size="28">私たちは、鳥のように</text><text x="90" y="540" font-size="28">飛ぶことなんて</text><text x="90" y="580" font-size="28">夢に思っても</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">できないことも</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">時と場合に</text><text x="90" y="780" font-size="28">あるのです</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">空に向かって</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">バタつかせても</text><text x="90" y="980" font-size="28">地面に足つかせてるだけ</text><text x="90" y="1020" font-size="28">私たちは、地面と</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">いつも一緒</text><text x="90" y="1140" font-size="28">寝る時も起きる時も</text><text x="90" y="1180" font-size="28">歩く時も</text><text x="90" y="1220" font-size="28">地面がなくては</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">私たちは生きて行けない</text><text x="90" y="1340" font-size="28">鳥は、地面のない</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">お鶴を飛んでいる</text><text x="90" y="1460" font-size="28">地面のありがたさを</text><text x="90" y="1500" font-size="28">そこで知るだろう</text><text x="90" y="1515" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>