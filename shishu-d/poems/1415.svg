<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 1415</text><text x="90" y="155" font-size="34">（題名未確定）</text><text x="90" y="220" font-size="28">の名前を誰が知ろうか</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">に打た私えの散を誰が知ろうか*</text><text x="90" y="340" font-size="28">弁【はなびら5】*千切各た・</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">の花を誰が知ろうか</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">もみんなもBohne diz</text><text x="90" y="540" font-size="28">がいがし】2人にでれれte ee a</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">み嗣【にじ】られる5</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">te anit An &amp; Beit“</text><text x="90" y="740" font-size="28">Hees BERTIの</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">じ気持ちにさせたくないのは当たり前</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">st好む人はいないのだからj</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>