<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1570" viewBox="0 0 1000 1570"><rect width="1000" height="1570" fill="#fffafd"/><rect x="28" y="28" width="944" height="1514" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0900</text><text x="90" y="155" font-size="34">未来の研</text><text x="90" y="220" font-size="28">華やかしい未来は</text><text x="90" y="260" font-size="28">いつだって心の中にある</text><text x="90" y="300" font-size="28">綺麗であればと</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">心の空想は広い</text><text x="90" y="420" font-size="28">空想の未来と</text><text x="90" y="460" font-size="28">現代の未来は</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">いつだってそうかも</text><text x="90" y="580" font-size="28">思い描いて描き消える</text><text x="90" y="620" font-size="28">ロウソクの灯のように</text><text x="90" y="660" font-size="28">描き消える</text><text x="90" y="700" font-size="28">未来は華やかじゃないと</text><text x="90" y="740" font-size="28">華やかしさが未来を創る</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">今じゃなくて</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">今ではなくて</text><text x="90" y="940" font-size="28">未来にかけては</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">今でなくてはならない</text><text x="90" y="1060" font-size="28">そうじゃない</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">未来が私たちを後押しするんだ</text><text x="90" y="1180" font-size="28">なんて。教えはないけど</text><text x="90" y="1220" font-size="28">未来は自分がつくるものは</text><text x="90" y="1260" font-size="28">誰だっていう</text><text x="90" y="1300" font-size="28">100パーセントの力と</text><text x="90" y="1340" font-size="28">100パーセントの願いじゃ</text><text x="90" y="1380" font-size="28">巻が大きい</text><text x="90" y="1420" font-size="28">未来を願うことって</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">大切なことだよね</text><text x="90" y="1515" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>