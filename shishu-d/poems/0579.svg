<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2930" viewBox="0 0 1000 2930"><rect width="1000" height="2930" fill="#fffafd"/><rect x="28" y="28" width="944" height="2874" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0579</text><text x="90" y="155" font-size="34">独と狐の噂</text><text x="90" y="220" font-size="28">たぬきと狼がいかに</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">どんなに嘘だといわれても</text><text x="90" y="340" font-size="28">本当はちがうよ</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">たぬきは、うそつかない</text><text x="90" y="460" font-size="28">きつねだってうそつかない</text><text x="90" y="500" font-size="28">化けたりしたいし</text><text x="90" y="540" font-size="28">騙したりもしない</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">そのようなことをして</text><text x="90" y="660" font-size="28">えらいなんて思えない</text><text x="90" y="700" font-size="28">いい事だって思えない</text><text x="90" y="740" font-size="28">だから、私、きつねも</text><text x="90" y="780" font-size="28">ぼく、たぬきも</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">人に嘘なんてつかないよ</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">素直で、ありのままの</text><text x="90" y="980" font-size="28">ぼくと私でいるんだよ</text><text x="90" y="1020" font-size="28">人さん…どうか</text><text x="90" y="1060" font-size="28">理解してね</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">人さん…どうか</text><text x="90" y="1180" font-size="28">悪く見ないでね</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">人と安心して</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">私のおでこを</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">なでてくれたね</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">私と触れ合ったね</text><text x="90" y="1540" font-size="28">安心したよ</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">私がさみしい時だって</text><text x="90" y="1660" font-size="28">いつも一緒だったね</text><text x="90" y="1700" font-size="28"></text><text x="90" y="1740" font-size="28">上手くいかなかった時でも</text><text x="90" y="1780" font-size="28">大丈夫って</text><text x="90" y="1820" font-size="28">支えてくれたね</text><text x="90" y="1860" font-size="28"></text><text x="90" y="1900" font-size="28">その気持ち</text><text x="90" y="1940" font-size="28"></text><text x="90" y="1980" font-size="28">私にちゃんと伝わったよ</text><text x="90" y="2020" font-size="28">人と私、イルカは、</text><text x="90" y="2060" font-size="28"></text><text x="90" y="2100" font-size="28">いつでも心で通じ合えるんだよ</text><text x="90" y="2140" font-size="28"></text><text x="90" y="2180" font-size="28">鳴いた音波で</text><text x="90" y="2220" font-size="28">あなたがどうしているのか</text><text x="90" y="2260" font-size="28">あなたがどのような</text><text x="90" y="2300" font-size="28">環境にいるのか</text><text x="90" y="2340" font-size="28">すぐわかるんだよ</text><text x="90" y="2380" font-size="28"></text><text x="90" y="2420" font-size="28">頭は良いのか悪いのか</text><text x="90" y="2460" font-size="28">私自身は、わからない</text><text x="90" y="2500" font-size="28">けれども、あなたのこと</text><text x="90" y="2540" font-size="28">音波でキャッチして</text><text x="90" y="2580" font-size="28">いつでも、どの合図でも</text><text x="90" y="2620" font-size="28">あなたに応えます</text><text x="90" y="2660" font-size="28"></text><text x="90" y="2700" font-size="28">だって、この広い海が</text><text x="90" y="2740" font-size="28">好きだから</text><text x="90" y="2780" font-size="28"></text><text x="90" y="2820" font-size="28">壁で囲われてるけど</text><text x="90" y="2860" font-size="28">安心していられるから</text><text x="90" y="2875" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>