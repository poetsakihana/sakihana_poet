<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450"><rect width="1000" height="1450" fill="#fffafd"/><rect x="28" y="28" width="944" height="1394" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0295</text><text x="90" y="155" font-size="34">折り紙</text><text x="90" y="220" font-size="28">赤色や黄色、様々な色のある折り紙。</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">私が選ぶ折り紙は、その完成する上での物色。</text><text x="90" y="340" font-size="28">赤ならりんご。</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">椿ならみかん。</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">黄ならバナナ。</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">青なら…そういうように。</text><text x="90" y="620" font-size="28">物色から見て折る。</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">でも、折り紙の世界は、広いです。</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">折り紙は、私達を楽しませてくれる遊びの一つ。</text><text x="90" y="820" font-size="28">折り紙に気持ちをよせて丁寧に、</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">折る感じがその折り紙の世界。</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">誘われていくのなら、折る時。</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">今日は、和鶴を折ろうかな。</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">明日は、お花を折ろうかな。</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">そうして、折り紙達は、</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">人に折られながら生きていくのです。</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">私達の思いのままに馳せているのです。</text><text x="90" y="1395" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>