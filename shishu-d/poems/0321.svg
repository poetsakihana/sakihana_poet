<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410"><rect width="1000" height="1410" fill="#fffafd"/><rect x="28" y="28" width="944" height="1354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0321</text><text x="90" y="155" font-size="34">手をつなぐ</text><text x="90" y="220" font-size="28">小さな私をお母さんが手をつないで、</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">ゆらゆらと</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">「ルンルンルン」と口遊むお母さんの笑顔。</text><text x="90" y="420" font-size="28">手をつなぐと心が晴れる。</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">お母さんの手をつなぐと</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">今、悩んでいた事が解きほぐされて</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">昨日、悲しんでいた事が消されていく</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">何だろう</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">私の小さな手を包んでくれる</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">温もりあるお母さんの大きな手の温かみは…。</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">魔法みたいに嫌な事が消されて、</text><text x="90" y="1020" font-size="28">笑みが零れそうになる。</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">何だろう?</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">私を包んでくれていたあの温かみは。</text><text x="90" y="1220" font-size="28">今でも鮮明に覚えています。</text><text x="90" y="1260" font-size="28">だから、優しくなれたのです。</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">だから、笑顔でいられたのです。</text><text x="90" y="1355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>