<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450"><rect width="1000" height="1450" fill="#fffafd"/><rect x="28" y="28" width="944" height="1394" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0313</text><text x="90" y="155" font-size="34">大事なこと</text><text x="90" y="220" font-size="28">記念日を祝うこと、大事なこと</text><text x="90" y="260" font-size="28">相手をやさきしくすること、大事なこと</text><text x="90" y="300" font-size="28">相手を労わること、大事なこと</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">苦しい時に心を休めること、大事なこと</text><text x="90" y="420" font-size="28">大事なことは、色々とあります。</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">あなたの一番大事なことは何ですか?</text><text x="90" y="540" font-size="28">私の大事なことは、私自身を愛して、</text><text x="90" y="580" font-size="28">相手を幸せ、一杯にする事</text><text x="90" y="620" font-size="28">大事なことは、大きなことであって</text><text x="90" y="660" font-size="28">重要なことでもあります。</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">重要だからこそ、相手や身近な人に</text><text x="90" y="780" font-size="28">おくりたい気持ちがあるのです。</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">大事なことを大切にしていけば</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">どのような事だってのりこえられる</text><text x="90" y="980" font-size="28">絆を与えることも、愛しくおもうことも</text><text x="90" y="1020" font-size="28">全てがあなたを助けてくれること</text><text x="90" y="1060" font-size="28">相手も助けてくれること</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">だから、大事なことを一つ</text><text x="90" y="1180" font-size="28">考えてみてください。</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">しきたり、大事なこと</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">親へのお礼と感謝、大事なこと</text><text x="90" y="1380" font-size="28">みんな、みんな、大事なこと</text><text x="90" y="1395" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>