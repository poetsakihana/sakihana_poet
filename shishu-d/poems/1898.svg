" font-size="28">勇気が</text><text x="90" y="1420" font-size="28">出ない。</text><text x="90" y="1460" font-size="28">仕草</text><text x="90" y="1500" font-size="28">迷う.</text><text x="90" y="1540" font-size="28">本当の</text><text x="90" y="1580" font-size="28">嫌われたら</text><text x="90" y="1620" font-size="28">気持ら</text><text x="90" y="1660" font-size="28">どうしよう</text><text x="90" y="1700" font-size="28">市ロ</text><text x="90" y="1740" font-size="28">片思い</text><text x="90" y="1780" font-size="28">つづく</text><text x="90" y="1820" font-size="28">っ\</text><text x="90" y="1860" font-size="28">片思い</text><text x="90" y="1900" font-size="28">いっか</text><text x="90" y="1940" font-size="28">つづく</text><text x="90" y="1980" font-size="28">両思いに</text><text x="90" y="2020" font-size="28">なれます</text><text x="90" y="2060" font-size="28">ように...</text><text x="90" y="2100" font-size="28">でも、この想いは</text><text x="90" y="2140" font-size="28">わたしを強くしてくれろ。</text><text x="90" y="2180" font-size="28">いつか案顔で</text><text x="90" y="2220" font-size="28">いつかは</text><text x="90" y="2260" font-size="28">この想い</text><text x="90" y="2300" font-size="28">伝えられますように。</text><text x="90" y="2340" font-size="28">届くのかな。</text><text x="90" y="2355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>