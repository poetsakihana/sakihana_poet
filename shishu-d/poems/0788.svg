<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><rect width="1000" height="1050" fill="#fffafd"/><rect x="28" y="28" width="944" height="994" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0788</text><text x="90" y="155" font-size="34">決別</text><text x="90" y="220" font-size="28">暇人各い決別</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">相手を信じての決別</text><text x="90" y="340" font-size="28">信じ合えなかった決別</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">いい言葉ではないけど</text><text x="90" y="460" font-size="28">岐路に立つ時に</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">決別という別れ道にたどり着く</text><text x="90" y="580" font-size="28">今まで仲が良かった子との決別</text><text x="90" y="620" font-size="28">別れ惜しい決別だってある</text><text x="90" y="660" font-size="28">人生いろいろ</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">本当に色々な事があって</text><text x="90" y="780" font-size="28">再開や決別がある</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">涙で前が見えない程</text><text x="90" y="900" font-size="28">涙を拭い別れてしまう</text><text x="90" y="940" font-size="28">辛く惜しい人生の方が</text><text x="90" y="980" font-size="28">断然多いかもしれない</text><text x="90" y="995" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>