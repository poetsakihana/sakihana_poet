<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1810" viewBox="0 0 1000 1810"><rect width="1000" height="1810" fill="#fffafd"/><rect x="28" y="28" width="944" height="1754" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0619</text><text x="90" y="155" font-size="34">コンパスの還</text><text x="90" y="220" font-size="28">コンパスの軸が</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">いくら右往左往しても</text><text x="90" y="340" font-size="28">私の進むべき道は</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">かわりない</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">コンパスの軸が</text><text x="90" y="540" font-size="28">北を指そうとするなら</text><text x="90" y="580" font-size="28">北へ向かう</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">けれども</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">心の道・人生はかわらない</text><text x="90" y="780" font-size="28">私が進む道と</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">人生の進む道は</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">全く違う</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">北を指しても</text><text x="90" y="1060" font-size="28">南を指しても</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">人生が北なら北へ進む</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">人生が南西なら南西へ進む</text><text x="90" y="1260" font-size="28">けれども私が歩く方角が</text><text x="90" y="1300" font-size="28">西なら私自身は西へ進む</text><text x="90" y="1340" font-size="28">けれども人生はそれに</text><text x="90" y="1380" font-size="28">従わない</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">決められた定められた道だから</text><text x="90" y="1500" font-size="28">コンパスに身を委ねる事は</text><text x="90" y="1540" font-size="28">私たち人間には</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">コンパスに託すことは</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">できない。</text><text x="90" y="1740" font-size="28">悲しくてもできない</text><text x="90" y="1755" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>