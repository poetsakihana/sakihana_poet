<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 2041</text><text x="90" y="155" font-size="34">恋愛ストーリーポエム</text><text x="90" y="220" font-size="28">１４。愛って、こんなに苦しいの？</text><text x="90" y="260" font-size="28">わか記9もズブ|た</text><text x="90" y="300" font-size="28">こんなほも苦しいなして…。</text><text x="90" y="340" font-size="28">おからなかっ。</text><text x="90" y="380" font-size="28">あなたに会えない時があるく</text><text x="90" y="420" font-size="28">こんなにも胸が騒がしいの。</text><text x="90" y="460" font-size="28">眠れない夜の日に、何度も</text><text x="90" y="500" font-size="28">おなｔのＳＮＳを見７しまう</text><text x="90" y="540" font-size="28">こんな私、嫌いですか？</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>