<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1970" viewBox="0 0 1000 1970"><rect width="1000" height="1970" fill="#fffafd"/><rect x="28" y="28" width="944" height="1914" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0460</text><text x="90" y="155" font-size="34">hills(ヒルズ)</text><text x="90" y="220" font-size="28">近所の区域は、</text><text x="90" y="260" font-size="28">とても坂が多く</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">とくに坂の次に坂と</text><text x="90" y="380" font-size="28">坂ばかりの</text><text x="90" y="420" font-size="28">坂の山がある</text><text x="90" y="460" font-size="28">その坂を登っても</text><text x="90" y="500" font-size="28">到達するまでに</text><text x="90" y="540" font-size="28">足が一歩一歩と</text><text x="90" y="580" font-size="28">踏み歩くのが</text><text x="90" y="620" font-size="28">長く険しい</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">大形山、滝ノ水</text><text x="90" y="740" font-size="28">地名をあげても</text><text x="90" y="780" font-size="28">山だとすぐにわかる</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">大形山は、</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">山道がすごい事を</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">意味してる</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">薄ノ水は、</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">昔、滝があった事に</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">山奥だとわかる</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">山の項きは、</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">人生の頂点と</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">考える事もできる</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">だから、登る時は</text><text x="90" y="1620" font-size="28"></text><text x="90" y="1660" font-size="28">身体に負担がかかる5</text><text x="90" y="1700" font-size="28"></text><text x="90" y="1740" font-size="28">人生を表現してるから人昌</text><text x="90" y="1780" font-size="28">平坦ではない分が計、</text><text x="90" y="1820" font-size="28">それに気づくことが</text><text x="90" y="1860" font-size="28"></text><text x="90" y="1900" font-size="28">できるんだ</text><text x="90" y="1915" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>