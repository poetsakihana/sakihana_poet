<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><rect width="1000" height="1050" fill="#fffafd"/><rect x="28" y="28" width="944" height="994" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0377</text><text x="90" y="155" font-size="34">明るい未来</text><text x="90" y="220" font-size="28">描く私の頭の中のキャンパス</text><text x="90" y="260" font-size="28">明るい未来が常に描かれ</text><text x="90" y="300" font-size="28">幸せいっぱいになる</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">明るい未来が描かれていた</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">その夢がいつ叶うのか</text><text x="90" y="500" font-size="28">不安に思えてきた</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">でも、水平線に見えるその未来は</text><text x="90" y="620" font-size="28">どう見ても</text><text x="90" y="660" font-size="28">透き通った青空でしかなく</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">明るい未来が見えず</text><text x="90" y="780" font-size="28">でも、信じていた</text><text x="90" y="820" font-size="28">明るい未来のことを本</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">太陽の陽を見ながら生って際</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">そう思うのでした</text><text x="90" y="995" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>