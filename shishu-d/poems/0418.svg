<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410"><rect width="1000" height="1410" fill="#fffafd"/><rect x="28" y="28" width="944" height="1354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0418</text><text x="90" y="155" font-size="34">ダメだったなんて</text><text x="90" y="220" font-size="28">ダメだったなんて</text><text x="90" y="260" font-size="28">言わないで欲しい</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">一生懸命だった</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">私自身だから</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">ダメだったと</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">言われると</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">悲しくなる</text><text x="90" y="700" font-size="28">惨めに思えてしまう</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">支えたい気持ちがあったのは</text><text x="90" y="820" font-size="28">間違いなかった</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">どう違ったのか</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">私に教えてください</text><text x="90" y="1020" font-size="28">支え過ぎたから</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">労わり過ぎたから</text><text x="90" y="1140" font-size="28">励まし過ぎたから</text><text x="90" y="1180" font-size="28">どうすればいいのかと</text><text x="90" y="1220" font-size="28">君とそう言われ離れた</text><text x="90" y="1260" font-size="28">その場所に</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">たたず