<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330"><rect width="1000" height="1330" fill="#fffafd"/><rect x="28" y="28" width="944" height="1274" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0890</text><text x="90" y="155" font-size="34">納屋橋</text><text x="90" y="220" font-size="28">納屋のあった橋</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">名古屋を代表する</text><text x="90" y="340" font-size="28">堀六の橋</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">悩んだ時には</text><text x="90" y="460" font-size="28">納屋橋の川をみてごらん</text><text x="90" y="500" font-size="28">濁ってはいるけど</text><text x="90" y="540" font-size="28">立派な堀川が流れてる</text><text x="90" y="580" font-size="28">私たちの家計に必要な</text><text x="90" y="620" font-size="28">大事な川</text><text x="90" y="660" font-size="28">みんなで助け合い</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">濁さない川にしよう</text><text x="90" y="780" font-size="28">いつか透き通る綺麗な川にしよう</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">みんなを助ける堀川</text><text x="90" y="900" font-size="28">みんなを支える納屋橋</text><text x="90" y="940" font-size="28">切ない時はみてごらん</text><text x="90" y="980" font-size="28">吹っ切れるように</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">川はじどこまでもながれてく</text><text x="90" y="1100" font-size="28">人もまた</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">つながれていく</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">そう教えてくれてます</text><text x="90" y="1275" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>