<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1290" viewBox="0 0 1000 1290"><rect width="1000" height="1290" fill="#fffafd"/><rect x="28" y="28" width="944" height="1234" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0834</text><text x="90" y="155" font-size="34">恥ずかしい秋空</text><text x="90" y="220" font-size="28">雲はすっかり高く上がって</text><text x="90" y="260" font-size="28">たくさんの雲が広がる</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">「雲さん、今日も高いですね」</text><text x="90" y="380" font-size="28">そんな会話をしながら</text><text x="90" y="420" font-size="28">澄み渡る空を見上げてる</text><text x="90" y="460" font-size="28">雲さん、今日も高いなぁ</text><text x="90" y="500" font-size="28">恥ずかしがって高く登ったかな</text><text x="90" y="540" font-size="28">それとも</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">かくれんぽをしてるのかな</text><text x="90" y="660" font-size="28">雲さんと会話してる</text><text x="90" y="700" font-size="28">今日の日は、</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">たくさんの心で満たされて</text><text x="90" y="820" font-size="28">たくさんの愛で満たされる</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">話をしてくれた人や</text><text x="90" y="940" font-size="28">挨拶をしてくれた人</text><text x="90" y="980" font-size="28">悪口を8言うように言った人</text><text x="90" y="1020" font-size="28">みんな、生きてる</text><text x="90" y="1060" font-size="28">みんな、私を見てくれた</text><text x="90" y="1100" font-size="28">今日も暖かいね</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">心がほっかほかだね</text><text x="90" y="1220" font-size="28">雲さん</text><text x="90" y="1235" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>