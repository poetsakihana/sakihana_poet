<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1730" viewBox="0 0 1000 1730"><rect width="1000" height="1730" fill="#fffafd"/><rect x="28" y="28" width="944" height="1674" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0583</text><text x="90" y="155" font-size="34">雀の心</text><text x="90" y="220" font-size="28">雀の心は</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">小さな心</text><text x="90" y="340" font-size="28">どんなに鳴いても</text><text x="90" y="380" font-size="28">どんなに羽根を大きく広げても</text><text x="90" y="420" font-size="28">心が小さいことには</text><text x="90" y="460" font-size="28">変わりはない</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">でも、</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">人間にはできない</text><text x="90" y="660" font-size="28">空を飛ぶことが</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">その雀には大きなこと</text><text x="90" y="780" font-size="28">一生懸命に</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">小さな、小さな身体を</text><text x="90" y="900" font-size="28">つばぱばさ使って</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">ばたつかせても</text><text x="90" y="1020" font-size="28">私達には、</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">その素晴らしいこと</text><text x="90" y="1140" font-size="28">小さくても</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">心が小さくても</text><text x="90" y="1260" font-size="28">雀にとっては</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">大きな心だってこと</text><text x="90" y="1380" font-size="28">チュンチュンと</text><text x="90" y="1420" font-size="28">鳴き続けても</text><text x="90" y="1460" font-size="28">私達には、</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">その鳴き声が</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">心洪しく聞こえて</text><text x="90" y="1660" font-size="28">必死なんだということ</text><text x="90" y="1675" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>