<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1690" viewBox="0 0 1000 1690"><rect width="1000" height="1690" fill="#fffafd"/><rect x="28" y="28" width="944" height="1634" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0614</text><text x="90" y="155" font-size="34">勢術的</text><text x="90" y="220" font-size="28">デッサン</text><text x="90" y="260" font-size="28">鉛筆の濃淡が</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">リアリティを</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">勢術的センスを</text><text x="90" y="460" font-size="28">付け加え</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">鉛筆に芸術の生命を注いで</text><text x="90" y="580" font-size="28">用紙に描く</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">デッサン</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">それは白黒の世界</text><text x="90" y="780" font-size="28">モノクロでありながら</text><text x="90" y="820" font-size="28">三次元を</text><text x="90" y="860" font-size="28">描く事ができる</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">、物、人物</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">風景</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">風景は、雰囲気を引き立たせる</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">物は、</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">そのものありかた</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">、感情のあり方</text><text x="90" y="1380" font-size="28">らせて</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">人物は</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">生命が宿</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">絵画を描きゆく</text><text x="90" y="1635" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>