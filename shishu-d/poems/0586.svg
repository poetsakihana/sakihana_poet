<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370"><rect width="1000" height="1370" fill="#fffafd"/><rect x="28" y="28" width="944" height="1314" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0586</text><text x="90" y="155" font-size="34">小犬の足跡</text><text x="90" y="220" font-size="28">冬の雪、積もる日</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">小犬が雪と遊んでる</text><text x="90" y="340" font-size="28">小犬が足に跡を残して</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">雪に小さな足跡が</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">かわいく雪に残ってる</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">はしゃいで小犬が尻尾を振って</text><text x="90" y="620" font-size="28">かわいい足跡、残ってる</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">雪と遊んだ小犬は</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">満足して雪とさよならをして</text><text x="90" y="820" font-size="28">小犬は、おうちへ帰っていく</text><text x="90" y="860" font-size="28">雪にさよならをして</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">雪は笑顔になって</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">大事に大事に</text><text x="90" y="1060" font-size="28">小犬の残した足跡を</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">だいじに遊んだ証</text><text x="90" y="1180" font-size="28">その証にとけるまで</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">だいじにしてます</text><text x="90" y="1300" font-size="28">足跡をだいじにしてます</text><text x="90" y="1315" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>