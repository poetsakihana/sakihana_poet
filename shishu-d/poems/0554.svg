<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1570" viewBox="0 0 1000 1570"><rect width="1000" height="1570" fill="#fffafd"/><rect x="28" y="28" width="944" height="1514" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0554</text><text x="90" y="155" font-size="34">消の土</text><text x="90" y="220" font-size="28">田畑を一所懸命に耕しては</text><text x="90" y="260" font-size="28">水をまき耕してはと</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">子供は、消を見せながらも</text><text x="90" y="380" font-size="28">耐え忍んでいます</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">消の堆が田畑の栄養素なら</text><text x="90" y="500" font-size="28">素敵な。素敵な物が</text><text x="90" y="540" font-size="28">植えるだろうに消は、止まらず</text><text x="90" y="580" font-size="28">朝から晩まで耕し続けます</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">親は、争いに</text><text x="90" y="700" font-size="28">子供は、農場の主ですー</text><text x="90" y="740" font-size="28">素敵な農場の子です・、</text><text x="90" y="780" font-size="28">私も消が止まりませんへ、だだ</text><text x="90" y="820" font-size="28">必死に絶えをない農作業計ら</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">消が止まりません</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">生きる希望なんて</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">今の子供に生きるという</text><text x="90" y="1100" font-size="28">希望は残されてますか?</text><text x="90" y="1140" font-size="28">巣立たせるという親からの意思は</text><text x="90" y="1180" font-size="28">ありますか?</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">子供に生きる希望</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">それは、数パーセントしかない人希望</text><text x="90" y="1380" font-size="28">親の私達がどう向き合うか</text><text x="90" y="1420" font-size="28">子どもたちは、わかりません</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">沿ろ、教えてと問うだろう</text><text x="90" y="1515" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>