<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1850" viewBox="0 0 1000 1850"><rect width="1000" height="1850" fill="#fffafd"/><rect x="28" y="28" width="944" height="1794" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0678</text><text x="90" y="155" font-size="34">砂糖と塩</text><text x="90" y="220" font-size="28">砂糖は甘い</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">塩はからい</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">人生が革ければ</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">生きていくのも甘くなっちゃいます</text><text x="90" y="500" font-size="28">甘くなるということは</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">自分に囲いを作っちゃうこと</text><text x="90" y="620" font-size="28">囲いを作るとなんでもいいんだ</text><text x="90" y="660" font-size="28">甘くなっちゃいます</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">からい人生では</text><text x="90" y="780" font-size="28">生きていくのに</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">きりきりです</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">生きていくのにもやっと</text><text x="90" y="980" font-size="28">比較しちゃうと</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">からい方が頑張り屋さんです</text><text x="90" y="1100" font-size="28">でも</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">甘い愛は違います</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">甘い愛は情熱の愛に変わります</text><text x="90" y="1300" font-size="28">からい愛は</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">逆に厳しくて</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">愛の寺になる</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">愛の観点からすると</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">甘い方が頑張り屋さんです</text><text x="90" y="1660" font-size="28">頑張り屋さんがいいわけじゃなく</text><text x="90" y="1700" font-size="28">人間らしく</text><text x="90" y="1740" font-size="28"></text><text x="90" y="1780" font-size="28">愛を尽くすかです</text><text x="90" y="1795" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>