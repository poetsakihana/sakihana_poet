<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2330" viewBox="0 0 1000 2330"><rect width="1000" height="2330" fill="#fffafd"/><rect x="28" y="28" width="944" height="2274" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0495</text><text x="90" y="155" font-size="34">人ということを</text><text x="90" y="220" font-size="28">私たちは、頭の中から</text><text x="90" y="260" font-size="28">インプットされていたのに</text><text x="90" y="300" font-size="28">削除されて</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">今の現実をみている</text><text x="90" y="420" font-size="28">こんなことで</text><text x="90" y="460" font-size="28">変わるというのか</text><text x="90" y="500" font-size="28">こんなことで</text><text x="90" y="540" font-size="28">幸せになれるのか</text><text x="90" y="580" font-size="28">責めた時に</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">その人は、変わるのか</text><text x="90" y="700" font-size="28">人は、直ぐに変われるのか</text><text x="90" y="740" font-size="28">よく考えてみると</text><text x="90" y="780" font-size="28">私たちは、誰かに対して</text><text x="90" y="820" font-size="28">責めてしまっている</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">相手の悪気を</text><text x="90" y="940" font-size="28">根本に受けて</text><text x="90" y="980" font-size="28">その人が悪い</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">そんな言い方ないって</text><text x="90" y="1100" font-size="28">ロボットに話しても</text><text x="90" y="1140" font-size="28">ロボットは、仕組まれた</text><text x="90" y="1180" font-size="28">プログラムに</text><text x="90" y="1220" font-size="28">従うだけ</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">だから、患く言って</text><text x="90" y="1340" font-size="28">責めても</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">ロボットは、</text><text x="90" y="1460" font-size="28">正常に反応しない</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">誤作動を起こして</text><text x="90" y="1580" font-size="28">丸く縮こまる</text><text x="90" y="1620" font-size="28"></text><text x="90" y="1660" font-size="28">弱い人…もちろん強い人</text><text x="90" y="1700" font-size="28">口がそう言ってるだけ</text><text x="90" y="1740" font-size="28">弱い人も強い人もない</text><text x="90" y="1780" font-size="28">全部、組み込まれた</text><text x="90" y="1820" font-size="28">プログラムに</text><text x="90" y="1860" font-size="28">業には剛に従え</text><text x="90" y="1900" font-size="28"></text><text x="90" y="1940" font-size="28">そういうこと</text><text x="90" y="1980" font-size="28"></text><text x="90" y="2020" font-size="28">だから、責めない</text><text x="90" y="2060" font-size="28">あなたは、優しいひと</text><text x="90" y="2100" font-size="28">心が透明感のあるひと</text><text x="90" y="2140" font-size="28">そういうひとなんだから</text><text x="90" y="2180" font-size="28">無理に欠点を</text><text x="90" y="2220" font-size="28">見ない方が</text><text x="90" y="2260" font-size="28">あなたのため</text><text x="90" y="2275" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>