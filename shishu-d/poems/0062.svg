<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0062</text><text x="90" y="155" font-size="34">つながってるよね</text><text x="90" y="220" font-size="28">いつだって、つながってるよね。</text><text x="90" y="260" font-size="28">たとえ、前世でつながっていたとしても</text><text x="90" y="300" font-size="28">空と空はつながっている</text><text x="90" y="340" font-size="28">日本の空はどこでも同じだものね</text><text x="90" y="380" font-size="28">そっちの空は晴れてるかな？</text><text x="90" y="420" font-size="28">私の住む街の空は、晴れてます。</text><text x="90" y="460" font-size="28">私の心は曇ってますが</text><text x="90" y="500" font-size="28">あなたと会える日がとてもさみしいほど</text><text x="90" y="540" font-size="28">待ち遠しくて、山口へ今すぐにでも</text><text x="90" y="580" font-size="28">迎えに行って、あなたに思いっ切り</text><text x="90" y="620" font-size="28">涙を流しながら、前世の理由を伝えたいから</text><text x="90" y="660" font-size="28">思いの丈をぶつけて、私の前世でつながってた娘へ</text><text x="90" y="700" font-size="28">どんなにどんなに離れていても</text><text x="90" y="740" font-size="28">空を見上げれば、あなたの幼い頃の顔が浮かび上がる</text><text x="90" y="780" font-size="28">今や、おばあちゃん</text><text x="90" y="820" font-size="28">どんな想いで私を見ていたのかな</text><text x="90" y="860" font-size="28">ああ、愛しい我が娘</text><text x="90" y="900" font-size="28">ああ…。</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>