<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2410" viewBox="0 0 1000 2410"><rect width="1000" height="2410" fill="#fffafd"/><rect x="28" y="28" width="944" height="2354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0520</text><text x="90" y="155" font-size="34">根本に振り返って</text><text x="90" y="220" font-size="28">私の命はに、なんだとあなたは言った</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">命は、大切で粗末にできない</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">大切な人間の貴重品</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">だから粗末になんて簡単にできない。本天RCs</text><text x="90" y="500" font-size="28">命は、あなたの宝物なんだよ放較誠</text><text x="90" y="540" font-size="28">誰だって持っている宝物なんだよ。</text><text x="90" y="580" font-size="28">根本に振り返ってみて</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">それは、あなたが生まれてから</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">身についている大切な大切な宝物</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">大事にあなたが抱えて持っている宝物</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">その宝物を手放したり見放したりしては</text><text x="90" y="940" font-size="28">あなたの心が迷ってしまう</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">あなたが最も大切なもの</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">それがかけがえのない生命なんだよ</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">今を考えても</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">今を考えても思いが見つからない</text><text x="90" y="1300" font-size="28">今を考えられないなら</text><text x="90" y="1340" font-size="28">明日考えればいい</text><text x="90" y="1380" font-size="28">今日なできる日があなたに</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">必ずやってきますから</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">今を無理に考える必要なんて</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">まんざらないよ</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">無理して頭が痛くなったら</text><text x="90" y="1740" font-size="28"></text><text x="90" y="1780" font-size="28">そこで意味がなくなっちゃうよ</text><text x="90" y="1820" font-size="28">だから、無理して、考えなくても</text><text x="90" y="1860" font-size="28">いいんだよ</text><text x="90" y="1900" font-size="28"></text><text x="90" y="1940" font-size="28">人は、すぐに考えてしまう癖を持って</text><text x="90" y="1980" font-size="28">生まれた頃から備わっている</text><text x="90" y="2020" font-size="28"></text><text x="90" y="2060" font-size="28">だから、仕方ないよね</text><text x="90" y="2100" font-size="28"></text><text x="90" y="2140" font-size="28">でも、今を考えるのはやめよ</text><text x="90" y="2180" font-size="28"></text><text x="90" y="2220" font-size="28">思いがつかなかった時があなたに休息を</text><text x="90" y="2260" font-size="28"></text><text x="90" y="2300" font-size="28">求めているサインだと思えば</text><text x="90" y="2340" font-size="28">心はスッキリするよね</text><text x="90" y="2355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>