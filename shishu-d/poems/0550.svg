<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1690" viewBox="0 0 1000 1690"><rect width="1000" height="1690" fill="#fffafd"/><rect x="28" y="28" width="944" height="1634" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0550</text><text x="90" y="155" font-size="34">掌に芽を</text><text x="90" y="220" font-size="28">掌に幸せの種をまこうよ手を差し伸べて</text><text x="90" y="260" font-size="28">幸せの想いで満たされようよ</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">そうすれば、掌に絆という</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">芽が生えて手と手をとりあって</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">力合わせてみんなで</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">その芽を育てよう恵まれた花として</text><text x="90" y="620" font-size="28">育つようにみんなで手を合わせよう</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">城千にも泊</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">どこまでも続くこの世界に</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">苦しさなんて一切、</text><text x="90" y="900" font-size="28">消を私達に示してく</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">消して</text><text x="90" y="1020" font-size="28">ださい</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">耐えないで消を見せてください</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">どうか苦渋なんて</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">味わなくても</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">一人で抱えないで私達に知らせて</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">苦しさが受け継がれる</text><text x="90" y="1460" font-size="28">この世界のどこかで</text><text x="90" y="1500" font-size="28">必要ない消で辛さを</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">痛みを味わうって</text><text x="90" y="1620" font-size="28">見せてください</text><text x="90" y="1635" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>