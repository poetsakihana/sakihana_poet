<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210"><rect width="1000" height="1210" fill="#fffafd"/><rect x="28" y="28" width="944" height="1154" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0142</text><text x="90" y="155" font-size="34">fly and to happy</text><text x="90" y="220" font-size="28">高く跳ぶと</text><text x="90" y="260" font-size="28">心が弾むのはどうしてだろう</text><text x="90" y="300" font-size="28">fly and to happy</text><text x="90" y="340" font-size="28">どんなに暗くなっていても</text><text x="90" y="380" font-size="28">その場で跳べば</text><text x="90" y="420" font-size="28">でも、私には飛ぶことはできない</text><text x="90" y="460" font-size="28">あの栄光の陽に向けて</text><text x="90" y="500" font-size="28">飛んで行きたい</text><text x="90" y="540" font-size="28">きっと幸せになれる</text><text x="90" y="580" font-size="28">でも、鳥は可哀想</text><text x="90" y="620" font-size="28">いくら飛べても</text><text x="90" y="660" font-size="28">それは、生きるのが必死で</text><text x="90" y="700" font-size="28">飛び立っているんだ</text><text x="90" y="740" font-size="28">それをもわからずに、</text><text x="90" y="780" font-size="28">私は、飛べたらいいなと</text><text x="90" y="820" font-size="28">夢持っていた</text><text x="90" y="860" font-size="28">けども、鳥にとっては</text><text x="90" y="900" font-size="28">それが幸せに繋がるとは</text><text x="90" y="940" font-size="28">決して限らないことだって</text><text x="90" y="980" font-size="28">それでも、空を飛びたい</text><text x="90" y="1020" font-size="28">鳥のように、高く高く</text><text x="90" y="1060" font-size="28">酸素がなくなりそうになる</text><text x="90" y="1100" font-size="28">ところまで、</text><text x="90" y="1140" font-size="28">飛んでしまいたい</text><text x="90" y="1155" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>