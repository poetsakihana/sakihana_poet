<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210"><rect width="1000" height="1210" fill="#fffafd"/><rect x="28" y="28" width="944" height="1154" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0491</text><text x="90" y="155" font-size="34">逃げても</text><text x="90" y="220" font-size="28">この世界は</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">逃げても</text><text x="90" y="340" font-size="28">家族や知り合いが</text><text x="90" y="380" font-size="28">手を貸してくれないと</text><text x="90" y="420" font-size="28">仕方ない</text><text x="90" y="460" font-size="28">逃げているのだから</text><text x="90" y="500" font-size="28">逃げちゃったら</text><text x="90" y="540" font-size="28">家族が泣くんだよ</text><text x="90" y="580" font-size="28">愛する人が心を痛めて</text><text x="90" y="620" font-size="28">悲しくなるんだよ</text><text x="90" y="660" font-size="28">だから、逃けないで</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">逃げても</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">この世界は</text><text x="90" y="860" font-size="28">決して変わらないよ</text><text x="90" y="900" font-size="28">逃げても</text><text x="90" y="940" font-size="28">あなたの心は、</text><text x="90" y="980" font-size="28">爽やかになれないよ</text><text x="90" y="1020" font-size="28">だって、逃げる事は</text><text x="90" y="1060" font-size="28">自分を避けてるから</text><text x="90" y="1100" font-size="28">だから、笑顔になんて</text><text x="90" y="1140" font-size="28">なれないんだよ</text><text x="90" y="1155" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>