<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170"><rect width="1000" height="1170" fill="#fffafd"/><rect x="28" y="28" width="944" height="1114" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0637</text><text x="90" y="155" font-size="34">非常識に</text><text x="90" y="220" font-size="28">私は、空回りしていた</text><text x="90" y="260" font-size="28">規則の作った人</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">お金はお金で</text><text x="90" y="380" font-size="28">物は物で</text><text x="90" y="420" font-size="28">敬語を使いなさい</text><text x="90" y="460" font-size="28">そのありふれた</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">日常について</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">行くことができなかった</text><text x="90" y="660" font-size="28">今となっては</text><text x="90" y="700" font-size="28">今まだに</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">どうしてだろうって</text><text x="90" y="820" font-size="28">常々に思う</text><text x="90" y="860" font-size="28">常識のあり方</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">非常識にならないあり方</text><text x="90" y="980" font-size="28">縛られていた幼い</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">あの頃、今の子も</text><text x="90" y="1100" font-size="28">恐らくは…。</text><text x="90" y="1115" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>