<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250"><rect width="1000" height="1250" fill="#fffafd"/><rect x="28" y="28" width="944" height="1194" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0419</text><text x="90" y="155" font-size="34">不採用通知</text><text x="90" y="220" font-size="28">家に届いた</text><text x="90" y="260" font-size="28">不採用の通知</text><text x="90" y="300" font-size="28">何社と受けた</text><text x="90" y="340" font-size="28">その結果が不採用。</text><text x="90" y="380" font-size="28">励んでいた事が</text><text x="90" y="420" font-size="28">見事に惨敗</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">しがみ付いて</text><text x="90" y="540" font-size="28">受けられる会社に</text><text x="90" y="580" font-size="28">いくつか</text><text x="90" y="620" font-size="28">探して検討をして</text><text x="90" y="660" font-size="28">面接を受けて</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">「何がしたいんですか?」</text><text x="90" y="780" font-size="28">と問われ</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">頭の中が館り</text><text x="90" y="900" font-size="28">わからなくなった</text><text x="90" y="940" font-size="28">絶望感だけが残った</text><text x="90" y="980" font-size="28">その通知書</text><text x="90" y="1020" font-size="28">いつしか</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">見るのが</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">怖くなったその結果</text><text x="90" y="1195" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>