<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1530" viewBox="0 0 1000 1530"><rect width="1000" height="1530" fill="#fffafd"/><rect x="28" y="28" width="944" height="1474" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0470</text><text x="90" y="155" font-size="34">唯一の気持ち</text><text x="90" y="220" font-size="28">素直さえあれば</text><text x="90" y="260" font-size="28">世界を救えるそのぐらいに</text><text x="90" y="300" font-size="28">すごい力を持ってるけど</text><text x="90" y="340" font-size="28">大人になってからは</text><text x="90" y="380" font-size="28">社会のしがらみに</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">まとわって</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">なかなか素直に</text><text x="90" y="580" font-size="28">なれない</text><text x="90" y="620" font-size="28">あの頃に戻りたい</text><text x="90" y="660" font-size="28">けど、今が良い</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">複雑だけど</text><text x="90" y="780" font-size="28">今の私は、昔に比べると</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">素直さがなくなって</text><text x="90" y="900" font-size="28">硬くなってしまって</text><text x="90" y="940" font-size="28">あの頃に戻る気持ちがあるけど</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">あの頃に戻るのが</text><text x="90" y="1060" font-size="28">怖くなって</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">ただ、今の私を生きること</text><text x="90" y="1180" font-size="28">素直になる事が</text><text x="90" y="1220" font-size="28">一番なのかもしれない</text><text x="90" y="1260" font-size="28">昔は昔</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">今は今で</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">十分なのかもしれない</text><text x="90" y="1460" font-size="28">惜しいけど</text><text x="90" y="1475" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>