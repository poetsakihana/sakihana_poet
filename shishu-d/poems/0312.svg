<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090"><rect width="1000" height="1090" fill="#fffafd"/><rect x="28" y="28" width="944" height="1034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0312</text><text x="90" y="155" font-size="34">まるで</text><text x="90" y="220" font-size="28">まるで、怪物に襲われたように</text><text x="90" y="260" font-size="28">恐怖で一杯になった。</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">まるで、漂流したように</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">悩み苦しんだ。</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">まるで、大穴に陥ったように</text><text x="90" y="540" font-size="28">困惑してしまった。</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">まるで水しぶきをかけられたように</text><text x="90" y="660" font-size="28">おどろきと喜びが出た。</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">まるで</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">このまるでは、魔法のように</text><text x="90" y="860" font-size="28">場面をうつしだす作用がある</text><text x="90" y="900" font-size="28">だから、必要不可欠な言葉で</text><text x="90" y="940" font-size="28">例える事のできる道具なのだ。</text><text x="90" y="980" font-size="28">まるで…山風にあたっているように</text><text x="90" y="1020" font-size="28">心地好い気持ちになれる</text><text x="90" y="1035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>