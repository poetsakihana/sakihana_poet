<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450"><rect width="1000" height="1450" fill="#fffafd"/><rect x="28" y="28" width="944" height="1394" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0641</text><text x="90" y="155" font-size="34">お空が泣いてる</text><text x="90" y="220" font-size="28">お空が泣いてるよ</text><text x="90" y="260" font-size="28">泣いてるんじゃないよ</text><text x="90" y="300" font-size="28">あれは、流星</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">でも、何だか泣いてるみたい</text><text x="90" y="420" font-size="28">悲しいことがあったのかな</text><text x="90" y="460" font-size="28">私が何とかお空に</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">届けられるなら</text><text x="90" y="580" font-size="28">暖かい気持ちを</text><text x="90" y="620" font-size="28">あげたいならぁ</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">流星群、確かに</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">お空が泣いてるよう</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">鶴れた涙がどこかへ</text><text x="90" y="900" font-size="28">行っているよう</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">私の子が言ってるように</text><text x="90" y="1020" font-size="28">確かに悲しいのかも</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">しれないね</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">ただ、私たちはお空を</text><text x="90" y="1220" font-size="28">見るだけ</text><text x="90" y="1260" font-size="28">気持ちを与えることは</text><text x="90" y="1300" font-size="28">できない</text><text x="90" y="1340" font-size="28">それもある意味</text><text x="90" y="1380" font-size="28">悲しいことだね</text><text x="90" y="1395" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>