<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1730" viewBox="0 0 1000 1730"><rect width="1000" height="1730" fill="#fffafd"/><rect x="28" y="28" width="944" height="1674" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0811</text><text x="90" y="155" font-size="34">お疲れ</text><text x="90" y="220" font-size="28">お疲れ</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">疲れた時に声掛け皆さんで言い合う</text><text x="90" y="340" font-size="28">人は皆、疲れます</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">そんな当たり前な世の中</text><text x="90" y="460" font-size="28">花も時立つうちに枯れてしまいます</text><text x="90" y="500" font-size="28">散りゆく花びらのように</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">私たちゃも散りゆきます</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">お疲れ様です</text><text x="90" y="700" font-size="28">言われるとリフレッシュ</text><text x="90" y="740" font-size="28">そうできそうで元気がでる</text><text x="90" y="780" font-size="28">声掛け合おう</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">お疲れと</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">は?&quot;</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">は?</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">疑い掛けて</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">疑われて</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">どうすればいいか</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">立ち止まる</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">嫌な言葉に聞こえる</text><text x="90" y="1460" font-size="28">疑う事はあなたのために</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">ならないです</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">いい言葉を伝えましょう</text><text x="90" y="1660" font-size="28">そうすればあなたのためです</text><text x="90" y="1675" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>