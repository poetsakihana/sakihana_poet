<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010"><rect width="1000" height="1010" fill="#fffafd"/><rect x="28" y="28" width="944" height="954" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0384</text><text x="90" y="155" font-size="34">光然自失な</text><text x="90" y="220" font-size="28">自分が自分である事を</text><text x="90" y="260" font-size="28">失うって</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">とても大変なこと</text><text x="90" y="380" font-size="28">心が失うって</text><text x="90" y="420" font-size="28">危ない事</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">自分を失うって</text><text x="90" y="540" font-size="28">悲しいこと</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">辛いこと</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">だから、見失う事は</text><text x="90" y="740" font-size="28">ーー切ならない方が</text><text x="90" y="780" font-size="28">自分のためにでもなるし</text><text x="90" y="820" font-size="28">将来にもかかわる事だし</text><text x="90" y="860" font-size="28">光然自失にならないよう</text><text x="90" y="900" font-size="28">私は、見失いたくない</text><text x="90" y="940" font-size="28">そう、心に訴える</text><text x="90" y="955" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>