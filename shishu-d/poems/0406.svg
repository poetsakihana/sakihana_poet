<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370"><rect width="1000" height="1370" fill="#fffafd"/><rect x="28" y="28" width="944" height="1314" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0406</text><text x="90" y="155" font-size="34">朝日が昇る</text><text x="90" y="220" font-size="28">朝日が昇る</text><text x="90" y="260" font-size="28">今日の日を迎えて</text><text x="90" y="300" font-size="28">朝日は昇る</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">手と手をつなぐ日を</text><text x="90" y="420" font-size="28">待ちわびて</text><text x="90" y="460" font-size="28">今日も平和を望み</text><text x="90" y="500" font-size="28">朝日は昇る</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">今日、肖ぐむ人も</text><text x="90" y="620" font-size="28">明日、涙ぐむ人も</text><text x="90" y="660" font-size="28">平和であるように</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">朝日は、私達を見て</text><text x="90" y="780" font-size="28">今日も明日も</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">平和を望む</text><text x="90" y="900" font-size="28">朝日が昇れば</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">明るい日に近づける</text><text x="90" y="1020" font-size="28">そう願えたら。</text><text x="90" y="1060" font-size="28">そうであれたなら。</text><text x="90" y="1100" font-size="28">私は、今日を大切にする</text><text x="90" y="1140" font-size="28">明日ももちろん</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">稚、</text><text x="90" y="1260" font-size="28">時1</text><text x="90" y="1300" font-size="28">ま</text><text x="90" y="1315" font-size="16" f