<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130"><rect width="1000" height="1130" fill="#fffafd"/><rect x="28" y="28" width="944" height="1074" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0296</text><text x="90" y="155" font-size="34">生命の大切さ</text><text x="90" y="220" font-size="28">どうして、人は傷つけ合うのか。</text><text x="90" y="260" font-size="28">どうして、人は愛せないのか。</text><text x="90" y="300" font-size="28">どうして、人は励まさないのか。</text><text x="90" y="340" font-size="28">生命という生命を大切にしない。</text><text x="90" y="380" font-size="28">その様な人がこの世界にいる。</text><text x="90" y="420" font-size="28">親、教師、同い年の友達。</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">年上、年下の人達。</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">そのような人人達や社会に流されて、</text><text x="90" y="620" font-size="28">情勢に浮かぶ子供や大人。</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">尊い生命の大切さを</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">もう一度、確かめらてほしい。</text><text x="90" y="820" font-size="28">異性差別や年齢差別、</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">高齢差別、凡ゆる区別を正したい。</text><text x="90" y="940" font-size="28">苦しい人は、皆同じ。</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">悲しい人だって皆同じなんだから。</text><text x="90" y="1060" font-size="28">もう少し、向き合えると良いのに。</text><text x="90" y="1075" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>