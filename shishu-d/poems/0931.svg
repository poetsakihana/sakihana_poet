<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0931</text><text x="90" y="155" font-size="34">導の生きる術</text><text x="90" y="220" font-size="28">は生きる術を知っているか</text><text x="90" y="260" font-size="28">刀はなぜ生きるか知っているか</text><text x="90" y="300" font-size="28">答えましょう</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">生きる術は力強く生き抜くこと</text><text x="90" y="420" font-size="28">ただ、ひたすら毎日を</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">通り過ぎていき、生きることに</text><text x="90" y="540" font-size="28">乾杯する</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">なぜ生きるのかは、</text><text x="90" y="660" font-size="28">わたしを必要としている人のため</text><text x="90" y="700" font-size="28">わたしを頼りにしてくれる人のため</text><text x="90" y="740" font-size="28">そして、</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">わたしが次でも生き生きと過ごし、</text><text x="90" y="860" font-size="28">満足のいく生き方をするため</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>