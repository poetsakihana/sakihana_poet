<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1890" viewBox="0 0 1000 1890"><rect width="1000" height="1890" fill="#fffafd"/><rect x="28" y="28" width="944" height="1834" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0510</text><text x="90" y="155" font-size="34">仇に</text><text x="90" y="220" font-size="28">代なんて仕打ちをすること</text><text x="90" y="260" font-size="28">それをしてはいけない</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">代は返って代として</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">他の人からあまりいい事なんて</text><text x="90" y="460" font-size="28">一部たりともないだから、花咲くように</text><text x="90" y="500" font-size="28">ひねくれてしまうと後退してしまう</text><text x="90" y="540" font-size="28">もう、後ろめくことはやめて</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">前行して殴から優しい</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">綺麗な清い水を流していこうよ</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">かたきなんて勝手に思わずに</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">花を咲かせて灯びやかに咲かせよう</text><text x="90" y="900" font-size="28">そうして前向こうよ</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">綺麗な花のように</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">沢山の</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">沢山の贈り物を送ろう</text><text x="90" y="1180" font-size="28">嬉しい物や楽しい物や</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">笑顔を見せて幸せの物の</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">物を手渡そう様々な品をのンー</text><text x="90" y="1380" font-size="28">奉仕のようにーー</text><text x="90" y="1420" font-size="28">がっかりとしをた子やーーニニーー</text><text x="90" y="1460" font-size="28">心待ちしていた子や回癌癌凍</text><text x="90" y="1500" font-size="28">幸せの贈り物を送ろうたくさんたくさん</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">心が目一杯になる程分け与えようよ</text><text x="90" y="1620" font-size="28"></text><text x="90" y="1660" font-size="28">そうすればあなたも心が</text><text x="90" y="1700" font-size="28"></text><text x="90" y="1740" font-size="28">その分、幸せに倍としてなるよ</text><text x="90" y="1780" font-size="28"></text><text x="90" y="1820" font-size="28">誤ee rr。</text><text x="90" y="1835" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>