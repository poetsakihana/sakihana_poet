<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0137</text><text x="90" y="155" font-size="34">重ねない愛</text><text x="90" y="220" font-size="28">相手と私が</text><text x="90" y="260" font-size="28">同じ想いでも</text><text x="90" y="300" font-size="28">決して重ねたらいけない</text><text x="90" y="340" font-size="28">どうしてなら</text><text x="90" y="380" font-size="28">相手が想うことと</text><text x="90" y="420" font-size="28">私が想うことでは</text><text x="90" y="460" font-size="28">くいちがうことがあるから</text><text x="90" y="500" font-size="28">重ねあわしたくても</text><text x="90" y="540" font-size="28">重ね合わせられない</text><text x="90" y="580" font-size="28">それが現実な話</text><text x="90" y="620" font-size="28">それが切ない愛なのかもしれない</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>