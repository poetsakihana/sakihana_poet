<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1730" viewBox="0 0 1000 1730"><rect width="1000" height="1730" fill="#fffafd"/><rect x="28" y="28" width="944" height="1674" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0813</text><text x="90" y="155" font-size="34">嫌だ</text><text x="90" y="220" font-size="28">嫌だ</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">素直に事を伝える言葉</text><text x="90" y="340" font-size="28">嫌だ</text><text x="90" y="380" font-size="28">嫌がらせをされた時</text><text x="90" y="420" font-size="28">回避する言葉</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">どうして人は互いに</text><text x="90" y="540" font-size="28">傷つけ合うのか</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">どうして幸せを彰さないのか</text><text x="90" y="660" font-size="28">私には理解ができない</text><text x="90" y="700" font-size="28">傷つける事</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">イコール</text><text x="90" y="820" font-size="28">相手を泣かすこと</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">それっていいこと？</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">それって当然のこと?</text><text x="90" y="1020" font-size="28">間違いだらけの日本</text><text x="90" y="1060" font-size="28">間違いだらけの世界</text><text x="90" y="1100" font-size="28">傷をなくす事それを目標にして</text><text x="90" y="1140" font-size="28">生きて行く事</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">だから、嫌だを防衛する</text><text x="90" y="1260" font-size="28">その事が一番大事</text><text x="90" y="1300" font-size="28">その事を忘れない事</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">あなたのためにならない</text><text x="90" y="1420" font-size="28">相手のためにならない</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">人と人</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">手をつなぐ関係</text><text x="90" y="1620" font-size="28"></text><text x="90" y="1660" font-size="28">そうでなければいけないんだょよ</text><text x="90" y="1675" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>