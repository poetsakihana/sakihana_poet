<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1610" viewBox="0 0 1000 1610"><rect width="1000" height="1610" fill="#fffafd"/><rect x="28" y="28" width="944" height="1554" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0438</text><text x="90" y="155" font-size="34">奏でる指先</text><text x="90" y="220" font-size="28">奏でて</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">なぞるような</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">その指先は</text><text x="90" y="420" font-size="28">まるで人生の</text><text x="90" y="460" font-size="28">期間一つのつーつのように</text><text x="90" y="500" font-size="28">弾き続けて</text><text x="90" y="540" font-size="28">悔しい時だって</text><text x="90" y="580" font-size="28">悲しい時だって</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">その指先は</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">感じ取るんだ</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">そのピアニストに</text><text x="90" y="860" font-size="28">託しながら</text><text x="90" y="900" font-size="28">その意のままに</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">でも、手を止める事もある</text><text x="90" y="1020" font-size="28">投げ出して</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">ピアノから離れて</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">奏でるのをやめてしまう時も</text><text x="90" y="1220" font-size="28">あるから</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">でも、指先はわかる</text><text x="90" y="1340" font-size="28">その弾いていた期間を</text><text x="90" y="1380" font-size="28">経験として残される</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">いつでも弾けるように</text><text x="90" y="1500" font-size="28">ピアニストを信じながら</text><text x="90" y="1540" font-size="28">待ち続けるのです</text><text x="90" y="1555" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>