<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410"><rect width="1000" height="1410" fill="#fffafd"/><rect x="28" y="28" width="944" height="1354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0408</text><text x="90" y="155" font-size="34">ジングルベル</text><text x="90" y="220" font-size="28">クリスマスの夜に</text><text x="90" y="260" font-size="28">そびえたつ塔があって</text><text x="90" y="300" font-size="28">そこには、ベルが鳴り響く</text><text x="90" y="340" font-size="28">さみしそうに鳴っていたけど</text><text x="90" y="380" font-size="28">メリークリスマス</text><text x="90" y="420" font-size="28">今夜だけは、たくさんの</text><text x="90" y="460" font-size="28">ベルにつつまれて</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">塔はちっとも洪しくない</text><text x="90" y="580" font-size="28">ジングルベル、鳴り響く…。</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">都会に今日も鐘が鳴り響いた</text><text x="90" y="700" font-size="28">拍手喝系の音が聞こを</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">ハッピーゴールを迎えいる</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">新郎新婦が恥かしそうに</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">お互いを見合わせて、</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">お互いに鐘の音を聞く</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">「何て綺麗でしょう」</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">「心が和んで実感できる」と</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">婚如の鐘を聞いてーー</text><text x="90" y="1300" font-size="28">幸せそうにみんな、和む2</text><text x="90" y="1340" font-size="28">おめでとうと鐘も鳴るる秒</text><text x="90" y="1355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>