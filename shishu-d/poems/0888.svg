<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330"><rect width="1000" height="1330" fill="#fffafd"/><rect x="28" y="28" width="944" height="1274" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0888</text><text x="90" y="155" font-size="34">内田橋</text><text x="90" y="220" font-size="28">自分の田んぼ</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">むかしは田畑が多くあった</text><text x="90" y="340" font-size="28">自分の敷地内に</text><text x="90" y="380" font-size="28">入っちゃいけないって</text><text x="90" y="420" font-size="28">怒鳴る人もいた</text><text x="90" y="460" font-size="28">昔の人は</text><text x="90" y="500" font-size="28">桑を持ちながら</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">畑を耕していた</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">米や野菜を大事そうに</text><text x="90" y="700" font-size="28">我が子のように</text><text x="90" y="740" font-size="28">育て上げていた</text><text x="90" y="780" font-size="28">稲穂は難しいこともあり</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">枯れては商売に人怠る</text><text x="90" y="900" font-size="28">そんなふうに</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">大事に大事に</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">収穫きれていた</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">その名残が名古屋にあるんだね</text><text x="90" y="1180" font-size="28">熱田の内田橋</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">きっと内田さんがいたのかな</text><text x="90" y="1275" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>