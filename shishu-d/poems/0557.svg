<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250"><rect width="1000" height="1250" fill="#fffafd"/><rect x="28" y="28" width="944" height="1194" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0557</text><text x="90" y="155" font-size="34">販売された子</text><text x="90" y="220" font-size="28">今日も販売されたあの子が販売された</text><text x="90" y="260" font-size="28">どこかへ売買されて</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">今日も明日も販売されていった</text><text x="90" y="380" font-size="28">扱い方なんて大人事情で</text><text x="90" y="420" font-size="28">子供が泣いても嘆いても叫んでも</text><text x="90" y="460" font-size="28">喚いても大人にとっては</text><text x="90" y="500" font-size="28">子供は物扱いそうして、親元から</text><text x="90" y="540" font-size="28">離れて行くのかな</text><text x="90" y="580" font-size="28">そうして、故郷から</text><text x="90" y="620" font-size="28">離れて行くのかな</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">価値という名ではない</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">価値あるか価値がないか</text><text x="90" y="820" font-size="28">次元が違うこの世では</text><text x="90" y="860" font-size="28">私はどうすればこの世に</text><text x="90" y="900" font-size="28">優しさの芽が出るのだろう</text><text x="90" y="940" font-size="28">私達は差別感を感じて知りながら</text><text x="90" y="980" font-size="28">知り尽くす必要がみんなみんな</text><text x="90" y="1020" font-size="28">あるんだでも、もどかしいよね</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">喉から手が出るほどどうにかしたいよね</text><text x="90" y="1140" font-size="28">今や価値観の問題じゃない</text><text x="90" y="1180" font-size="28">今や助け合う助力の問題です</text><text x="90" y="1195" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>