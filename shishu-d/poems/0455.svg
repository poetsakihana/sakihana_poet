<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1290" viewBox="0 0 1000 1290"><rect width="1000" height="1290" fill="#fffafd"/><rect x="28" y="28" width="944" height="1234" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0455</text><text x="90" y="155" font-size="34">Rent living(レントリビング)</text><text x="90" y="220" font-size="28">借りて暮らす</text><text x="90" y="260" font-size="28">私の家は、</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">まるで、ヤドカリのように</text><text x="90" y="380" font-size="28">あの町にこの町に</text><text x="90" y="420" font-size="28">移り移りと</text><text x="90" y="460" font-size="28">場所も考えも気持ちも</text><text x="90" y="500" font-size="28">その場所に</text><text x="90" y="540" font-size="28">置いてきぼりにして</text><text x="90" y="580" font-size="28">新しい貝殻を求めて</text><text x="90" y="620" font-size="28">新しい家を探す</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">借りぐらしの今は</text><text x="90" y="740" font-size="28">どうすればいいのか</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">土地と瞳めっこしてるように</text><text x="90" y="860" font-size="28">今はどじどうしたらいいのか</text><text x="90" y="900" font-size="28">次に進むには</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">どうしたらいいのか</text><text x="90" y="1020" font-size="28">そんな移り暮らしの相談を</text><text x="90" y="1060" font-size="28">探し求める</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">落ち着く場所を求めて</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">借りぐらしは続く</text><text x="90" y="1235" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>