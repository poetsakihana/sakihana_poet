<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1730" viewBox="0 0 1000 1730"><rect width="1000" height="1730" fill="#fffafd"/><rect x="28" y="28" width="944" height="1674" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0361</text><text x="90" y="155" font-size="34">准える(うれえる)</text><text x="90" y="220" font-size="28">どうして代びしい気持ちになっているの</text><text x="90" y="260" font-size="28">それは、人のためなの</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">人のために、他びしく蔽えている心なの?</text><text x="90" y="380" font-size="28">それは、人を救える事なの?</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">人を救える他びしいしさと</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">人を教える哀れさと</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">この二つは違うよ</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">作びしさは、自分を敷いてでも救うこと</text><text x="90" y="740" font-size="28">哀れさは、同感して同じ気持ちで救うこと</text><text x="90" y="780" font-size="28">どっちが正しいかな…。</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">離れ離れになって、人に慕う気持ち</text><text x="90" y="900" font-size="28">このやるせない幕う気持ち</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">「どこで、何をしているのか」</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">「どうして離れゆくのか」</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">私には、わからない</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">人の思う心は、</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">心変わりをするもの</text><text x="90" y="1340" font-size="28">だから、慕ったとしても</text><text x="90" y="1380" font-size="28">相手が思ってくれる他は</text><text x="90" y="1420" font-size="28">どうする事もできない</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">潔く、</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">どこか遠くへいこうか</text><text x="90" y="1620" font-size="28"></text><text x="90" y="1660" font-size="28">私を思う所へいこうか</text><text x="90" y="1675" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>