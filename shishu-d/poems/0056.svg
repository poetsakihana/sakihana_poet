<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250"><rect width="1000" height="1250" fill="#fffafd"/><rect x="28" y="28" width="944" height="1194" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0056</text><text x="90" y="155" font-size="34">世界の人が幸せに</text><text x="90" y="220" font-size="28">世界の人が幸せに</text><text x="90" y="260" font-size="28">もしもなれたなら</text><text x="90" y="300" font-size="28">どれほど、世の中が明るいニュースで</text><text x="90" y="340" font-size="28">覆われるんだろう</text><text x="90" y="380" font-size="28">世界が不幸せにさせているのは</text><text x="90" y="420" font-size="28">人で</text><text x="90" y="460" font-size="28">人が左右している</text><text x="90" y="500" font-size="28">揺れている天秤のように</text><text x="90" y="540" font-size="28">幸せか不幸せかが決められて</text><text x="90" y="580" font-size="28">大人も子供も裕福には</text><text x="90" y="620" font-size="28">迎えられない</text><text x="90" y="660" font-size="28">そうしてこの世を逝く</text><text x="90" y="700" font-size="28">人達は、かわいそうでならない</text><text x="90" y="740" font-size="28">そうでしょ？</text><text x="90" y="780" font-size="28">幸せが誰だって望むでしょ？</text><text x="90" y="820" font-size="28">不幸せを望む人なんで</text><text x="90" y="860" font-size="28">この世にいるのかしら</text><text x="90" y="900" font-size="28">いる方が間違いで</text><text x="90" y="940" font-size="28">正さないといけないよ</text><text x="90" y="980" font-size="28">貧しい子供達や大人たちに</text><text x="90" y="1020" font-size="28">ただ、ただ祈るだけです。</text><text x="90" y="1060" font-size="28">「元気で、健康で、非戦争で幸せでありますように」</text><text x="90" y="1100" font-size="28">こう、祈るだけです</text><text x="90" y="1140" font-size="28">これが精一杯の私たちのできること</text><text x="90" y="1180" font-size="28">それだからです…。</text><text x="90" y="1195" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>