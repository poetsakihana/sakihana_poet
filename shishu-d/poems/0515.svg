<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1490" viewBox="0 0 1000 1490"><rect width="1000" height="1490" fill="#fffafd"/><rect x="28" y="28" width="944" height="1434" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0515</text><text x="90" y="155" font-size="34">運命は変える</text><text x="90" y="220" font-size="28">私は運命は変えられると</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">いつでも思っている</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">今でも思っている運命は変えるものだって</text><text x="90" y="420" font-size="28">そう信じているからだから、思っている</text><text x="90" y="460" font-size="28">運命は変えられない事なんて</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">できない事ではない</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">なぜなら、貧困だった人が</text><text x="90" y="660" font-size="28">遣い上がって裕福な生活になった</text><text x="90" y="700" font-size="28">そう言う人だって中にはいる</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">この世ではとはいっていませんが</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">昔、いました今の世界は</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">なかなか難かしいそれが現状</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">でも、尻込みしても始まらない</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">それが現状だから、運命を</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">私達が変えていくんです</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">変えれば、運命はグルリと変わるはず</text><text x="90" y="1300" font-size="28">良いことばかりがめぐりに巡ってくる</text><text x="90" y="1340" font-size="28">そう信じようよ善良なまま</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">そう信じようよ</text><text x="90" y="1435" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>