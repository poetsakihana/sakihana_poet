<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010"><rect width="1000" height="1010" fill="#fffafd"/><rect x="28" y="28" width="944" height="954" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0712</text><text x="90" y="155" font-size="34">頑張らなくっちゃ</text><text x="90" y="220" font-size="28">家族のみんなをみると</text><text x="90" y="260" font-size="28">ふと、頑張らなくっちゃ</text><text x="90" y="300" font-size="28">そう想う</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">意地っ張りとか</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">そんな考えじゃなくて</text><text x="90" y="500" font-size="28">しっかりと大人びる</text><text x="90" y="540" font-size="28">婚びた想いが</text><text x="90" y="580" font-size="28">強かった</text><text x="90" y="620" font-size="28">我慢して作り笑い</text><text x="90" y="660" font-size="28">我慢して話寄り添い</text><text x="90" y="700" font-size="28">素直な子でいたかった</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">頑張らなくっちゃって</text><text x="90" y="820" font-size="28">自分という作りキャラ</text><text x="90" y="860" font-size="28">そんなんじゃなく</text><text x="90" y="900" font-size="28">ただ、素直で謙避な子で</text><text x="90" y="940" font-size="28">いたかった</text><text x="90" y="955" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>