<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010"><rect width="1000" height="1010" fill="#fffafd"/><rect x="28" y="28" width="944" height="954" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0730</text><text x="90" y="155" font-size="34">ベランダ</text><text x="90" y="220" font-size="28">眺める景色</text><text x="90" y="260" font-size="28">一望ではないが</text><text x="90" y="300" font-size="28">山々に咲く</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">花々は</text><text x="90" y="420" font-size="28">華やかで美々しい</text><text x="90" y="460" font-size="28">ベランダの窯を開けたら</text><text x="90" y="500" font-size="28">そこは銀世界</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">もしくは八重桜</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">もしくは紅葉世界</text><text x="90" y="700" font-size="28">季節追うごとに</text><text x="90" y="740" font-size="28">変わる窓の外</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">和んでいられる</text><text x="90" y="860" font-size="28">雅な景色</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">彩られゆく外の世界</text><text x="90" y="955" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>