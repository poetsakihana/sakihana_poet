<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1610" viewBox="0 0 1000 1610"><rect width="1000" height="1610" fill="#fffafd"/><rect x="28" y="28" width="944" height="1554" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0433</text><text x="90" y="155" font-size="34">焦らずに</text><text x="90" y="220" font-size="28">ゆったりと二分音符のように</text><text x="90" y="260" font-size="28">そこから始めて行こう</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">ゆったり歩いて行こう</text><text x="90" y="380" font-size="28">急いでも、つまずいた時には</text><text x="90" y="420" font-size="28">怖いから</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">だから、ゆったり歩いて行こうよ</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">とても苦手ときれる</text><text x="90" y="620" font-size="28">へ音記号</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">嫌われ者の</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">へ音記号</text><text x="90" y="820" font-size="28">どうしても</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">ト音記号より</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">へ音記号は、</text><text x="90" y="1020" font-size="28">ドレミファが</text><text x="90" y="1060" font-size="28">変調になって</text><text x="90" y="1100" font-size="28">変な音記号</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">それがへ音記号</text><text x="90" y="1220" font-size="28">だとしても</text><text x="90" y="1260" font-size="28">必要な存在の</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">へ音記号</text><text x="90" y="1380" font-size="28">嫌われ者でも</text><text x="90" y="1420" font-size="28">大切な存在です</text><text x="90" y="1460" font-size="28">へ音記号でも</text><text x="90" y="1500" font-size="28">ちゃんと使われる</text><text x="90" y="1540" font-size="28">存在なのです</text><text x="90" y="1555" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>