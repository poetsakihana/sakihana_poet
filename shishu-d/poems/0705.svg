<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370"><rect width="1000" height="1370" fill="#fffafd"/><rect x="28" y="28" width="944" height="1314" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0705</text><text x="90" y="155" font-size="34">タッチ交代</text><text x="90" y="220" font-size="28">人から人</text><text x="90" y="260" font-size="28">人から人</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">巡り巡り</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">人は活かされて</text><text x="90" y="460" font-size="28">そうして世代に</text><text x="90" y="500" font-size="28">交代する</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">私たちは年を取る</text><text x="90" y="620" font-size="28">当たり前な事</text><text x="90" y="660" font-size="28">でも、重要なこと</text><text x="90" y="700" font-size="28">世代交代も</text><text x="90" y="740" font-size="28">私たちは、しなければ</text><text x="90" y="780" font-size="28">後先が厳しくなる</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">受け継がれがいるなら</text><text x="90" y="900" font-size="28">交代すればいい、</text><text x="90" y="940" font-size="28">生かすもいかなさいも</text><text x="90" y="980" font-size="28">私たちの責務</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">次世代への扉を</text><text x="90" y="1100" font-size="28">開くのも</text><text x="90" y="1140" font-size="28">私たちの責務</text><text x="90" y="1180" font-size="28">だから、</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">生かすもいかなさいも</text><text x="90" y="1300" font-size="28">私たち、次第です</text><text x="90" y="1315" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>