<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1770" viewBox="0 0 1000 1770"><rect width="1000" height="1770" fill="#fffafd"/><rect x="28" y="28" width="944" height="1714" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0461</text><text x="90" y="155" font-size="34">Notice(ノーティス)</text><text x="90" y="220" font-size="28">気がつくって</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">なかなかできない事</text><text x="90" y="340" font-size="28">気がつくって</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">大変なこと</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">だって、自分自身は</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">自分自身を信じてるから</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">だから、なかなか気づくことって</text><text x="90" y="700" font-size="28">ままではない</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">でも、気がつくと</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">一瞬で涙と絶望に浸る</text><text x="90" y="900" font-size="28">だって、自分自身を</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">それ程までに気がつきたいから</text><text x="90" y="1020" font-size="28">信じたいから</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">それが、自分を見つめ直す</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">段階に陥る</text><text x="90" y="1220" font-size="28">だから、絶望になる</text><text x="90" y="1260" font-size="28">だから、涙を流す</text><text x="90" y="1300" font-size="28">それが気づき</text><text x="90" y="1340" font-size="28">知らなかった事の</text><text x="90" y="1380" font-size="28">気づく感情になる</text><text x="90" y="1420" font-size="28">でも、向き合えば</text><text x="90" y="1460" font-size="28">自分が変わる</text><text x="90" y="1500" font-size="28">新しく変わっていく</text><text x="90" y="1540" font-size="28">必要な事に</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">気づく</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">それは、大事</text><text x="90" y="1715" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>