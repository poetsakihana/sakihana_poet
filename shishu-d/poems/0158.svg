<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0158</text><text x="90" y="155" font-size="34">若かった</text><text x="90" y="220" font-size="28">私たち、若かったよね</text><text x="90" y="260" font-size="28">そう笑い合えたらいいなぁ</text><text x="90" y="300" font-size="28">私たち、どんな恋をしたかな</text><text x="90" y="340" font-size="28">そう思い出せたら、いいなぁ</text><text x="90" y="380" font-size="28">私たち　愛したかな</text><text x="90" y="420" font-size="28">そう聞けたなら</text><text x="90" y="460" font-size="28">若く出会った</text><text x="90" y="500" font-size="28">あの日から、何年か</text><text x="90" y="540" font-size="28">時が過ぎて</text><text x="90" y="580" font-size="28">今でも長く付き合って</text><text x="90" y="620" font-size="28">あれからといえる日が</text><text x="90" y="660" font-size="28">いつの日か来るだろうなぁ</text><text x="90" y="700" font-size="28">そう考えるとワクワクする</text><text x="90" y="740" font-size="28">そう考えるとドキドキする</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>