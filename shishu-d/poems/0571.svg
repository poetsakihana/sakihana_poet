<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330"><rect width="1000" height="1330" fill="#fffafd"/><rect x="28" y="28" width="944" height="1274" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0571</text><text x="90" y="155" font-size="34">各肉の日</text><text x="90" y="220" font-size="28">各肉の日</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">広島と長崎の</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">膨大な爆火が</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">町を飲み込むように</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">私達を貴然とさせる程の</text><text x="90" y="580" font-size="28">破壊力だった</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">毎年行われる追悼式典</text><text x="90" y="700" font-size="28">私も悼む心を持って</text><text x="90" y="740" font-size="28">戦争反対と心に強く刻んで</text><text x="90" y="780" font-size="28">悼んだ</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">苦肉に思う昭和時代初期</text><text x="90" y="900" font-size="28">私の心にも痛みが伝わった</text><text x="90" y="940" font-size="28">悲惨だった当時が伝わった</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">平和公園にて黙待を捧げた</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">そうして、涙ぐんだ</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">原子爆弾たった一つの水で</text><text x="90" y="1220" font-size="28">異をと震わせて人を落としめた</text><text x="90" y="1260" font-size="28">怖い話現実に起きたなんて心が痛い</text><text x="90" y="1275" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>