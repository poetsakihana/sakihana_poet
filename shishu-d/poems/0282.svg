<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><rect width="1000" height="1050" fill="#fffafd"/><rect x="28" y="28" width="944" height="994" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0282</text><text x="90" y="155" font-size="34">海</text><text x="90" y="220" font-size="28">海は、広いな。</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">広いけど、私には手で全部を包めない。</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">あの人の心の雨にも、包むことができない。</text><text x="90" y="420" font-size="28">近くにいても、唯、胸が裂けそうになるけど、</text><text x="90" y="460" font-size="28">手で包みたくても、包めない。</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">大切な人の労りを包むことができない。</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">でも、海のように広い気持ちで支える事ができる。</text><text x="90" y="660" font-size="28">替が流れても、広い気持ちで支えてあげられる。</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">そのように、日々を過ごしても、絶えない大切な人。</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">どうしてあげられたら、静彼感で…。</text><text x="90" y="860" font-size="28">どうしてあげられたら、安心感で…。</text><text x="90" y="900" font-size="28">笑みを太陽のように表れて下さるのだろう。</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">そう願っても、大切な人は、癒されなかった…。</text><text x="90" y="995" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>