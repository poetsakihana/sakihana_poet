<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210"><rect width="1000" height="1210" fill="#fffafd"/><rect x="28" y="28" width="944" height="1154" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0565</text><text x="90" y="155" font-size="34">こだわり</text><text x="90" y="220" font-size="28">こだわりを持つと人問</text><text x="90" y="260" font-size="28">その事に協力して徹してしまう</text><text x="90" y="300" font-size="28">こだわりは人間の癖でも</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">してはならないこだわりがある</text><text x="90" y="420" font-size="28">どうか悪いこだわりが</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">あなたに備わってるなら</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">私が見抜いて取り除きます</text><text x="90" y="620" font-size="28">こだわりは自分がこうでなければと</text><text x="90" y="660" font-size="28">固定して自分が自分であるように</text><text x="90" y="700" font-size="28">こだわりを崩さないように</text><text x="90" y="740" font-size="28">保とうとします</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">でも私はあなたのこだわりは</text><text x="90" y="860" font-size="28">悪いとは思っていません</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">けれども万が一</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">悪くなれば私が手綱として</text><text x="90" y="1060" font-size="28">手助けをしたい幸せという事を</text><text x="90" y="1100" font-size="28">とにかく実感して欲しいから</text><text x="90" y="1140" font-size="28">良いこだわりを実感して欲しいから</text><text x="90" y="1155" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>