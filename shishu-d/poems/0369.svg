<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1490" viewBox="0 0 1000 1490"><rect width="1000" height="1490" fill="#fffafd"/><rect x="28" y="28" width="944" height="1434" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0369</text><text x="90" y="155" font-size="34">愉しむ(たのしおむ)</text><text x="90" y="220" font-size="28">快く愉しむ事が</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">人生のありかた</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">愉しむ事は、ワクワクと</text><text x="90" y="420" font-size="28">胸が高鳴る感情の一つ</text><text x="90" y="460" font-size="28">人生の生きがいを</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">見つける鍵になって</text><text x="90" y="580" font-size="28">明日が、また、</text><text x="90" y="620" font-size="28">愉しむ一日になる</text><text x="90" y="660" font-size="28">笑う2うことさえあれば、</text><text x="90" y="700" font-size="28">ーー日が愉しくなる</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">愉しいから感情面を</text><text x="90" y="820" font-size="28">優しく包み込む</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">その優しさが重要な鍵でもある</text><text x="90" y="940" font-size="28">マイナスな思いになれば</text><text x="90" y="980" font-size="28">心の花は警む</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">プラスな思いになれば、</text><text x="90" y="1100" font-size="28">心の花は開く</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">そうして人は、</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">生きる道を心で左右され</text><text x="90" y="1300" font-size="28">愉しい事や、様々な感情を</text><text x="90" y="1340" font-size="28">吐ききるのです。</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">良い意味で</text><text x="90" y="1435" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>