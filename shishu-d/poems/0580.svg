<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1810" viewBox="0 0 1000 1810"><rect width="1000" height="1810" fill="#fffafd"/><rect x="28" y="28" width="944" height="1754" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0580</text><text x="90" y="155" font-size="34">猛獣になった</text><text x="90" y="220" font-size="28">猛獣を好んでなったわけじゃない</text><text x="90" y="260" font-size="28">好き好んで、</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">肉を食べているわけじゃない</text><text x="90" y="380" font-size="28">ただ、必死なだけなんだ</text><text x="90" y="420" font-size="28">ただ、使命を与えられた</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">本当の気持ちじゃなくて</text><text x="90" y="540" font-size="28">本能でもなくて、</text><text x="90" y="580" font-size="28">無意識なこと</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">何が悲しくてそれを</text><text x="90" y="700" font-size="28">鹿やシマウマを</text><text x="90" y="740" font-size="28">食いつくのか</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">おいらには、</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">わからない</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">無意識なこと</text><text x="90" y="1020" font-size="28">それをそのまま</text><text x="90" y="1060" font-size="28">受け止めて欲しくない</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">おいらは、</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">こうなってしまったんだ</text><text x="90" y="1260" font-size="28">獅子としてなってしまったんだ</text><text x="90" y="1300" font-size="28">かわいそうな事をして</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">しまう迷惑な動物に</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">なってしまったんだ</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">人間さん…気が付いて下さい</text><text x="90" y="1580" font-size="28">人間さんのように</text><text x="90" y="1620" font-size="28">優しい心でいたい</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">人間さんのように</text><text x="90" y="1740" font-size="28">温かい心でいたい</text><text x="90" y="1755" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>