<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210"><rect width="1000" height="1210" fill="#fffafd"/><rect x="28" y="28" width="944" height="1154" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0439</text><text x="90" y="155" font-size="34">希望のフルート</text><text x="90" y="220" font-size="28">希望に満ちていた</text><text x="90" y="260" font-size="28">そのフルートは</text><text x="90" y="300" font-size="28">今では、段ボールの身底</text><text x="90" y="340" font-size="28">隠れている</text><text x="90" y="380" font-size="28">潜んでいる</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">ホコリにかぶった</text><text x="90" y="500" font-size="28">私のフルート</text><text x="90" y="540" font-size="28">学生時代に吹いていた</text><text x="90" y="580" font-size="28">三年間と共にいた</text><text x="90" y="620" font-size="28">その時間は、</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">あっという間に</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">過ぎ去って</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">今、役を果たして</text><text x="90" y="900" font-size="28">段ボールの中で</text><text x="90" y="940" font-size="28">思い出の楽器として</text><text x="90" y="980" font-size="28">潜んでいる</text><text x="90" y="1020" font-size="28">思い出の楽器として</text><text x="90" y="1060" font-size="28">寝かしている</text><text x="90" y="1100" font-size="28">思い出してくれる</text><text x="90" y="1140" font-size="28">時を待って</text><text x="90" y="1155" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>