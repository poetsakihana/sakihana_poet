<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2090" viewBox="0 0 1000 2090"><rect width="1000" height="2090" fill="#fffafd"/><rect x="28" y="28" width="944" height="2034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0695</text><text x="90" y="155" font-size="34">幸せの一歩</text><text x="90" y="220" font-size="28">私が幸せの一歩</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">あなたも幸せの一歩</text><text x="90" y="340" font-size="28">始めてみよう</text><text x="90" y="380" font-size="28">幸せがないと</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">なかなか笑顔になれない</text><text x="90" y="500" font-size="28">笑顔じゃないと</text><text x="90" y="540" font-size="28">豊かになれない</text><text x="90" y="580" font-size="28">幸せの第一歩</text><text x="90" y="620" font-size="28">踏み出そうよ</text><text x="90" y="660" font-size="28">私と一緒に</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">なかなか前に進めないけど</text><text x="90" y="780" font-size="28">幸せの一歩</text><text x="90" y="820" font-size="28">踏みあるこう</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">何故、幸せ来ない</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">幸の一学もない</text><text x="90" y="1020" font-size="28">毎日が色々なのは</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">人生の流れが</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">流れが悪いからなのか</text><text x="90" y="1220" font-size="28">愛という愛</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">そのものを掴みたい</text><text x="90" y="1340" font-size="28">幸せの訪れ</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">向かい入れたい</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">この気持ち</text><text x="90" y="1540" font-size="28"></text><text x="90" y="1580" font-size="28">どうして来ないんだろう</text><text x="90" y="1620" font-size="28">幸せの音が</text><text x="90" y="1660" font-size="28">聴こえないんだろう</text><text x="90" y="1700" font-size="28"></text><text x="90" y="1740" font-size="28">掴むのは</text><text x="90" y="1780" font-size="28"></text><text x="90" y="1820" font-size="28">私たち、だけど…</text><text x="90" y="1860" font-size="28"></text><text x="90" y="1900" font-size="28">他の人に流されてしまう</text><text x="90" y="1940" font-size="28">正しても呑み込まれる</text><text x="90" y="1980" font-size="28">それは、違いない</text><text x="90" y="2020" font-size="28">それにしても、幸を得たい</text><text x="90" y="2035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>