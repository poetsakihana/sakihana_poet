<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370"><rect width="1000" height="1370" fill="#fffafd"/><rect x="28" y="28" width="944" height="1314" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0434</text><text x="90" y="155" font-size="34">全音符</text><text x="90" y="220" font-size="28">ながーーく伸ばす</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">そんな期間があれば</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">マイペースでいられる</text><text x="90" y="420" font-size="28">全音符のように</text><text x="90" y="460" font-size="28">音楽のしめや</text><text x="90" y="500" font-size="28">音楽の合間に</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">どっしり構えたそんな記号ある</text><text x="90" y="620" font-size="28">からこそ、音楽の世界は、</text><text x="90" y="660" font-size="28">ファンタジーな感じで</text><text x="90" y="700" font-size="28">ゆったりと速くと</text><text x="90" y="740" font-size="28">魔法にかかったように</text><text x="90" y="780" font-size="28">聴く人は、夢の世界に入る</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">その世界観に入ると</text><text x="90" y="900" font-size="28">安心ができる気持ちで</text><text x="90" y="940" font-size="28">全音符は、そんな事を</text><text x="90" y="980" font-size="28">教えてくれる</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">ながーく伸ばすから</text><text x="90" y="1100" font-size="28">音楽が生きているんだって</text><text x="90" y="1140" font-size="28">短いのも必要だけど</text><text x="90" y="1180" font-size="28">ながーく生きるのも</text><text x="90" y="1220" font-size="28">人間必要だから</text><text x="90" y="1260" font-size="28">長生きが一番</text><text x="90" y="1300" font-size="28">全音符が教えてくれる</text><text x="90" y="1315" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>