<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1890" viewBox="0 0 1000 1890"><rect width="1000" height="1890" fill="#fffafd"/><rect x="28" y="28" width="944" height="1834" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0647</text><text x="90" y="155" font-size="34">笑顔になれた?</text><text x="90" y="220" font-size="28">笑顔になれた?</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">にっこり笑えた?</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">なかなか笑えない</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">何かが気がかりで</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">なかなか笑えない</text><text x="90" y="580" font-size="28">それはなに?</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">心が挫けてるの</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">ほぼほっかりと穴が空いて</text><text x="90" y="780" font-size="28">すっかり心が黙ってしまってる</text><text x="90" y="820" font-size="28">笑顔をすっかりと</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">なくしたみたい</text><text x="90" y="940" font-size="28">置いてきちゃったんだね</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">心が迷子さんになってるの</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">だから、黙ったりしてる</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">あなたは自分を傷つけてるの</text><text x="90" y="1220" font-size="28">私ではわからない</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">恐らく、傷つけてるんだね</text><text x="90" y="1340" font-size="28">謝るろう、心に</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">ごめんなさいって</text><text x="90" y="1460" font-size="28"></text><text x="90" y="1500" font-size="28">そうすると自然に笑顔になれるよ</text><text x="90" y="1540" font-size="28">私を信じて</text><text x="90" y="1580" font-size="28"></text><text x="90" y="1620" font-size="28">ごめんなさい私</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">ごめんなさい心</text><text x="90" y="1740" font-size="28">傷を負わせて</text><text x="90" y="1780" font-size="28"></text><text x="90" y="1820" font-size="28">ごめんなさい</text><text x="90" y="1835" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>