<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210"><rect width="1000" height="1210" fill="#fffafd"/><rect x="28" y="28" width="944" height="1154" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0166</text><text x="90" y="155" font-size="34">公園先で</text><text x="90" y="220" font-size="28">私は一人で公園を歩いた</text><text x="90" y="260" font-size="28">子供達</text><text x="90" y="300" font-size="28">犬連れの大人</text><text x="90" y="340" font-size="28">たくさんの人が集まる公共の場所</text><text x="90" y="380" font-size="28">公園は好かれている</text><text x="90" y="420" font-size="28">私はひとつに注目点をおく</text><text x="90" y="460" font-size="28">子供の一人</text><text x="90" y="500" font-size="28">女の子があたふたして</text><text x="90" y="540" font-size="28">どうも一人ぼっちで</text><text x="90" y="580" font-size="28">誰に遊んでもらえる</text><text x="90" y="620" font-size="28">ということはなく</text><text x="90" y="660" font-size="28">あたふたをしていた</text><text x="90" y="700" font-size="28">私は、近寄って</text><text x="90" y="740" font-size="28">「どうしたの？」</text><text x="90" y="780" font-size="28">女の子のあたふたが私に向けられ</text><text x="90" y="820" font-size="28">「一人ぼっちなの」</text><text x="90" y="860" font-size="28">やっぱりだった</text><text x="90" y="900" font-size="28">「私と遊びましょう」</text><text x="90" y="940" font-size="28">その子は喜んだ</text><text x="90" y="980" font-size="28">こうして、ひとりひとりと</text><text x="90" y="1020" font-size="28">輪がつながるといいのに</text><text x="90" y="1060" font-size="28">こんなに小さな子でも</text><text x="90" y="1100" font-size="28">ひとりひとりと</text><text x="90" y="1140" font-size="28">つながればいいのにな</text><text x="90" y="1155" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>