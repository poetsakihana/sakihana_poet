<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1690" viewBox="0 0 1000 1690"><rect width="1000" height="1690" fill="#fffafd"/><rect x="28" y="28" width="944" height="1634" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0939</text><text x="90" y="155" font-size="34">モノクロの恋</text><text x="90" y="220" font-size="28">色がついてないから</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">恋に花が咲かないなんて</text><text x="90" y="340" font-size="28">そうじゃない</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">モノクロでも恋の花は咲く</text><text x="90" y="460" font-size="28">白ければ、ヴェールに包まれて</text><text x="90" y="500" font-size="28">ドレスは真珠色に交く</text><text x="90" y="540" font-size="28">例え、色がかけても</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">その色は生きている</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">黒と灰に負けないほどの</text><text x="90" y="740" font-size="28">紅かしさをみにまとえば</text><text x="90" y="780" font-size="28">その色は生きている</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">あなたも生きている</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">私は揺れた</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">地震と共に私は揺れた</text><text x="90" y="1060" font-size="28">これが大震災だと</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">ニュースを見ながら和驚いた</text><text x="90" y="1180" font-size="28">日本が地震にみまわれて</text><text x="90" y="1220" font-size="28">津波で押し寄せる災厄の日</text><text x="90" y="1260" font-size="28">亡くなる人、可哀起</text><text x="90" y="1300" font-size="28">被災者、可哀想</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">私はみんなに伝えたい</text><text x="90" y="1420" font-size="28">いつまでも絶えないで</text><text x="90" y="1460" font-size="28">贈り物をしよう</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">苦しんでるのを見過ごせない</text><text x="90" y="1580" font-size="28">私たちは、涙を見せずに</text><text x="90" y="1620" font-size="28">支えになろう</text><text x="90" y="1635" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>