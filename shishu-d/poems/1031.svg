<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410"><rect width="1000" height="1410" fill="#fffafd"/><rect x="28" y="28" width="944" height="1354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 1031</text><text x="90" y="155" font-size="34">金と銀</text><text x="90" y="220" font-size="28">金賞も銀賞も</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">どちらでもお互いに頑張った成果であり</text><text x="90" y="340" font-size="28">金をとっても</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">銀をとっても</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">銅をとっても</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">みんな頑張った人というのは</text><text x="90" y="620" font-size="28">違いはないのです</text><text x="90" y="660" font-size="28">金がとれなくて残念</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">銀がとれなくて残念</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">銅きえもとれなかった</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">それは、あなたの考え方で</text><text x="90" y="940" font-size="28">変わってくる事</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">銀がとれた事でも大したことじゅないか</text><text x="90" y="1060" font-size="28">3位に入らなくても実力が発揮したんだ</text><text x="90" y="1100" font-size="28">良かったじゃないかって</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">思いは自由に変えられる</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">それでも悔しければ</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">次、頑張ればいい</text><text x="90" y="1355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>