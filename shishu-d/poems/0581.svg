<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2290" viewBox="0 0 1000 2290"><rect width="1000" height="2290" fill="#fffafd"/><rect x="28" y="28" width="944" height="2234" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0581</text><text x="90" y="155" font-size="34">君のこと知ってるよ</text><text x="90" y="220" font-size="28">いつだって、</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">友達だよ</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">いつだって、</text><text x="90" y="420" font-size="28">サルの芸をするよ</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">だって、これまでに</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">どれだけの芸をしたか</text><text x="90" y="620" font-size="28">どれだけ、君を</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">知ったか</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">泣いた時だってあったね</text><text x="90" y="820" font-size="28">困らせた時だってあったね</text><text x="90" y="860" font-size="28">怒らせた時だってあったね</text><text x="90" y="900" font-size="28">色々な感情を巡らせて</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">ぽくの心の中は、</text><text x="90" y="1020" font-size="28">傷いっぱい</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">だから、君のこと知ってるよ</text><text x="90" y="1140" font-size="28">いつだって、残ってるよ</text><text x="90" y="1180" font-size="28">君といた</text><text x="90" y="1220" font-size="28"></text><text x="90" y="1260" font-size="28">長い間</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">深い、深い絆</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">すごく残っているんだよ</text><text x="90" y="1460" font-size="28">君の笑顔いっぱいに</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">見せてくれた思い出の</text><text x="90" y="1580" font-size="28">ーー時、</text><text x="90" y="1620" font-size="28"></text><text x="90" y="1660" font-size="28">ぼくは、逝ってしまうけど</text><text x="90" y="1700" font-size="28">決して、忘れたりしない</text><text x="90" y="1740" font-size="28">こんな数々の思い出</text><text x="90" y="1780" font-size="28"></text><text x="90" y="1820" font-size="28">捨てきれるわけもない</text><text x="90" y="1860" font-size="28">逝ってきます</text><text x="90" y="1900" font-size="28"></text><text x="90" y="1940" font-size="28">あの世に行ってきても</text><text x="90" y="1980" font-size="28">君の隣で</text><text x="90" y="2020" font-size="28"></text><text x="90" y="2060" font-size="28">ぼくが逆に笑顔で</text><text x="90" y="2100" font-size="28"></text><text x="90" y="2140" font-size="28">接するよ</text><text x="90" y="2180" font-size="28"></text><text x="90" y="2220" font-size="28">ありがとう…僕のパートナー</text><text x="90" y="2235" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>