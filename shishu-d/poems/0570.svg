<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250"><rect width="1000" height="1250" fill="#fffafd"/><rect x="28" y="28" width="944" height="1194" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0570</text><text x="90" y="155" font-size="34">小窓から</text><text x="90" y="220" font-size="28">小窓からのぞけば</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">そこは、戦場の跡</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">小窓からのぞけば</text><text x="90" y="420" font-size="28">卑屈の叫びが</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">いくつもの飛び交う</text><text x="90" y="540" font-size="28">叫びの中で子供の泣き声が</text><text x="90" y="580" font-size="28">悲しげに聞こえて</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">心が痛々しく思えてならない</text><text x="90" y="700" font-size="28">どうすることもできない</text><text x="90" y="740" font-size="28">その崇張の中で</text><text x="90" y="780" font-size="28">子供はどう生きていければ</text><text x="90" y="820" font-size="28">どう囚われた身から</text><text x="90" y="860" font-size="28">言い伝えたらいいのか</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">私には、とても言えない</text><text x="90" y="980" font-size="28">救いたい心が真っ先に</text><text x="90" y="1020" font-size="28">立ってしまって、</text><text x="90" y="1060" font-size="28"></text><text x="90" y="1100" font-size="28">もう苦しい想いでたまりません</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">小窯から卑屈の声が聞こえてくる</text><text x="90" y="1195" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>