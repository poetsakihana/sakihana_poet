<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1690" viewBox="0 0 1000 1690"><rect width="1000" height="1690" fill="#fffafd"/><rect x="28" y="28" width="944" height="1634" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0868</text><text x="90" y="155" font-size="34">はじめましての芽</text><text x="90" y="220" font-size="28">初めまして</text><text x="90" y="260" font-size="28">私はこうゆうものです</text><text x="90" y="300" font-size="28">誰でもある</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">自己紹介</text><text x="90" y="420" font-size="28">初めての人に</text><text x="90" y="460" font-size="28">私を知ることから</text><text x="90" y="500" font-size="28">説明をして</text><text x="90" y="540" font-size="28">安心できる人か</text><text x="90" y="580" font-size="28">見てもらう</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">芽を開くまで</text><text x="90" y="700" font-size="28">先には進めない</text><text x="90" y="740" font-size="28">発芽する時が花</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">これからもよろしく</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">お互いに</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">協力し合う仲</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">そんな仲でいたいぃ</text><text x="90" y="1100" font-size="28">初めは誰でも</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">目を合わすのができないよね</text><text x="90" y="1220" font-size="28">だけど、どちらかが</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">私は何も悪いことしませんよ</text><text x="90" y="1340" font-size="28">私はあなたの味方です</text><text x="90" y="1380" font-size="28"></text><text x="90" y="1420" font-size="28">そのような自己紹介をする</text><text x="90" y="1460" font-size="28">そうすると自然と</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">向き合える仲になるから</text><text x="90" y="1580" font-size="28">芽に花を咲かせよう</text><text x="90" y="1620" font-size="28">綺麗な花にしよう</text><text x="90" y="1635" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>