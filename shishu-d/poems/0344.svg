<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090"><rect width="1000" height="1090" fill="#fffafd"/><rect x="28" y="28" width="944" height="1034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0344</text><text x="90" y="155" font-size="34">タ陽が沈む</text><text x="90" y="220" font-size="28">遠くの夕陽が山の頂を照らして</text><text x="90" y="260" font-size="28">微笑みをこちらに返しているようだ</text><text x="90" y="300" font-size="28">まるで私と見つめ合っているように</text><text x="90" y="340" font-size="28">ただ、私は陽の沈むのをみていた</text><text x="90" y="380" font-size="28">陽も私やみんなを見ていた。</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">でも陽は、明日まで顔を出さない</text><text x="90" y="500" font-size="28">さようなら…お陽さま</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">明日も、今日のように</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">恵の陽を照らしてください</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">さようなら…お陽さま</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">そう、タ夕陽を見つめて話し合った。</text><text x="90" y="860" font-size="28">でも、お陽さまは返事がない</text><text x="90" y="900" font-size="28">さよならと返事がない</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">でも、私は、明日まで</text><text x="90" y="1020" font-size="28">待ち続ける、お陽さまを信じて</text><text x="90" y="1035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>