<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250"><rect width="1000" height="1250" fill="#fffafd"/><rect x="28" y="28" width="944" height="1194" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0088</text><text x="90" y="155" font-size="34">婚約指輪</text><text x="90" y="220" font-size="28">あなたとの待ち合わせ場所</text><text x="90" y="260" font-size="28">橋の真ん中で</text><text x="90" y="300" font-size="28">風に当たりながらも</text><text x="90" y="340" font-size="28">待ち続けた</text><text x="90" y="380" font-size="28">スカートがひらひらと</text><text x="90" y="420" font-size="28">ゆらいでいた</text><text x="90" y="460" font-size="28">走って遠くから</text><text x="90" y="500" font-size="28">爽やかな顔をして</text><text x="90" y="540" font-size="28">やってきたあなた</text><text x="90" y="580" font-size="28">「おまたせ」とあなたは即座に</text><text x="90" y="620" font-size="28">手紙を渡した</text><text x="90" y="660" font-size="28">その手紙は膨らんでいた</text><text x="90" y="700" font-size="28">雨にでも濡れて膨らんだのかな</text><text x="90" y="740" font-size="28">それにしては硬い</text><text x="90" y="780" font-size="28">あなたは、手を差し伸べていた</text><text x="90" y="820" font-size="28">手紙の封を開けた</text><text x="90" y="860" font-size="28">中には、便箋と指輪だった</text><text x="90" y="900" font-size="28">「これは、なに？」</text><text x="90" y="940" font-size="28">「いいから読んでくれ」</text><text x="90" y="980" font-size="28">その手紙はあなたからの</text><text x="90" y="1020" font-size="28">プロポーズだった</text><text x="90" y="1060" font-size="28">「薔薇よりも美しい君をどんな時も愛してる。だから結婚し</text><text x="90" y="1100" font-size="28">てくれ」と。</text><text x="90" y="1140" font-size="28">咄嗟にあなたの手を</text><text x="90" y="1180" font-size="28">恥ずかしながら握った</text><text x="90" y="1195" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>