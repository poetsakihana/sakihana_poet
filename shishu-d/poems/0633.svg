<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1290" viewBox="0 0 1000 1290"><rect width="1000" height="1290" fill="#fffafd"/><rect x="28" y="28" width="944" height="1234" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0633</text><text x="90" y="155" font-size="34">鯖玉くれた</text><text x="90" y="220" font-size="28">お母さんと一緒に行った</text><text x="90" y="260" font-size="28">その行く先で</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">お姉さんから</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">館玉を一つもらった</text><text x="90" y="460" font-size="28">嬉しかったその気持ち</text><text x="90" y="500" font-size="28">手で握って</text><text x="90" y="540" font-size="28">溶けないかと思うぐらい</text><text x="90" y="580" font-size="28">その気持ちが嬉しかった</text><text x="90" y="620" font-size="28">おまけでくれた</text><text x="90" y="660" font-size="28">館玉は、帰り道に</text><text x="90" y="700" font-size="28">口に含んで</text><text x="90" y="740" font-size="28">満面の笑みで</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">お母さんと手を思いっきり</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">振りながら</text><text x="90" y="940" font-size="28">帰って行った</text><text x="90" y="980" font-size="28"></text><text x="90" y="1020" font-size="28">館玉、ありがとうって</text><text x="90" y="1060" font-size="28">今、お礼が言いたい</text><text x="90" y="1100" font-size="28">当時の自分を</text><text x="90" y="1140" font-size="28">ふりかえって</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">思い浸った</text><text x="90" y="1235" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>