<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250"><rect width="1000" height="1250" fill="#fffafd"/><rect x="28" y="28" width="944" height="1194" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0632</text><text x="90" y="155" font-size="34">小石見つけた</text><text x="90" y="220" font-size="28">小石を見つけたよ</text><text x="90" y="260" font-size="28">ちっちゃな</text><text x="90" y="300" font-size="28">可愛らしい小石</text><text x="90" y="340" font-size="28">珍しい小石だね</text><text x="90" y="380" font-size="28">形が正しいとか</text><text x="90" y="420" font-size="28">そんなんじゃなくて</text><text x="90" y="460" font-size="28">小石そのものが</text><text x="90" y="500" font-size="28">可愛らしいんだよ</text><text x="90" y="540" font-size="28">珍しくないの$</text><text x="90" y="580" font-size="28">みんな同じだからね</text><text x="90" y="620" font-size="28">みんな同じじゃないと</text><text x="90" y="660" font-size="28">可哀想だから</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">仲間外れにされたって</text><text x="90" y="780" font-size="28">可妄想だから</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">みんな形は、違っても</text><text x="90" y="900" font-size="28">小石は小石</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">私たちと一緒だね</text><text x="90" y="1020" font-size="28">そうだね、人も</text><text x="90" y="1060" font-size="28">私もせいちゃんも</text><text x="90" y="1100" font-size="28">みんなみんな</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">同じ、人だね</text><text x="90" y="1195" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>