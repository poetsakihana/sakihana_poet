<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><rect width="1000" height="1050" fill="#fffafd"/><rect x="28" y="28" width="944" height="994" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0063</text><text x="90" y="155" font-size="34">笑ってくれてたら…私</text><text x="90" y="220" font-size="28">一度でも、あなたの笑顔がね</text><text x="90" y="260" font-size="28">見れたらいいなぁって</text><text x="90" y="300" font-size="28">いつだっておもっちゃうの</text><text x="90" y="340" font-size="28">私がオシャレさんになっても</text><text x="90" y="380" font-size="28">私がニコって笑っても</text><text x="90" y="420" font-size="28">あなたは思いつきのまま、むすっとしたまま</text><text x="90" y="460" font-size="28">そうするとね、私</text><text x="90" y="500" font-size="28">あなたの背中をポンって押すの</text><text x="90" y="540" font-size="28">あなたは『どうしたんだ』って冗談で笑う</text><text x="90" y="580" font-size="28">でも、そんな冗談な笑顔じゃなくてさ</text><text x="90" y="620" font-size="28">満面に笑ってくれたなら</text><text x="90" y="660" font-size="28">私…好きでいられるのに</text><text x="90" y="700" font-size="28">腕を組んでも、黙ったまま</text><text x="90" y="740" font-size="28">また、背中を押すと冗談で笑う</text><text x="90" y="780" font-size="28">あなたはまるでネジまき人形のように</text><text x="90" y="820" font-size="28">私を何も気にしないで見ていた</text><text x="90" y="860" font-size="28">切ないじゃん</text><text x="90" y="900" font-size="28">そんなあなたでいてほしくないよ</text><text x="90" y="940" font-size="28">笑った笑顔は誰よりも素敵だったじゃん</text><text x="90" y="980" font-size="28">その笑顔が好きだったの</text><text x="90" y="995" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>