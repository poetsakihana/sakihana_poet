<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1530" viewBox="0 0 1000 1530"><rect width="1000" height="1530" fill="#fffafd"/><rect x="28" y="28" width="944" height="1474" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0961</text><text x="90" y="155" font-size="34">愛し合う人</text><text x="90" y="220" font-size="28">愛することは人の求め</text><text x="90" y="260" font-size="28">異性が恋するのは</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">全く知らない新鮮そのもの</text><text x="90" y="380" font-size="28">新しい人だってことの</text><text x="90" y="420" font-size="28">求める求愛</text><text x="90" y="460" font-size="28">実は懐かしかったりする</text><text x="90" y="500" font-size="28">実は憧れたりする</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">愛することは人生の始まり</text><text x="90" y="620" font-size="28">第二の歩みを表す</text><text x="90" y="660" font-size="28">恋するのは厳しさ交じりの人生</text><text x="90" y="700" font-size="28">第二波の現れ</text><text x="90" y="740" font-size="28">相手がいかに心良き人で</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">いかにあなたに愛を持ち続けるか</text><text x="90" y="860" font-size="28">恋の始まりは地獄の始まり</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">その地獄を天国に変えるのは</text><text x="90" y="980" font-size="28">あなた方しだい</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">片方が月れば、大変</text><text x="90" y="1100" font-size="28"></text><text x="90" y="1140" font-size="28">愛し合うところは</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">以内</text><text x="90" y="1260" font-size="28"></text><text x="90" y="1300" font-size="28">恋するところは</text><text x="90" y="1340" font-size="28"></text><text x="90" y="1380" font-size="28">以上</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">お相手、見つかるとわかります</text><text x="90" y="1475" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>