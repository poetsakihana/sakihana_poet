<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0105</text><text x="90" y="155" font-size="34">捻転</text><text x="90" y="220" font-size="28">頭をどう捻（ねじ）っても</text><text x="90" y="260" font-size="28">首をどう捻（ひね）っても</text><text x="90" y="300" font-size="28">考えが浮かばないとき</text><text x="90" y="340" font-size="28">それは、沈黙の一時に</text><text x="90" y="380" font-size="28">沈めてしまう</text><text x="90" y="420" font-size="28">きっとどこかで思いつくはず</text><text x="90" y="460" font-size="28">寝室のベッドで</text><text x="90" y="500" font-size="28">お風呂の中で</text><text x="90" y="540" font-size="28">きっと考えが浮かぶはず</text><text x="90" y="580" font-size="28">どうしてもの場合は</text><text x="90" y="620" font-size="28">きっと今が考える時ではない</text><text x="90" y="660" font-size="28">休憩の時だと</text><text x="90" y="700" font-size="28">開き直って別のことをやる</text><text x="90" y="740" font-size="28">それが最善策</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>