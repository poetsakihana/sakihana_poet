<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1970" viewBox="0 0 1000 1970"><rect width="1000" height="1970" fill="#fffafd"/><rect x="28" y="28" width="944" height="1914" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0490</text><text x="90" y="155" font-size="34">嫌がらせを</text><text x="90" y="220" font-size="28">嫌がらせをして</text><text x="90" y="260" font-size="28">嫌な想いだけが</text><text x="90" y="300" font-size="28"></text><text x="90" y="340" font-size="28">しがらみかについて</text><text x="90" y="380" font-size="28">いい事なしの</text><text x="90" y="420" font-size="28">ことばかり</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">そんな</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">マイナスのスパイラルから</text><text x="90" y="620" font-size="28">思い切って</text><text x="90" y="660" font-size="28">切り離そをうよ</text><text x="90" y="700" font-size="28">嫌がらせをした子に</text><text x="90" y="740" font-size="28">ちゃんと</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">謝ろう</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">だって、あなたもその子も</text><text x="90" y="940" font-size="28">画方、悪気あっての事じゃないから</text><text x="90" y="980" font-size="28">何で信じられるかって?</text><text x="90" y="1020" font-size="28">あなたを信じるからだよ</text><text x="90" y="1060" font-size="28">悪意を持っても</text><text x="90" y="1100" font-size="28">善意を持っても</text><text x="90" y="1140" font-size="28"></text><text x="90" y="1180" font-size="28">あなたはあなただから</text><text x="90" y="1220" font-size="28">あなたに変わりはないから</text><text x="90" y="1260" font-size="28">でも</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">嫌がらせって</text><text x="90" y="1380" font-size="28">良い事なのか、</text><text x="90" y="1420" font-size="28">あなたがその子が</text><text x="90" y="1460" font-size="28">気になったんだよね</text><text x="90" y="1500" font-size="28"></text><text x="90" y="1540" font-size="28">だから、</text><text x="90" y="1580" font-size="28">嫌がらせを</text><text x="90" y="1620" font-size="28">したんだよね</text><text x="90" y="1660" font-size="28"></text><text x="90" y="1700" font-size="28">意地を張らなくても</text><text x="90" y="1740" font-size="28"></text><text x="90" y="1780" font-size="28">いいんだよ</text><text x="90" y="1820" font-size="28"></text><text x="90" y="1860" font-size="28">あなたは、助けているんだから</text><text x="90" y="1900" font-size="28">自分もその子も</text><text x="90" y="1915" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>