<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#fffafd"/><rect x="28" y="28" width="944" height="944" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0276</text><text x="90" y="155" font-size="34">長距離走</text><text x="90" y="220" font-size="28">ピストルの銃声がグラウンドに響く。</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">一斉に競い合い、微妙な小幅の走りをし始める。</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">一周になる前に人息が弾み始める。</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">走る距離で、先へ行く人や背後から一生懸命走り行く。</text><text x="90" y="500" font-size="28">まるで、人生のスタートラインのように。</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">私は、いつまでも、後方を保ち、</text><text x="90" y="620" font-size="28">唯、前に、前進するだけ。</text><text x="90" y="660" font-size="28">唯、それだけ。</text><text x="90" y="945" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>