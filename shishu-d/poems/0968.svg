<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1570" viewBox="0 0 1000 1570"><rect width="1000" height="1570" fill="#fffafd"/><rect x="28" y="28" width="944" height="1514" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0968</text><text x="90" y="155" font-size="34">亡くなる方へ</text><text x="90" y="220" font-size="28">お疲れ様でした</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">涙を見せてはいけない</text><text x="90" y="340" font-size="28">目的を達成した人も</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">していない人も</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">苦を残さず</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">どうか、浄化されてください</text><text x="90" y="620" font-size="28">本当にお疲れ様でした</text><text x="90" y="660" font-size="28">過去の経験は未来の糧になります</text><text x="90" y="700" font-size="28">未来は明るいです</text><text x="90" y="740" font-size="28">故郷に帰り</text><text x="90" y="780" font-size="28"></text><text x="90" y="820" font-size="28">本来、来た道を帰って下さい</text><text x="90" y="860" font-size="28">懐かしい故郷</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">癒しの空間にみたされて</text><text x="90" y="980" font-size="28">バトンを手渡して</text><text x="90" y="1020" font-size="28">長い長い眠りについて</text><text x="90" y="1060" font-size="28">長かった人生のたびの終止符</text><text x="90" y="1100" font-size="28">いつでも、故郷であなたを</text><text x="90" y="1140" font-size="28">待っています</text><text x="90" y="1180" font-size="28"></text><text x="90" y="1220" font-size="28">早く行くほど、安心して</text><text x="90" y="1260" font-size="28">ソウルと呼ばれる</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">似た魂が出迎えてくれます</text><text x="90" y="1380" font-size="28">長い長い眠りにつき</text><text x="90" y="1420" font-size="28"></text><text x="90" y="1460" font-size="28">未来世でも素晴らしい活躍を</text><text x="90" y="1500" font-size="28">私たち、みんなは期待してます</text><text x="90" y="1515" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>