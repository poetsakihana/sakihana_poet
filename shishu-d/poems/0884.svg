<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010"><rect width="1000" height="1010" fill="#fffafd"/><rect x="28" y="28" width="944" height="954" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0884</text><text x="90" y="155" font-size="34">新橋</text><text x="90" y="220" font-size="28">東京の玄関口</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">新たな橋は東京の芝口にあたる</text><text x="90" y="340" font-size="28">それは東京の中心橋</text><text x="90" y="380" font-size="28"></text><text x="90" y="420" font-size="28">染地と銀座をまたぐ</text><text x="90" y="460" font-size="28"></text><text x="90" y="500" font-size="28">大事な橋</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">みなさんの近くにも</text><text x="90" y="620" font-size="28">この橋がなければと</text><text x="90" y="660" font-size="28">思える大事な橋あると思います</text><text x="90" y="700" font-size="28">以外にも最近の橋かも</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">知れません</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">橋はそれほど大切にして</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">人を支えてきた歴史的な財産でもあるんです</text><text x="90" y="955" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>