<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410"><rect width="1000" height="1410" fill="#fffafd"/><rect x="28" y="28" width="944" height="1354" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0847</text><text x="90" y="155" font-size="34">哀れみ</text><text x="90" y="220" font-size="28">大切な人を残念だな</text><text x="90" y="260" font-size="28">哀しいなぁ</text><text x="90" y="300" font-size="28">そう心の渦巻きが</text><text x="90" y="340" font-size="28">グルグルと</text><text x="90" y="380" font-size="28">飲み込まれるように</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">大切な人だからこそ</text><text x="90" y="500" font-size="28">残念さきが大きい</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">どうしてあげたら</text><text x="90" y="620" font-size="28">代わもりをしてあげたい</text><text x="90" y="660" font-size="28">そんな気持ちになる</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">哀しみが膨大になると</text><text x="90" y="780" font-size="28">自分までも惨めで</text><text x="90" y="820" font-size="28">哀しくなってしまう</text><text x="90" y="860" font-size="28">それは自我の責任かも</text><text x="90" y="900" font-size="28">その通りだけど</text><text x="90" y="940" font-size="28">代わってあげたい</text><text x="90" y="980" font-size="28">大きな大きな</text><text x="90" y="1020" font-size="28">希望の道標を</text><text x="90" y="1060" font-size="28">誘いいぎな)えたら</text><text x="90" y="1100" font-size="28">どんなに晴れるだろう</text><text x="90" y="1140" font-size="28">雨だった気持ちの天気が</text><text x="90" y="1180" font-size="28">太陽さんが顔を出す</text><text x="90" y="1220" font-size="28">大切なあなたへ</text><text x="90" y="1260" font-size="28">希望を与えたい</text><text x="90" y="1300" font-size="28"></text><text x="90" y="1340" font-size="28">そんな強い気持ちです</text><text x="90" y="1355" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>