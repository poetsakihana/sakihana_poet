<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170"><rect width="1000" height="1170" fill="#fffafd"/><rect x="28" y="28" width="944" height="1114" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0670</text><text x="90" y="155" font-size="34">魔女</text><text x="90" y="220" font-size="28">魔法使いにホウキにまたがり</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">空を自由に飛べる</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">それは、常識を</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">くつがえした考え</text><text x="90" y="500" font-size="28"></text><text x="90" y="540" font-size="28">魔法少女に</text><text x="90" y="580" font-size="28"></text><text x="90" y="620" font-size="28">カラスを仕え</text><text x="90" y="660" font-size="28"></text><text x="90" y="700" font-size="28">魔法をあらゆる</text><text x="90" y="740" font-size="28"></text><text x="90" y="780" font-size="28">場面で使い続ける</text><text x="90" y="820" font-size="28"></text><text x="90" y="860" font-size="28">人は魔法使いになりたいと</text><text x="90" y="900" font-size="28"></text><text x="90" y="940" font-size="28">憧れの存在人</text><text x="90" y="980" font-size="28">架空の魔物で近。</text><text x="90" y="1020" font-size="28">決して現実ではない</text><text x="90" y="1060" font-size="28">守空の魔物だから</text><text x="90" y="1100" font-size="28">憧れるんでしょう</text><text x="90" y="1115" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>