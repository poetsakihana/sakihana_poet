<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250"><rect width="1000" height="1250" fill="#fffafd"/><rect x="28" y="28" width="944" height="1194" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0559</text><text x="90" y="155" font-size="34">服のない子</text><text x="90" y="220" font-size="28">どうして、そこまでも</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">あなたは、体をはって田畑を耕して</text><text x="90" y="340" font-size="28">服がないのにも関わらず必死になって</text><text x="90" y="380" font-size="28">あなたは、頑張らないとと</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">見ると涙が出そをそうでたまりません</text><text x="90" y="500" font-size="28">服ももらえないその子は、</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">一生懸命、鍛を持って汗を流して</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">只、地面を見つめて耕していた</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">私は、どうする事もどう対処することも</text><text x="90" y="780" font-size="28">私には、できないその辛さが</text><text x="90" y="820" font-size="28">変わりに変わってあなたの変わりに</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">なれるのならとただ、畑の側で</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">見守るばかりだった服にこだわっている</text><text x="90" y="1020" font-size="28"></text><text x="90" y="1060" font-size="28">私達、日本人は、とても裕福な生活を</text><text x="90" y="1100" font-size="28">していることが私には、わかった</text><text x="90" y="1140" font-size="28">ありがたみがよくわかった。</text><text x="90" y="1180" font-size="28">ありがとう、日本ごめんね、服のない子</text><text x="90" y="1195" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>