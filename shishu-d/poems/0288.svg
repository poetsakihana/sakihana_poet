<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090"><rect width="1000" height="1090" fill="#fffafd"/><rect x="28" y="28" width="944" height="1034" rx="28" fill="none" stroke="#efc9db" stroke-width="2"/><g aria-hidden="true"><path d="M860 85 C830 60 813 91 860 120 C907 91 890 60 860 85Z" fill="#f3c6db"/><circle cx="916" cy="142" r="6" fill="#f7dfb9"/><circle cx="895" cy="50" r="4" fill="#e4d6ed"/></g><g fill="#71455d" font-family="serif"><text x="90" y="90" font-size="18" fill="#b56c92">SAKIHANA · 詩集 D · 0288</text><text x="90" y="155" font-size="34">紛らい</text><text x="90" y="220" font-size="28">紛らい</text><text x="90" y="260" font-size="28"></text><text x="90" y="300" font-size="28">紛ちらいは、相手を誤魔化す。</text><text x="90" y="340" font-size="28"></text><text x="90" y="380" font-size="28">紛らいは、相手を冗談と同じ。</text><text x="90" y="420" font-size="28"></text><text x="90" y="460" font-size="28">紛ちらいは、愛を避ける。[</text><text x="90" y="500" font-size="28">紛らいは、糸を分けると書き、</text><text x="90" y="540" font-size="28"></text><text x="90" y="580" font-size="28">糸が裂けたように二つ三つに分けること。</text><text x="90" y="620" font-size="28"></text><text x="90" y="660" font-size="28">なら、</text><text x="90" y="700" font-size="28"></text><text x="90" y="740" font-size="28">紛らいは、相手を幸せにする事にも例えられる。</text><text x="90" y="780" font-size="28">全うから相手の誤りの考えを紛らい、</text><text x="90" y="820" font-size="28">正しく導けば出来る。</text><text x="90" y="860" font-size="28"></text><text x="90" y="900" font-size="28">日本の言語は、面白い…</text><text x="90" y="940" font-size="28"></text><text x="90" y="980" font-size="28">紛ちいは、人を悩ませ、反では、楽しませる。</text><text x="90" y="1020" font-size="28">紛ちらいは、面白い…。</text><text x="90" y="1035" font-size="16" fill="#b56c92">公式恋愛詩人 咲華　｜　文字データからの再組版</text></g></svg>