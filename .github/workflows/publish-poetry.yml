name: Publish poetry website
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-poetry.yml', 'shishu-d/**', '_site-import/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install complete collection D in repository
        shell: python
        run: |
          import pathlib, tarfile, io, urllib.request, concurrent.futures, subprocess, shutil, json, time
          root=pathlib.Path('shishu-d')
          raw=b''.join(p.read_bytes() for p in sorted(pathlib.Path('_site-import').glob('collection-d.part*')))
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as t:
            for m in t.getmembers():
              assert m.name.startswith('shishu-d/') and '..' not in pathlib.PurePosixPath(m.name).parts
              assert m.isfile()
            t.extractall('.',filter='data')
          vendor=root/'vendor';vendor.mkdir(exist_ok=True)
          urls={
            'tesseract.min.js':'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js',
            'worker.min.js':'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js',
            'tesseract-core-lstm.wasm.js':'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/tesseract-core-lstm.wasm.js',
            'tesseract-core-lstm.wasm':'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/tesseract-core-lstm.wasm',
            'jpn.traineddata.gz':'https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn@1.0.0/4.0.0_best_int/jpn.traineddata.gz',
            'LICENSE-tesseract.txt':'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/LICENSE.md',
            'LICENSE-core.txt':'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/LICENSE'}
          def get(item):
            name,url=item
            if (vendor/name).is_file(): return
            for attempt in range(4):
              try:
                with urllib.request.urlopen(url,timeout=60) as r: data=r.read()
                (vendor/name).write_bytes(data);return
              except Exception:
                if attempt==3: raise
                time.sleep(2**attempt)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
            list(pool.map(get,urls.items()))
          poems=json.loads((root/'poems.json').read_text())
          assert len(poems)==2183 and len({p['id'] for p in poems})==2183
          assert all((root/p['image']).is_file() for p in poems)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','shishu-d'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
            subprocess.run(['git','commit','-m','Store complete collection D website with 2183 poem images and local OCR'],check=True)
            subprocess.run(['git','push','origin','HEAD:main'],check=True)
          out=pathlib.Path('public');out.mkdir()
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          for name in filter(None,tracked):
            if name.split('/')[0] in ('.github','_site-import','.openai'): continue
            src=pathlib.Path(name)
            if not src.is_file():continue
            target=out/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,target)
          (out/'.nojekyll').touch()
          assert (out/'index.html').is_file() and (out/'shishu-d/index.html').is_file()
          print('Verified 2183 poems and complete static website.')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
